<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectrum Public Access</title>
<meta name="description" content="Spectrum Public Access — watch the stream, or dive into Feeling Fishy, an interactive community aquarium where every fish is hand-drawn by a real participant.">
<link rel="icon" type="image/png" href="images/logo.png">

<!-- Social share preview (Facebook, Discord, Slack, iMessage, etc.) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Spectrum Public Access">
<meta property="og:title" content="Spectrum Public Access">
<meta property="og:description" content="Watch the stream, or dive into Feeling Fishy, an interactive community aquarium where every fish is hand-drawn by a real participant.">
<meta property="og:image" content="images/logo.png">
<!-- ✏️ Add og:url once you have a real deployed domain, e.g.
     <meta property="og:url" content="https://your-domain-here/"> —
     most platforms will still resolve og:image fine without it, but
     og:url itself should be set explicitly once you know it. -->

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Spectrum Public Access">
<meta name="twitter:description" content="Watch the stream, or dive into Feeling Fishy, an interactive community aquarium where every fish is hand-drawn by a real participant.">
<meta name="twitter:image" content="images/logo.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Sixtyfour&family=VT323&family=Space+Grotesk:wght@400;500;700&display=swap');

/* The logo's real typeface. Shows if installed on the viewer's machine;
   upload the .ttf and it can be embedded here so it works for everyone. */
@font-face{
  font-family:'Alarm Clock';
  src:local('Alarm Clock'), local('alarm clock'), local('AlarmClock');
}

:root{
  --cg-white:#ede9df;
}

*{box-sizing:border-box;}
/* Background lives on body ONLY, and body must stay a full-width block —
   putting display:flex on <html> makes <body> shrink-wrap its content,
   which painted the gradient in a centered column (the "box"). */
html{ margin:0; padding:0; }
body{
  margin:0; min-height:100vh;
  background:
    radial-gradient(ellipse at 50% -10%, #2a3550 0%, #0c0f18 60%, #050609 100%);
  font-family:'Space Grotesk',sans-serif;
  color:var(--cg-white);
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  overflow-x:hidden;
}

/* faint full-page scanlines + vignette so the whole page feels like a broadcast */
body:before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
  background:repeating-linear-gradient(
    to bottom, rgba(0,0,0,.14) 0px, rgba(0,0,0,.14) 1px,
    transparent 2px, transparent 4px);
}
body:after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
  background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.55) 100%);
}

.stage{
  display:flex; flex-direction:column; align-items:center; gap:56px;
  width:100%;
}

/* ---------- NEON LOGO ----------
   The glow is baked into the PNG itself (soft yellow halo pre-rendered
   around the letters, fading to fully transparent) — no CSS drop-shadow.
   CSS glow filters were clipping at the image rectangle and drawing a
   visible box behind the logo; a baked glow blends seamlessly. */
.logo{
  width:min(880px, 94vw); /* canvas includes glow padding; letters read ~same size as before */
  height:auto;
  animation:
    neonOn 2s steps(1,end) both,
    neonBreathe 6s ease-in-out 2s infinite;
}

/* neon tube striking on: dead → sputter → hold */
@keyframes neonOn{
  0%,14%{ opacity:0; }
  16%  { opacity:.55; }
  21%  { opacity:.08; }
  27%  { opacity:.75; }
  32%  { opacity:.15; }
  36%  { opacity:.9; }
  41%  { opacity:.4; }
  46%,100% { opacity:1; }
}

/* settled tube hum */
@keyframes neonBreathe{
  0%,100%{ opacity:1; }
  50%{ opacity:.9; }
}

/* ---------- THE OPTIONS ---------- */
.options{
  display:flex; gap:36px; flex-wrap:wrap; justify-content:center;
}

/* One shared rule for every link, instead of one hand-written rule
   (plus a matching :hover rule) per link. Each button gets its own
   glow color and its own stagger delay entirely from two inline
   custom properties — --opt-rgb and --opt-delay — set once in JS
   from the LINKS array below. Adding a new link never touches this
   CSS at all. The ", 255,255,255" after each var(--opt-rgb) is just
   a fallback in case that property is ever missing. */
.opt{
  font-family:'Alarm Clock','Sixtyfour',monospace;
  font-size:clamp(14px, 2.4vw, 21px);
  letter-spacing:.08em;
  text-transform:uppercase;
  text-decoration:none;
  padding:20px 30px;
  border:2px solid currentColor;
  border-radius:14px;
  opacity:0;
  /* iOS Safari can leave its own gray tap-highlight overlay sitting
     on a link after tapping it, especially when the tap doesn't lead
     to a normal page navigation (the "Watch the Stream" button's own
     click handler calls preventDefault() to open the pop-up instead)
     — this stops the browser from drawing that overlay at all rather
     than relying on it to clear itself afterward. */
  -webkit-tap-highlight-color:transparent;
  color:rgb(var(--opt-rgb, 255,255,255));
  text-shadow:0 0 6px rgba(var(--opt-rgb, 255,255,255),.7), 0 0 20px rgba(var(--opt-rgb, 255,255,255),.3);
  box-shadow:0 0 14px rgba(var(--opt-rgb, 255,255,255),.25), inset 0 0 14px rgba(var(--opt-rgb, 255,255,255),.15);
  transition:transform .12s ease;
  animation:optOn .7s steps(1,end) forwards;
  animation-delay:var(--opt-delay, 0s);
}
.opt:active{ transform:scale(.97); }
/* Not :focus-visible — Safari has matched that pseudo-class for a
   plain programmatic .focus() call before now (see the JS), which
   left a stuck outline ring around "Watch the Stream" after closing
   the stream pop-up once, even on a tap/touch visit that never
   touched a keyboard. body.keyboard-nav is our own explicit signal
   instead, so this only shows for a real Tab user. */
.opt:focus{ outline:none; }
body.keyboard-nav .opt:focus{ outline:3px solid var(--cg-white); outline-offset:4px; }
.opt:hover{
  text-shadow:0 0 8px rgba(var(--opt-rgb, 255,255,255),.95), 0 0 30px rgba(var(--opt-rgb, 255,255,255),.5);
  box-shadow:0 0 26px rgba(var(--opt-rgb, 255,255,255),.45), inset 0 0 20px rgba(var(--opt-rgb, 255,255,255),.25);
}

@keyframes optOn{
  0%{opacity:0;} 20%{opacity:.6;} 35%{opacity:.1;} 55%{opacity:.8;} 70%{opacity:.3;} 100%{opacity:1;}
}

/* Plain, static styling for the noscript fallback below — no glow
   colors to assign since there's no JS running to hand them out. */
.opt-fallback{
  display:inline-block; margin:8px;
  font-family:'Alarm Clock','Sixtyfour',monospace;
  font-size:clamp(14px, 2.4vw, 21px);
  letter-spacing:.08em;
  text-transform:uppercase;
  text-decoration:none;
  padding:20px 30px;
  border:2px solid var(--cg-white);
  border-radius:14px;
  color:var(--cg-white);
}

/* reduced motion: no flicker, everything simply on */
@media (prefers-reduced-motion: reduce){
  .logo{ animation:none; opacity:1; }
  .opt{ animation:none !important; opacity:1 !important; }
}

/* ---------- MOBILE ----------
   Stacks the buttons into one even column instead of the desktop's
   wrapped row — at a phone width they were wrapping onto three
   ragged, differently-sized lines that together ran taller than the
   viewport. A smaller logo plus a tighter stage gap brings the whole
   page comfortably under any phone's visible height with no scroll,
   and every button shares the same width instead of hugging its own
   label's length. */
@media (max-width: 640px){
  body{ padding:20px; }
  .stage{ gap:32px; }
  .logo{ width:min(300px, 85vw); }
  .options{
    flex-direction:column;
    width:100%;
    max-width:300px;
    gap:14px;
  }
  .opt, .opt-fallback{
    width:100%;
    box-sizing:border-box;
    text-align:center;
    padding:16px 20px;
  }
}

/* ---------- STREAM POP-UP ----------
   "Watch the Stream" plays here instead of leaving the page, once
   there's a real live URL to embed (see LINKS' popup/popupEmbed). */
.stream-modal{
  display:none;
  position:fixed; inset:0; z-index:100;
  align-items:center; justify-content:center;
  padding:24px;
}
.stream-modal.open{ display:flex; }
.stream-modal-backdrop{
  position:absolute; inset:0;
  background:rgba(5,6,9,.88);
}
.stream-modal-box{
  position:relative;
  width:min(1000px, 100%);
}
.stream-modal-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:14px;
  overflow:hidden;
  background:#000;
  box-shadow:0 0 24px rgba(255,238,60,.35), 0 0 70px rgba(0,0,0,.6);
  border:2px solid rgba(255,238,60,.6);
}
.stream-modal-frame iframe{
  position:absolute; inset:0; width:100%; height:100%; border:0; z-index:0;
}
/* Invisible layer over the whole video, permanently intercepting
   every tap/click there. It used to step aside (display:none) once
   the corner buttons were revealed, so a tap could reach the real
   YouTube iframe underneath — that was needed back when YouTube's
   OWN controls (mute, play/pause, fullscreen) were still the way to
   interact with the video. Now that controls=0 above replaces all of
   that with the buttons in this frame, direct interaction with the
   iframe is never actually needed — keeping this layer permanently
   in the way means no tap ever reaches YouTube's own player at all,
   which also stops its hover/tap-triggered title+channel overlay
   from ever appearing (the whole reason this changed).
   Trade-off worth knowing about: this reintroduces a permanently-
   composited layer over the iframe, which was specifically avoided
   before as a plausible (never fully confirmed) cause of audio
   cutting out on iOS — Safari has been known to pause video it
   considers occluded by overlapping content. If that resurfaces, the
   custom play/mute buttons here can recover it immediately either
   way, unlike before when YouTube's own controls were hard to reach
   at all — worth keeping an eye on regardless. */
.stream-modal-wake{
  display:block;
  position:absolute; inset:0; z-index:1;
}
/* Sit inside the frame's own rounded corners rather than floating
   above it, so they're never clipped by a short viewport on mobile.
   Fade out after a few seconds idle (see the JS) so they don't sit
   on top of the video the whole time it's open — same idea as a
   video player's own auto-hiding controls. This whole set (mute,
   play/pause, fullscreen) replaces YouTube's own controls entirely
   (controls=0 on the src) — its native mute icon turned out to be
   unreachable at this size on at least one real phone, and this is
   the channel's own content on its own site, so there's no need for
   YouTube's control bar/branding here at all; these call the wrapped
   player directly instead. */
.stream-modal-close, .stream-modal-mute, .stream-modal-playpause, .stream-modal-fullscreen{
  position:absolute; z-index:2;
  width:36px; height:36px;
  border-radius:50%;
  border:2px solid var(--cg-white);
  background:rgba(5,6,9,.7);
  color:var(--cg-white);
  font-size:22px; line-height:1;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  opacity:1;
  transition:opacity .3s ease;
}
.stream-modal-close{ top:10px; right:10px; }
.stream-modal-mute{ top:10px; left:10px; }
.stream-modal-playpause{ bottom:10px; left:10px; }
.stream-modal-fullscreen{ bottom:10px; right:10px; }
.stream-modal-close:hover, .stream-modal-mute:hover,
.stream-modal-playpause:hover, .stream-modal-fullscreen:hover{ background:rgba(255,238,60,.2); }
/* Same reasoning as .opt:focus above — these are also focused/
   toggled programmatically, so they use the same explicit signal
   rather than :focus-visible. */
.stream-modal-close:focus, .stream-modal-mute:focus,
.stream-modal-playpause:focus, .stream-modal-fullscreen:focus{ outline:none; }
body.keyboard-nav .stream-modal-close:focus,
body.keyboard-nav .stream-modal-mute:focus,
body.keyboard-nav .stream-modal-playpause:focus,
body.keyboard-nav .stream-modal-fullscreen:focus{ outline:3px solid var(--cg-white); outline-offset:3px; }
/* Stay clickable/hoverable at full opacity 0 too (no pointer-events:
   none) — they're small, predictable corner targets, and the wake
   layer above sits below them (z-index 1 vs 2), so it never blocks
   the buttons themselves. */
.stream-modal.close-idle .stream-modal-close,
.stream-modal.close-idle .stream-modal-mute,
.stream-modal.close-idle .stream-modal-playpause,
.stream-modal.close-idle .stream-modal-fullscreen{ opacity:0; }
@media (prefers-reduced-motion: reduce){
  .stream-modal-close, .stream-modal-mute,
  .stream-modal-playpause, .stream-modal-fullscreen{ transition:none; }
}
</style>
</head>
<body>

<main class="stage">
  <img class="logo" src="images/logo.png" alt="Spectrum Public Access">

  <nav class="options" id="options" aria-label="Choose an experience">
    <!-- Shown only if JS is disabled — replaced the instant the
         script below runs. Kept in sync by hand since it's a rare,
         static fallback, not the real navigation. -->
    <noscript>
      <a class="opt-fallback" href="https://www.youtube.com/live/ow3RDIXTPXk">WATCH THE STREAM</a>
      <a class="opt-fallback" href="/feeling-fishy">FEELING FISHY</a>
      <a class="opt-fallback" href="https://eatswithpete.com">EATS WITH PETE</a>
    </noscript>
  </nav>
</main>

<div class="stream-modal" id="streamModal" role="dialog" aria-modal="true" aria-label="Watch the Stream">
  <div class="stream-modal-backdrop"></div>
  <div class="stream-modal-box">
    <div class="stream-modal-frame">
      <iframe id="streamModalIframe" title="Live stream"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      <div class="stream-modal-wake" id="streamModalWake"></div>
      <button class="stream-modal-mute" id="streamModalMute" type="button" aria-label="Unmute">🔇</button>
      <button class="stream-modal-close" id="streamModalClose" type="button" aria-label="Close">&times;</button>
      <button class="stream-modal-playpause" id="streamModalPlayPause" type="button" aria-label="Pause">⏸</button>
      <button class="stream-modal-fullscreen" id="streamModalFullscreen" type="button" aria-label="Fullscreen">⛶</button>
    </div>
  </div>
</div>

<script>
/* ██████████████████████████████████████████████████████████████
   ██  YOUR LINKS — add a new destination any time              ██
   ██  Everything below renders and staggers itself from this.  ██
   ██████████████████████████████████████████████████████████████
   label    — button text (rendered in caps regardless of case here)
   href     — where it goes; leave null to keep it unlinked/inert
              for now, e.g. for a destination whose page doesn't exist yet
   rgb      — "R,G,B" for this button's neon color — the only place
              that color is ever written; every glow/hover effect
              is computed from it, so nothing can drift out of sync
   external — true opens it in a new tab (for links off this domain)
   popup    — true plays it in the on-page pop-up instead of
              navigating (see popupEmbed below and .stream-modal in
              the CSS); href/external stay set alongside it as the
              fallback for a middle-click, Ctrl/Cmd-click, or no-JS
   popupEmbed — the embeddable URL for a popup link (YouTube's
              /embed/VIDEO_ID form, not the regular watch/live URL) */
const LINKS = [
  // Plays inline for now — swap this for the real live-channel-
  // switcher page once that's built (drop `popup`/`popupEmbed` to
  // just navigate to `href` instead). The si= value is YouTube's own
  // share-embed token for this video (from Share -> Embed) — plain
  // /embed/VIDEO_ID URLs without it hit YouTube's Error 153 for this
  // stream even with embedding allowed, but the official share link
  // works, so this matches that exactly rather than a param-stripped
  // version of it — don't drop or reorder these params without
  // re-testing on a real phone. mute=1 + playsinline=1 are both there
  // for mobile autoplay (same reason the background video elsewhere
  // on this site is muted+playsinline) — visitors can unmute from
  // the mute button below instead of YouTube's own. enablejsapi=1
  // lets the JS below wrap this iframe with YouTube's IFrame Player
  // API, so we have playback visibility and can drive it directly.
  // controls=0 hides YouTube's own control bar/branding entirely —
  // the mute/play-pause/fullscreen buttons below replace it, since
  // this is the channel's own content on its own site.
  { label: "Watch the Stream", href: "https://www.youtube.com/live/ow3RDIXTPXk", rgb: "255,238,60", external: true,
    popup: true, popupEmbed: "https://www.youtube.com/embed/ow3RDIXTPXk?si=NgFK3XYpDQOLObrl&autoplay=1&mute=1&playsinline=1&enablejsapi=1&controls=0" },  // SPA logo yellow
  { label: "Feeling Fishy",    href: "/feeling-fishy",             rgb: "61,217,255", external: true },  // Feeling Fishy title glow — new tab too, so this hub page stays put as a home base
  { label: "Eats with Pete",   href: "https://eatswithpete.com",   rgb: "255,107,71", external: true },
];

const BASE_DELAY = 2.15; // seconds before the first button starts flickering in
const STEP_DELAY = 0.3;  // gap between each button after that

// Tracks whether the visitor is currently navigating with a keyboard,
// so the focus outlines above (body.keyboard-nav ...) only show when
// they're actually useful — see the CSS for why this exists instead
// of just using :focus-visible directly.
window.addEventListener("keydown", (e) => {
  if (e.key === "Tab") document.body.classList.add("keyboard-nav");
});
window.addEventListener("pointerdown", () => {
  document.body.classList.remove("keyboard-nav");
});

const optionsNav = document.getElementById("options");
optionsNav.innerHTML = ""; // clears the noscript fallback now that JS is running
LINKS.forEach((link, i) => {
  const a = document.createElement("a");
  a.className = "opt";
  a.textContent = link.label;
  a.style.setProperty("--opt-rgb", link.rgb);
  const delay = BASE_DELAY + i * STEP_DELAY;
  a.style.setProperty("--opt-delay", delay.toFixed(2) + "s");
  if (link.href) a.href = link.href;
  if (link.external) {
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.setAttribute("aria-label", link.label + (link.popup ? " — plays in a pop-up" : " — opens in a new tab"));
  }
  if (link.popup) {
    a.addEventListener("click", (e) => {
      // Middle-click, Ctrl/Cmd-click, etc. — let the browser open the
      // real href in a new tab as usual instead of hijacking it.
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      openStreamModal(link.popupEmbed, a);
    });
  }
  optionsNav.appendChild(a);
  // Safety net: the flicker-in animation (steps(1,end) across several
  // keyframes) has been observed getting stuck at an intermediate
  // keyframe on Chrome for iOS — animationPlayState still reports
  // "running", but the value never advances to the final 100% stop,
  // leaving the button looking permanently dim. Rather than chase
  // whatever causes that stall, force the correct end state once the
  // animation should be done, regardless of whether it actually
  // finished on its own.
  // Killing the animation first is required, not optional — a still-
  // "running" CSS animation outranks a plain inline style in the
  // cascade, so just setting opacity here (an earlier attempt at this
  // fix) was being silently overridden right back to the animation's
  // stuck value the instant it ran.
  const ANIMATION_DURATION = 0.7;
  setTimeout(() => {
    a.style.animation = "none";
    a.style.opacity = "1";
  }, (delay + ANIMATION_DURATION) * 1000);
});

/* ---------- STREAM POP-UP ---------- */
const streamModal = document.getElementById("streamModal");
const streamModalIframe = document.getElementById("streamModalIframe");
const streamModalClose = document.getElementById("streamModalClose");
const streamModalMute = document.getElementById("streamModalMute");
const streamModalPlayPause = document.getElementById("streamModalPlayPause");
const streamModalFullscreen = document.getElementById("streamModalFullscreen");
let streamModalTrigger = null; // where focus returns to on close

/* YouTube IFrame Player API — wraps the EXISTING iframe (its src
   already has enablejsapi=1 baked in above) to get playback state/
   error visibility, and to drive the mute button below directly.
   Doesn't create a different iframe or change what src is used — the
   working si=... URL that fixed Error 153 stays exactly as it was
   tested. Loaded proactively at page load (not on first open) so
   YT.Player is already available by the time the modal opens, rather
   than racing to load it after autoplay has already started. */
const YT_STATE_LABELS = { "-1": "UNSTARTED", 0: "ENDED", 1: "PLAYING", 2: "PAUSED", 3: "BUFFERING", 5: "CUED" };
let ytApiPromise = null;
function loadYouTubeApi() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve) => {
    const prevReady = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => {
      if (prevReady) prevReady();
      resolve();
    };
    const script = document.createElement("script");
    script.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(script);
  });
  return ytApiPromise;
}
loadYouTubeApi();

let ytPlayer = null;
// Read by the debug panel further down — kept as a plain object
// (rather than querying ytPlayer directly there) since isMuted()/
// getVolume() throw if called at the wrong moment in the player's
// lifecycle, and this is the one place already handling that.
const streamPlayerDebug = { state: null, muted: null, volume: null, lastError: null };
function wrapStreamIframe() {
  loadYouTubeApi().then(() => {
    // The modal may have been closed (iframe src cleared) before the
    // API finished loading — don't wrap a blank iframe.
    if (!streamModal.classList.contains("open")) return;
    ytPlayer = new YT.Player(streamModalIframe, {
      events: {
        onStateChange: (e) => {
          streamPlayerDebug.state = e.data;
          updatePlayPauseIcon();
        },
        onError: (e) => { streamPlayerDebug.lastError = e.data; },
      },
    });
  });
}

/* Mute toggle — the src above already starts muted (required for
   autoplay to work at all on mobile), so visitors need a way to turn
   sound on. YouTube's own in-player mute icon turned out to be
   unreachable at this pop-up's small size on at least one real phone
   (only reachable through fullscreen), so this drives the wrapped
   player directly instead of depending on it. Tracks mute state in
   plain JS rather than asking the player with isMuted() — that
   throws if called before the player's truly ready, and this button
   already knows its own state without needing to ask. */
let streamMuted = true; // matches mute=1 in the src above
function setStreamMuted(muted) {
  if (!ytPlayer) return;
  streamMuted = muted;
  if (muted) ytPlayer.mute(); else ytPlayer.unMute();
  streamModalMute.textContent = muted ? "🔇" : "🔊";
  const label = muted ? "Unmute" : "Mute";
  streamModalMute.title = label;
  streamModalMute.setAttribute("aria-label", label);
}
streamModalMute.addEventListener("click", (e) => {
  e.stopPropagation();
  setStreamMuted(!streamMuted);
});
setInterval(() => {
  if (!ytPlayer || !ytPlayer.isMuted) return;
  try {
    streamPlayerDebug.muted = ytPlayer.isMuted();
    streamPlayerDebug.volume = ytPlayer.getVolume();
  } catch (e) { /* not ready yet */ }
}, 500);

/* Play/pause toggle — replaces YouTube's own (controls=0 above). Icon
   reflects the player's actual state (updated from onStateChange, not
   just on click), so it stays correct if playback changes for some
   other reason, e.g. buffering. */
function updatePlayPauseIcon() {
  const playing = streamPlayerDebug.state === 1 || streamPlayerDebug.state === 3; // PLAYING or BUFFERING
  streamModalPlayPause.textContent = playing ? "⏸" : "▶";
  const label = playing ? "Pause" : "Play";
  streamModalPlayPause.title = label;
  streamModalPlayPause.setAttribute("aria-label", label);
}
streamModalPlayPause.addEventListener("click", (e) => {
  e.stopPropagation();
  if (!ytPlayer) return;
  if (streamPlayerDebug.state === 1 || streamPlayerDebug.state === 3) ytPlayer.pauseVideo();
  else ytPlayer.playVideo();
});

/* Fullscreen — also replaces YouTube's own (controls=0 above).
   Targets the iframe itself (not a wrapping div) so fullscreen shows
   just the video, edge to edge. Support for fullscreening an
   arbitrary element (rather than a <video> specifically) is a fairly
   recent addition in Safari on iOS — falls back to silently doing
   nothing on a version that doesn't have it, rather than erroring. */
streamModalFullscreen.addEventListener("click", (e) => {
  e.stopPropagation();
  const request = streamModalIframe.requestFullscreen || streamModalIframe.webkitRequestFullscreen;
  if (!request) return;
  const result = request.call(streamModalIframe);
  if (result && result.catch) result.catch(() => {});
});

// Fades the close button after a few idle seconds so it isn't
// permanently sitting on top of the video — anything that happens on
// the parent page (moving over the backdrop, a key press, hovering
// the button itself, or a tap/click on the wake layer covering the
// video — see .stream-modal-wake in the CSS) brings it back. There's
// no way to detect real activity on the video itself from here (it's
// a cross-origin iframe), on any device — the wake layer works
// around that by catching the interaction before it ever reaches the
// iframe, rather than trying to detect one that already happened.
let closeIdleTimer = null;
function scheduleCloseIdle() {
  clearTimeout(closeIdleTimer);
  closeIdleTimer = setTimeout(() => streamModal.classList.add("close-idle"), 3000);
}
function wakeClose() {
  streamModal.classList.remove("close-idle");
  scheduleCloseIdle();
}
streamModal.addEventListener("pointermove", wakeClose);
// click rather than pointerdown: flipping the wake layer's
// pointer-events mid-gesture (between pointerdown and the click that
// follows) risks the browser re-targeting that same tap's click at
// the iframe underneath instead of consistently hitting the wake
// layer — click only fires once the whole gesture has resolved.
streamModal.addEventListener("click", wakeClose);
streamModal.addEventListener("keydown", wakeClose);
// Pauses the countdown while the cursor is resting directly on
// either button, rather than letting it fade out from under the
// pointer.
streamModalClose.addEventListener("pointerenter", wakeClose);
streamModalClose.addEventListener("pointerleave", scheduleCloseIdle);
streamModalMute.addEventListener("pointerenter", wakeClose);
streamModalMute.addEventListener("pointerleave", scheduleCloseIdle);
streamModalPlayPause.addEventListener("pointerenter", wakeClose);
streamModalPlayPause.addEventListener("pointerleave", scheduleCloseIdle);
streamModalFullscreen.addEventListener("pointerenter", wakeClose);
streamModalFullscreen.addEventListener("pointerleave", scheduleCloseIdle);

function openStreamModal(embedSrc, trigger) {
  streamModalTrigger = trigger;
  // Show the modal BEFORE pointing the iframe at YouTube — assigning
  // src while it's still display:none (zero-size, unrendered) is a
  // known way for mobile browsers to deprioritize or skip autoplay
  // eligibility for it entirely.
  streamModal.classList.add("open");
  streamModalIframe.src = embedSrc;
  streamModalClose.focus();
  wakeClose();
  wrapStreamIframe();
}
function closeStreamModal() {
  streamModal.classList.remove("open", "close-idle");
  clearTimeout(closeIdleTimer);
  streamModalIframe.src = ""; // stops playback rather than just hiding it
  // The wrapped player's underlying iframe is gone now — drop the
  // reference and reset its debug state rather than leaving stale
  // values on screen, so the next open starts from a clean wrap.
  ytPlayer = null;
  streamPlayerDebug.state = null;
  streamPlayerDebug.muted = null;
  streamPlayerDebug.volume = null;
  streamPlayerDebug.lastError = null;
  // The src it'll get on next open starts muted and playing again —
  // reset these to match rather than leaving stale icons from last
  // time.
  streamMuted = true;
  streamModalMute.textContent = "🔇";
  streamModalMute.title = "Unmute";
  streamModalMute.setAttribute("aria-label", "Unmute");
  streamModalPlayPause.textContent = "⏸";
  streamModalPlayPause.title = "Pause";
  streamModalPlayPause.setAttribute("aria-label", "Pause");
  if (streamModalTrigger && streamModalTrigger.focus) streamModalTrigger.focus();
}
streamModalClose.addEventListener("click", closeStreamModal);
document.querySelector(".stream-modal-backdrop").addEventListener("click", closeStreamModal);
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && streamModal.classList.contains("open")) closeStreamModal();
});

/* ---------- DEBUG PANEL ----------
   Only appears with ?debug=1 in the URL — a plain on-screen readout
   of what "Watch the Stream" is actually computing on a device we
   can't attach real devtools to, so a phone can just be photographed
   instead of needing to describe what something looks like. Doesn't
   cover the video's own mute/play state — that's cross-origin, not
   readable from here without switching to YouTube's IFrame Player
   API. Remove this whole block once the issues are tracked down. */
if (new URLSearchParams(location.search).has("debug")) {
  // Direct mute/unmute control via the wrapped player — YouTube's
  // own in-player mute icon can end up hidden at the pop-up's small
  // size (only reachable through fullscreen, which covers this whole
  // panel and defeats the point), so this bypasses it entirely.
  const controls = document.createElement("div");
  controls.style.cssText =
    "position:fixed; right:0; bottom:45vh; z-index:9999; " +
    "display:flex; gap:8px; padding:8px; background:rgba(0,0,0,.92);";
  ["Mute", "Unmute", "Play", "Pause"].forEach((label) => {
    const btn = document.createElement("button");
    btn.textContent = label;
    btn.style.cssText = "font:12px monospace; padding:6px 10px;";
    btn.addEventListener("click", () => {
      if (!ytPlayer) return;
      if (label === "Mute") ytPlayer.mute();
      else if (label === "Unmute") ytPlayer.unMute();
      else if (label === "Play") ytPlayer.playVideo();
      else if (label === "Pause") ytPlayer.pauseVideo();
    });
    controls.appendChild(btn);
  });
  document.body.appendChild(controls);

  const panel = document.createElement("pre");
  panel.style.cssText =
    "position:fixed; inset:auto 0 0 0; z-index:9999; margin:0; " +
    "max-height:45vh; overflow:auto; padding:10px; " +
    "background:rgba(0,0,0,.92); color:#7fff7f; " +
    "font:11px/1.5 monospace; white-space:pre-wrap; pointer-events:none;";
  document.body.appendChild(panel);
  const watchBtn = optionsNav.children[0];
  function updateDebugPanel() {
    const cs = getComputedStyle(watchBtn);
    const stateCode = streamPlayerDebug.state;
    const lines = [
      "-- Watch the Stream button --",
      "opacity: " + cs.opacity,
      "animationName: " + cs.animationName,
      "bodyClass: " + JSON.stringify(document.body.className),
      "",
      "-- stream pop-up --",
      "streamModal.open: " + streamModal.classList.contains("open"),
      "streamModal.close-idle: " + streamModal.classList.contains("close-idle"),
      "iframe.src: " + (streamModalIframe.src || "(empty)"),
      "ytPlayer wrapped: " + !!ytPlayer,
      "player state: " + stateCode + (stateCode != null ? " (" + (YT_STATE_LABELS[stateCode] || "?") + ")" : ""),
      "player muted: " + streamPlayerDebug.muted,
      "player volume: " + streamPlayerDebug.volume,
      "player lastError: " + streamPlayerDebug.lastError,
      "document.hidden: " + document.hidden,
    ];
    panel.textContent = lines.join("\n");
  }
  updateDebugPanel();
  setInterval(updateDebugPanel, 500);
}
</script>

</body>
</html>
