<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectrum Public Access</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&family=Sixtyfour&family=Space+Grotesk:wght@400;500;700&display=swap');

/* The logo's real typeface. Shows if installed on the viewer's machine;
   upload the .ttf and it can be embedded here so it works for everyone. */
@font-face{
  font-family:'Alarm Clock';
  src:local('Alarm Clock'), local('alarm clock'), local('AlarmClock');
}

:root{
  --cabinet-navy:#1b2436;
  --cabinet-navy-dark:#11172480;
  --phosphor-amber:#f2c744;
  --logo-yellow:#ffee3c;      /* SPA logo yellow (255,238,60) */
  --bar-cyan:#37b6c9;
  --bar-magenta:#c43e96;
  --cg-white:#ede9df;
  --screen-black:#050604;
}

*{box-sizing:border-box;}
/* Background on body only; body stays full-width (flex on <html> would
   shrink-wrap <body> and paint the gradient as a centered box). */
html{ margin:0; padding:0; height:100%; }
body{
  margin:0; height:100%;
  background:
    radial-gradient(ellipse at 50% -10%, #2a3550 0%, #0c0f18 60%, #050609 100%);
  font-family:'Space Grotesk',sans-serif;
  color:var(--cg-white);
  display:flex; align-items:center; justify-content:center;
  padding:10px;
  overflow:hidden; /* one page — no scroll */
}

/* ---------- TV CABINET ---------- */
.tv{
  position:relative;
  width:min(2000px, 98vw);
  height:calc(100vh - 20px);
  display:flex; flex-direction:column;
  background:
    linear-gradient(155deg,#232f47 0%, var(--cabinet-navy) 45%, #141b2b 100%);
  border-radius:28px;
  padding:16px 20px;
  box-shadow:
    0 30px 60px -20px rgba(0,0,0,.7),
    inset 0 2px 0 rgba(255,255,255,.06),
    inset 0 -6px 14px rgba(0,0,0,.5);
}
.tv:before{ /* brand plate — matches the segmented SPA logo lettering */
  content:"SPECTRUM PUBLIC ACCESS";
  position:absolute; top:6px; left:0; right:0;
  text-align:center;
  font-family:'Alarm Clock','Sixtyfour',monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--logo-yellow);
  text-shadow:0 0 5px rgba(255,238,60,.5), 0 0 14px rgba(255,238,60,.2);
}

.main-row{
  display:flex; gap:14px; margin-top:10px; align-items:stretch; justify-content:center;
  flex:1; min-height:0; /* row height = exactly the space left over — everything scales from this */
}

/* ---------- LEFT: picture dial panel ---------- */
.dials{
  flex:1; min-height:0;
  display:flex; flex-direction:column; gap:10px;
  background:linear-gradient(160deg,#232f47,#141b2b); border-radius:16px; padding:12px 14px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.06), inset 0 -6px 12px rgba(0,0,0,.5);
}
/* five vertical sliders side by side, like a little console */
.dial-bank{ flex:1; min-height:0; display:flex; justify-content:space-between; gap:6px; }
.dial-col{ flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0; }
.dial-col .dname{
  font-family:'VT323',monospace; font-size:12px; letter-spacing:.08em; color:#aab0c2;
  white-space:nowrap;
}
.dial-col .dval{
  font-family:'VT323',monospace; font-size:12px; letter-spacing:.06em;
  color:var(--phosphor-amber); white-space:nowrap;
}
.vdial{
  writing-mode:vertical-lr; direction:rtl; /* bottom = min, top = max */
  -webkit-appearance:none; appearance:none;
  width:26px; flex:1; min-height:60px;
  border-radius:5px; outline:none; cursor:pointer;
  background:
    linear-gradient(90deg, transparent calc(50% - 2px), #05070c calc(50% - 2px),
      #05070c calc(50% + 2px), transparent calc(50% + 2px)),
    repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 1px, transparent 1px 16px),
    linear-gradient(160deg,#1a2338,#10151f);
}
.vdial::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:24px; height:13px; border-radius:3px; cursor:grab;
  background:
    linear-gradient(180deg, transparent 42%, var(--logo-yellow) 42%, var(--logo-yellow) 58%, transparent 58%),
    linear-gradient(180deg,#4a5570 0%, #232c42 45%, #10141f 55%, #2b3448 100%);
  box-shadow:0 2px 6px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08);
}
.vdial::-moz-range-thumb{
  width:24px; height:13px; border-radius:3px; border:none; cursor:grab;
  background:
    linear-gradient(180deg, transparent 42%, var(--logo-yellow) 42%, var(--logo-yellow) 58%, transparent 58%),
    linear-gradient(180deg,#4a5570 0%, #232c42 45%, #10141f 55%, #2b3448 100%);
  box-shadow:0 2px 6px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08);
}
.vdial:focus-visible{ outline:2px solid var(--logo-yellow); outline-offset:3px; }
.dial-actions{ display:flex; gap:8px; }
.dial-actions .dbtn{ flex:1; margin-top:0; padding:8px 6px; }
.dials h4{
  margin:0; text-align:center; font-family:'VT323',monospace; letter-spacing:.2em;
  font-size:14px; color:var(--phosphor-amber);
}
.dial-row{ display:flex; flex-direction:column; gap:4px; }
.dial-row label{
  font-family:'VT323',monospace; font-size:15px; letter-spacing:.1em; color:#aab0c2;
  display:flex; justify-content:space-between;
}
.dial-row input[type=range], .speed-deck input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:2px;
  background:#0d1420; outline:none;
}
.dial-row input[type=range]::-webkit-slider-thumb, .speed-deck input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #f4eede, #b7ae94 70%);
  box-shadow:0 2px 4px rgba(0,0,0,.6); cursor:pointer;
}
.dial-row input[type=range]::-moz-range-thumb, .speed-deck input[type=range]::-moz-range-thumb{
  width:18px; height:18px; border-radius:50%; border:none;
  background:radial-gradient(circle at 35% 30%, #f4eede, #b7ae94 70%);
  box-shadow:0 2px 4px rgba(0,0,0,.6); cursor:pointer;
}
.dial-row input[type=range]:focus-visible, .speed-deck input[type=range]:focus-visible{ outline:2px solid var(--logo-yellow); outline-offset:3px; }
.dbtn{
  margin-top:2px; border:none; border-radius:8px; padding:10px 6px; cursor:pointer;
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; letter-spacing:.16em;
  color:#f5e9e2;
}
.dbtn:focus-visible{ outline:2px solid var(--logo-yellow); outline-offset:2px; }
.dbtn.degauss{
  background:linear-gradient(180deg,#c6463a,#7c1f18);
  box-shadow:0 4px 0 #4c110c;
}
.dbtn.degauss:active{ transform:translateY(3px); box-shadow:0 1px 0 #4c110c; }
.dbtn.reset{
  background:#2b3854; color:var(--cg-white);
  box-shadow:0 3px 0 #0d1420;
}
.dbtn.reset:active{ transform:translateY(3px); box-shadow:0 0 0 #0d1420; }

/* ---------- LEFT: mixing-desk volume fader ---------- */
.fader-panel{
  width:118px; flex:none;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  background:linear-gradient(160deg,#232f47,#141b2b); border-radius:16px; padding:14px 12px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.06), inset 0 -6px 12px rgba(0,0,0,.5);
}
.fader-panel h4{
  margin:0; text-align:center; font-family:'VT323',monospace; letter-spacing:.2em;
  font-size:14px; color:var(--phosphor-amber);
}
.fader-track-wrap{
  flex:1; min-height:170px; width:100%;
  display:flex; justify-content:center; align-items:stretch; gap:10px;
}
.fader-scale{
  display:flex; flex-direction:column; justify-content:space-between;
  padding:8px 0; text-align:right;
  font-family:'VT323',monospace; font-size:12px; color:#7d87a3;
}
/* vertical fader — channel-strip style */
.vfader{
  writing-mode:vertical-lr; direction:rtl; /* bottom = 0, top = 10 */
  -webkit-appearance:none; appearance:none;
  width:44px; height:100%;
  border-radius:6px; outline:none; cursor:pointer;
  background:
    /* centre groove */
    linear-gradient(90deg, transparent calc(50% - 3px), #05070c calc(50% - 3px),
      #05070c calc(50% + 3px), transparent calc(50% + 3px)),
    /* tick hash marks */
    repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 1px, transparent 1px 22px),
    linear-gradient(160deg,#1a2338,#10151f);
}
.vfader::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:40px; height:22px; border-radius:3px; cursor:grab;
  background:
    linear-gradient(180deg, transparent 45%, var(--logo-yellow) 45%, var(--logo-yellow) 55%, transparent 55%),
    linear-gradient(180deg,#4a5570 0%, #232c42 45%, #10141f 55%, #2b3448 100%);
  box-shadow:0 3px 8px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08);
}
.vfader::-moz-range-thumb{
  width:40px; height:22px; border-radius:3px; border:none; cursor:grab;
  background:
    linear-gradient(180deg, transparent 45%, var(--logo-yellow) 45%, var(--logo-yellow) 55%, transparent 55%),
    linear-gradient(180deg,#4a5570 0%, #232c42 45%, #10141f 55%, #2b3448 100%);
  box-shadow:0 3px 8px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08);
}
.vfader:focus-visible{ outline:2px solid var(--logo-yellow); outline-offset:3px; }
.fader-readout{
  font-family:'VT323',monospace; font-size:18px; letter-spacing:.12em;
  color:var(--phosphor-amber); min-height:20px;
}
.dbtn.mute{
  width:100%; background:#2b3854; color:var(--cg-white); box-shadow:0 3px 0 #0d1420;
}
.dbtn.mute:active{ transform:translateY(3px); box-shadow:0 0 0 #0d1420; }
.dbtn.mute.on{
  background:linear-gradient(180deg,#c6463a,#7c1f18);
  box-shadow:0 4px 0 #4c110c, 0 0 12px rgba(255,80,60,.35);
}

/* ---------- speed deck below the screen ---------- */
.speed-deck{
  margin-top:10px; padding:9px 16px 12px; border-radius:12px;
  background:linear-gradient(160deg,#232f47,#141b2b);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.06), inset 0 -6px 12px rgba(0,0,0,.5);
}
.speed-deck label{
  display:flex; justify-content:space-between;
  font-family:'VT323',monospace; font-size:15px; letter-spacing:.12em; color:#aab0c2;
  margin-bottom:8px;
}
.speed-deck label span{ color:var(--phosphor-amber); }
.speed-marks{
  position:relative; height:14px; margin-top:6px;
  font-family:'VT323',monospace; font-size:11px; letter-spacing:.08em; color:#7d87a3;
}
.speed-marks span{ position:absolute; transform:translateX(-50%); }

/* ---------- CENTER: screen (same size formula as previous build) ---------- */
.screen-col{
  flex:none; min-width:0; min-height:0;
  display:flex; flex-direction:column;
}
.screen-bezel{
  position:relative;
  border-radius:16px;
  padding:14px;
  background:#0a0d14;
  box-shadow: inset 0 0 0 2px #05070c, inset 0 0 30px rgba(0,0,0,.8);
  flex:1; min-height:0;
  display:flex; align-items:center; justify-content:center;
}
.screen{
  position:relative;
  aspect-ratio:4/3;
  /* Height rule: always fill 100% of the available vertical space in the
     bezel — that space IS the row height (fader panel and channel column
     both stretch to match it), so the screen and the side panels can never
     drift out of sync. The only other constraint is width: on a very wide,
     short window the screen must stop growing once it runs out of room
     between the fader (118px) and the channel column (330px), so we also
     cap by the exact horizontal budget: tv padding (40) + fader (118) +
     gaps (28) + channel column (330) + bezel padding (28) = 544px. */
  height:min(100%, calc((98vw - 544px) * 0.75));
  width:auto;
  border-radius:60px/40px; /* curved glass illusion */
  overflow:hidden;
  background:var(--screen-black);
  box-shadow:
    inset 0 0 60px 10px rgba(0,0,0,.85),
    inset 0 0 120px 40px rgba(0,0,0,.6),
    0 0 40px 4px rgba(242,199,68,.08);
}

/* the dials apply their CSS filters to this wrapper, which contains both
   players — so effects hit the YouTube live feed and local video alike */
.picture-wrap{
  position:absolute; inset:0;
  filter:saturate(1.05) contrast(1.04);
}
.picture-wrap iframe, .picture-wrap video{
  position:absolute; inset:0; width:100%; height:100%; border:0;
  background:#000;
  object-fit:cover;
}
/* transparent, sits on top of the iframe/video — intercepts every mouse
   event so YouTube's hover-triggered chrome never gets a hover to react to */
.video-shield{ position:absolute; inset:0; background:transparent; }

@keyframes degaussShake{
  0%{filter:saturate(1.05) contrast(1.04) hue-rotate(0deg) saturate(3) brightness(1.6);}
  30%{filter:saturate(1.05) contrast(1.04) hue-rotate(180deg) saturate(2) brightness(.7);}
  60%{filter:saturate(1.05) contrast(1.04) hue-rotate(-90deg) saturate(2.5) brightness(1.3);}
  100%{}
}
.picture-wrap.degauss-anim{ animation:degaussShake .6s ease-out; }

/* CRT power on/off: collapses the PICTURE only (transform, paint-only —
   .screen itself never changes size/position) to a thin line then a dot,
   like a real tube. Kept off .screen on purpose so the bezel/frame and
   the layout math in sizeScreen() are completely unaffected. */
@keyframes crtPowerOff{
  0%{ transform:scale(1,1); opacity:1; }
  55%{ transform:scale(1,.02); opacity:1; }
  100%{ transform:scale(.02,.001); opacity:0; }
}
@keyframes crtPowerOn{
  0%{ transform:scale(.02,.001); opacity:0; }
  45%{ transform:scale(1,.02); opacity:1; }
  100%{ transform:scale(1,1); opacity:1; }
}
.picture-wrap.crt-power-off{ animation:crtPowerOff .45s ease-in forwards; }
.picture-wrap.crt-power-on{ animation:crtPowerOn .45s ease-out both; }

/* scanlines + vignette + glow, always on top */
.screen .scanlines{
  position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(
    to bottom, rgba(0,0,0,.18) 0px, rgba(0,0,0,.18) 1px,
    transparent 2px, transparent 3px);
  mix-blend-mode:multiply;
}
.screen .vignette{
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%);
}
.screen .glow-edge{
  position:absolute; inset:0; pointer-events:none; border-radius:60px/40px;
  box-shadow:inset 0 0 50px 8px rgba(242,199,68,.06);
}

/* slow rolling horizontal sync bar — classic "vertical hold" drift.
   Pure decoration, sits above the picture, never touches its pixels, so
   it works identically on the YouTube iframe and the local <video>. */
.screen .sync-bar{
  position:absolute; left:0; right:0; top:-14%; height:14%; pointer-events:none;
  background:linear-gradient(to bottom,
    transparent 0%, rgba(255,255,255,.05) 45%, rgba(255,255,255,.09) 50%,
    rgba(255,255,255,.05) 55%, transparent 100%);
  mix-blend-mode:overlay;
  animation:syncBarDrift 17s linear infinite;
}
@keyframes syncBarDrift{ 0%{ top:-14%; } 100%{ top:100%; } }

/* occasional brief tracking-error band — a couple of horizontally-offset
   strips, like a tape head momentarily losing the track */
.screen .tracking-glitch{
  position:absolute; inset:0; pointer-events:none; opacity:0;
  background:
    linear-gradient(to bottom, transparent 22%, rgba(255,255,255,.12) 23%, transparent 24%),
    linear-gradient(to bottom, transparent 61%, rgba(255,255,255,.09) 62.5%, transparent 64%);
  mix-blend-mode:overlay;
  animation:trackingGlitch 9s steps(1) infinite;
}
@keyframes trackingGlitch{
  0%, 96%{ opacity:0; transform:none; }
  96.4%{ opacity:1; transform:translateX(-1.4%); }
  97.2%{ opacity:1; transform:translateX(1.1%); }
  98%{ opacity:0; transform:none; }
  100%{ opacity:0; }
}

/* continuous "weak signal" snow, opacity driven by the SIGNAL dial */
.static-signal{
  position:absolute; inset:0; opacity:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, #fff 0 1px, #000 1px 2px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 4px);
  background-size:100% 3px, 6px 100%;
  mix-blend-mode:overlay;
}

/* power-off state */
.tv.off .picture-wrap{ opacity:0; }
.tv.off .screen .no-signal{ opacity:1; }
.no-signal{
  position:absolute; inset:0; opacity:0; transition:opacity .2s;
  display:flex; align-items:center; justify-content:center; text-align:center; padding:0 24px;
  font-family:'VT323',monospace; font-size:26px; letter-spacing:.2em; color:#3a4152;
}
.no-signal.pending{ color:var(--phosphor-amber); }

/* pending channels get snow instead of a flat black screen behind the
   text. Pure CSS via the sibling combinator — reacts to the .pending
   class tuneTo() already toggles on #noSignal, no new JS needed. Kept
   as its own layer (not the SIGNAL-dial-driven .static-signal) so it
   can't fight with that dial's own opacity control. */
.pending-static{
  position:absolute; inset:0; pointer-events:none; opacity:0;
  background:
    repeating-linear-gradient(0deg, #fff 0 1px, #000 1px 2px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 4px);
  background-size:100% 3px, 6px 100%;
  mix-blend-mode:overlay;
  transition:opacity .3s ease;
}
.no-signal.pending ~ .pending-static{ opacity:.28; }

/* static burst on channel change */
.static-burst{
  position:absolute; inset:0; opacity:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, #fff 0 1px, #000 1px 2px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 4px);
  background-size:100% 3px, 6px 100%;
  mix-blend-mode:overlay;
}
.static-burst.on{
  animation: staticFlicker .38s steps(6) 1;
}
@keyframes staticFlicker{
  0%{opacity:.95;} 30%{opacity:.6;} 55%{opacity:.9;} 100%{opacity:0;}
}

/* Character-generator OSD, like real public-access channel IDs */
.osd{
  position:absolute; left:18px; top:16px;
  padding:6px 14px 8px;
  background:rgba(5,7,10,.55);
  border:2px solid var(--phosphor-amber);
  border-radius:2px;
  font-family:'VT323',monospace;
  opacity:0; transform:translateY(-6px);
  transition:opacity .25s ease, transform .25s ease;
}
.osd.show{ opacity:1; transform:translateY(0); }
.osd .ch-num{ font-size:40px; color:var(--phosphor-amber); line-height:1; }
.osd .ch-name{ font-size:18px; letter-spacing:.14em; color:var(--cg-white); }

/* bottom ticker, cable-access style — in SPA logo yellow + logo typeface */
.ticker{
  position:absolute; left:0; right:0; bottom:0;
  height:42px; overflow:hidden;
  background:rgba(5,7,10,.78); border-top:1px solid rgba(255,238,60,.45);
  display:flex; align-items:center;
}
.ticker span{
  display:inline-block; white-space:nowrap;
  font-family:'Alarm Clock','Sixtyfour',monospace; font-size:17px; letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--logo-yellow);
  text-shadow:0 0 6px rgba(255,238,60,.55), 0 0 18px rgba(255,238,60,.25);
  padding-left:100%;
  animation:scrollTicker 28s linear infinite;
}
@keyframes scrollTicker{ to{ transform:translateX(-100%);} }

/* ---------- RIGHT: vending channel grid ----------
   The whole tile is the button — 4x3 = 12 slots: 9 real channels, 3 OPEN
   slots reserved for future channels. The grid absorbs whatever width is
   left after the dial panel and the fixed-size screen. */
.right-col{
  flex:none; width:330px; max-width:100%; height:100%; overflow:hidden;
  display:flex; flex-direction:column; gap:12px;
}
.vending{
  flex:none;
  display:grid; grid-template-columns:repeat(4, 1fr);
  gap:10px;               /* tiles are square (aspect-ratio 1/1), so with auto rows
                             the space between every tile is exactly 10px on all sides */
  align-content:start;
}
.vtile{
  position:relative; overflow:hidden; border-radius:12px;
  aspect-ratio:1/1;
  border:none; padding:0; margin:0; cursor:pointer; appearance:none;
  background:#0a0d14; box-shadow:inset 0 0 0 2px #05070c;
  font:inherit; color:inherit;
  transition:box-shadow .15s ease;
}
.vtile:active{ transform:scale(0.98); }
.vtile:focus-visible{ outline:2px solid var(--logo-yellow); outline-offset:3px; }

.vtile .art{
  position:absolute; inset:0; overflow:hidden;
  display:flex; align-items:center; justify-content:center; padding:9%;
  text-align:center;
}
/* channel names use the SPA logo typeface stack, same as the cabinet
   branding and ticker, for consistent identity */
.vtile .art .chname{
  font-family:'Alarm Clock','Sixtyfour',monospace; text-transform:uppercase;
  font-size:clamp(9px, 0.95vw, 13px); line-height:1.25; position:relative; z-index:1;
}
.vtile .art .chsub{
  font-family:'VT323',monospace; font-size:clamp(8px,0.75vw,11px);
  letter-spacing:.14em; margin-top:4px; opacity:.85; position:relative; z-index:1;
}
.vtile .art img{ max-width:100%; max-height:100%; object-fit:contain; position:relative; z-index:1;
  filter:drop-shadow(0 0 6px rgba(255,220,60,.5)); transition:filter .2s ease; }

/* backlit fluorescent glow behind every insert, brightening on hover */
.vtile .art::before{
  content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.22) 0%, transparent 68%);
  mix-blend-mode:screen; opacity:.55; transition:opacity .2s ease;
}
.vtile:hover .art::before{ opacity:1; }
.vtile:hover .art{ filter:brightness(1.12); }
.vtile:hover .art img{ filter:drop-shadow(0 0 14px rgba(255,220,60,.9)) brightness(1.15); }

/* currently-tuned channel — lit ring + corner LED */
.vtile.active{
  box-shadow:inset 0 0 0 3px var(--phosphor-amber), 0 0 14px 2px rgba(242,199,68,.5);
}
.vtile.active::after{
  content:""; position:absolute; top:8px; right:8px; width:8px; height:8px; border-radius:50%;
  background:var(--phosphor-amber); box-shadow:0 0 6px 2px rgba(242,199,68,.8); z-index:2;
}

/* CH 001 — the real live feed gets a pulsing LIVE tag */
.vtile.live .live-badge{
  position:absolute; top:8px; left:8px; z-index:2;
  display:flex; align-items:center; gap:4px;
  padding:2px 7px; border-radius:3px; background:rgba(5,7,10,.65);
  font-family:'VT323',monospace; font-size:12px; letter-spacing:.14em; color:#ff6b5e;
}
.vtile.live .live-dot{
  width:6px; height:6px; border-radius:50%; background:#ff3b30;
  box-shadow:0 0 5px 1px rgba(255,59,48,.8);
  animation:liveBlink 1.6s ease-in-out infinite;
}
@keyframes liveBlink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

/* OPEN slots reserved for future channels — dim, inert */
.vtile.open-slot{
  cursor:default; background:transparent;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.1);
}
.vtile.open-slot .art{
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 10px, transparent 10px 20px);
}
.vtile.open-slot .chname, .vtile.open-slot .chsub{ opacity:.35; }
.vtile.open-slot:hover .art::before{ opacity:.25; }
.vtile.open-slot:hover .art{ filter:none; }
.vtile.open-slot:active{ transform:none; }

/* ---------- BOTTOM: power / channel bar ---------- */
.bottom-bar{
  margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding-top:10px; border-top:1px solid rgba(255,238,60,.15);
}
.bottom-bar .brandtag{ font-family:'VT323',monospace; letter-spacing:.15em; color:#7d87a3; font-size:13px; }
.bottom-controls{ display:flex; gap:10px; }
.bbtn{
  border:none; border-radius:8px; padding:8px 16px; cursor:pointer;
  font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; letter-spacing:.14em;
  background:#2b3854; color:var(--cg-white); box-shadow:0 3px 0 #0d1420;
}
.bbtn:active{ transform:translateY(3px); box-shadow:0 0 0 #0d1420; }
.bbtn:focus-visible{ outline:2px solid var(--logo-yellow); outline-offset:2px; }
.bbtn.power{ background:linear-gradient(180deg,#c6463a,#9c2c22); }

/* channel guide — an overlay ON .screen, same inset:0/opacity-toggle
   idiom as .osd, so it never affects .screen's own box */
.channel-guide{
  position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0;
  background:var(--screen-black);
  display:flex; flex-direction:column;
  transition:opacity .2s ease;
}
.channel-guide.show{ opacity:1; pointer-events:auto; }
.guide-header{
  display:flex; align-items:center; justify-content:space-between; flex:none;
  padding:14px 18px; border-bottom:1px solid rgba(255,255,255,.15);
  font-family:'Alarm Clock','Sixtyfour',monospace; letter-spacing:.14em; text-transform:uppercase;
  font-size:15px; color:var(--phosphor-amber);
}
.guide-close{
  background:none; border:1px solid rgba(255,255,255,.3); color:inherit; cursor:pointer;
  width:26px; height:26px; border-radius:4px; font-size:14px; line-height:1; padding:0;
}
.guide-close:hover{ border-color:var(--phosphor-amber); color:var(--phosphor-amber); }
.guide-list{ flex:1; overflow-y:auto; padding:6px 10px; }
.guide-row{
  display:flex; align-items:center; gap:14px; width:100%;
  background:none; border:none; border-bottom:1px solid rgba(255,255,255,.08);
  color:inherit; text-align:left; padding:10px 8px; cursor:pointer; font:inherit;
}
.guide-row:hover:not(:disabled){ background:rgba(255,255,255,.06); }
.guide-row:disabled{ opacity:.4; cursor:default; }
.guide-num{
  font-family:'VT323',monospace; font-size:20px; color:var(--phosphor-amber);
  width:3.4em; flex:none;
}
.guide-info{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.guide-name{
  font-family:'Alarm Clock','Sixtyfour',monospace; font-size:12px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--cg-white);
}
.guide-now, .guide-next{
  font-family:'VT323',monospace; font-size:15px; letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.guide-now{ color:var(--cg-white); opacity:.85; }
.guide-next{ color:var(--cg-white); opacity:.5; }

@media (prefers-reduced-motion: reduce){
  .ticker span{ animation:none; padding-left:16px; }
  .static-burst.on{ animation:none; }
  .vtile.live .live-dot{ animation:none; }
  .picture-wrap.degauss-anim{ animation:none; }
  .picture-wrap.crt-power-off, .picture-wrap.crt-power-on{ animation:none; }
  .screen .sync-bar, .screen .tracking-glitch{ animation:none; opacity:0; }
}
/* small screens get scroll back so nothing is unreachable — this block is
   placed last on purpose so it wins the cascade over the desktop rules
   above whenever its condition is active */
@media (max-width:900px), (max-height:660px){
  body{ overflow:auto; height:auto; min-height:100%; }
  .tv{ height:auto; display:block; }
  .main-row{ flex-wrap:wrap; }
  .screen-col{ width:100%; height:auto; }
  .screen-bezel{ flex:none; }
  .screen{ height:auto; width:100%; }
  .fader-panel{ width:100%; height:auto; }
  .fader-track-wrap{ flex:none; min-height:140px; }
  .right-col{ height:auto; overflow:visible; }
  .dials{ flex:none; }
  .dial-bank{ flex:none; }
  .vdial{ flex:none; height:100px; }
}
</style>
</head>
<body>

<div class="tv" id="tv">
  <div class="main-row">

    <div class="fader-panel">
      <h4>VOLUME</h4>
      <div class="fader-track-wrap">
        <div class="fader-scale"><span>10</span><span>8</span><span>6</span><span>4</span><span>2</span><span>0</span></div>
        <input type="range" id="vol" class="vfader" min="0" max="100" value="70" aria-label="Volume">
      </div>
      <div class="fader-readout" id="volOut">MUTED</div>
      <button class="dbtn mute on" id="muteBtn" aria-pressed="true">MUTED</button>
    </div>

    <div class="screen-col" id="screenCol">
      <div class="screen-bezel">
        <div class="screen" id="screen">
          <div class="picture-wrap" id="pictureWrap">
            <iframe id="player" src="" allow="autoplay; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="channel" style="display:none"></iframe>
            <video id="localPlayer" autoplay muted playsinline loop style="display:none"></video>
            <!-- ambient static loops (no visual footprint) — pendingLoop plays
                 behind "NOT YET PROGRAMMED" channels, signalLoop follows the
                 SIGNAL dial. Both real recordings, see audio/ -->
            <audio id="pendingLoopAudio" src="audio/static-pending-loop.mp3" loop preload="auto"></audio>
            <audio id="signalLoopAudio" src="audio/static-signal-loop.mp3" loop preload="auto"></audio>
          </div>
          <div class="scanlines"></div>
          <div class="vignette"></div>
          <div class="glow-edge"></div>
          <div class="sync-bar"></div>
          <div class="tracking-glitch"></div>
          <div class="static-signal" id="staticSignal"></div>
          <div class="static-burst" id="staticBurst"></div>
          <div class="no-signal" id="noSignal">◈ NO SIGNAL ◈</div>
          <div class="pending-static"></div>
          <div class="osd" id="osd">
            <div class="ch-num" id="osdNum">001</div>
            <div class="ch-name" id="osdName">SPECTRUM PUBLIC ACCESS</div>
          </div>
          <div class="ticker"><span id="tickerText">NOW PLAYING —</span></div>

          <!-- topmost layer while the guide is closed: sits directly over
               the iframe/video and swallows every mouse event before it
               reaches YouTube. Nothing in this UI ever needs to click/hover
               the video itself (tuning is all done via the cabinet's own
               buttons), so this is pure upside — it's what YouTube's
               on-hover title/logo/share/captions chrome (unremovable via
               embed params, see buildEmbedUrl()) needs a real hover to ever
               show, and now the iframe never gets one. Placed *before*
               .channel-guide in the DOM so the guide's own buttons still
               stack on top and stay clickable while it's open. -->
          <div class="video-shield"></div>

          <!-- channel guide: an overlay ON the screen (same inset:0 pattern
               as every other layer above), so opening it can never touch
               .screen's own size/position — same reasoning as the CRT
               power animation living on .picture-wrap instead of .screen -->
          <div class="channel-guide" id="channelGuide">
            <div class="guide-header">
              <span>CHANNEL GUIDE</span>
              <button class="guide-close" id="guideClose" aria-label="Close guide">✕</button>
            </div>
            <div class="guide-list" id="guideList"></div>
          </div>
        </div>
      </div>
      <div class="speed-deck">
        <label for="speed">TAPE SPEED <span id="speedOut">1.00×</span></label>
        <input type="range" id="speed" min="25" max="200" value="100" step="5">
        <div class="speed-marks">
          <span style="left:0; transform:none">0.25×</span>
          <span style="left:14.3%">0.5×</span>
          <span style="left:42.9%">1×</span>
          <span style="left:71.4%">1.5×</span>
          <span style="left:100%; transform:translateX(-100%)">2×</span>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="vending" id="vending"></div>

      <div class="dials">
        <h4>PICTURE</h4>
        <div class="dial-bank">
          <div class="dial-col">
            <span class="dname">COLOR</span>
            <input type="range" id="hue" class="vdial" min="0" max="360" value="0" aria-label="Color">
            <span class="dval" id="hueOut">0°</span>
          </div>
          <div class="dial-col">
            <span class="dname">BRIGHT</span>
            <input type="range" id="bright" class="vdial" min="40" max="160" value="100" aria-label="Brightness">
            <span class="dval" id="brightOut">100%</span>
          </div>
          <div class="dial-col">
            <span class="dname">CONTRAST</span>
            <input type="range" id="contrast" class="vdial" min="40" max="180" value="100" aria-label="Contrast">
            <span class="dval" id="contrastOut">100%</span>
          </div>
          <div class="dial-col">
            <span class="dname">TINT</span>
            <input type="range" id="sat" class="vdial" min="0" max="200" value="100" aria-label="Tint">
            <span class="dval" id="satOut">100%</span>
          </div>
          <div class="dial-col">
            <span class="dname">SIGNAL</span>
            <input type="range" id="staticAmt" class="vdial" min="0" max="100" value="0" aria-label="Signal">
            <span class="dval" id="staticOut">clear</span>
          </div>
        </div>
        <div class="dial-actions">
          <button class="dbtn degauss" id="degaussBtn">DEGAUSS</button>
          <button class="dbtn reset" id="resetBtn">RESET</button>
        </div>
      </div>
    </div>

  </div>

  <div class="bottom-bar">
    <div class="brandtag">MODEL SP-1974 · COLOR</div>
    <div class="bottom-controls">
      <button class="bbtn" id="guideBtn">GUIDE</button>
      <button class="bbtn" id="chDown">CH ▼</button>
      <button class="bbtn" id="chUp">CH ▲</button>
      <button class="bbtn power" id="powerBtn">POWER</button>
    </div>
  </div>
</div>

<script>
/*
  ── VIRTUAL CHANNEL SCHEDULER ──────────────────────────────────────
  Each "channel" is an ordered list of blocks (title + duration in
  seconds, plus either `youtubeId` or `file`). On load / channel-change
  we compute how far into the channel's total loop the current
  wall-clock moment falls, find which block that lands in, and start
  that video at the matching offset — so anyone watching sees the same
  thing at the same time, like real broadcast, with zero extra
  streaming infrastructure.

  Two kinds of block:
  - `youtubeId` — an unlisted YouTube video, played through the shared
    `player` iframe via buildEmbedUrl(). CH 001's live 24/7 feed is a
    block like this too (`live` on the channel forces offset 0 and
    skips start/loop). Non-live youtubeId blocks get `start=<offset>`
    plus `loop=1&playlist=<id>` so the embed re-loops on its own once
    the tab's been open longer than one block — this only stays in
    sync if the YouTube video's real length matches `duration` exactly,
    same requirement as the local-file case below.
  - `file` — a local video file, played through the `localPlayer`
    <video> element, `duration` matching the file's real length so its
    native `loop` attribute keeps it wall-clock-synced. CH008/052/066
    still use this for now; once each is uploaded as an unlisted
    YouTube video, swap its `file` for `youtubeId` here — no other code
    changes needed, `scheduledBlockFor`/`tuneTo` already handle both.

  Channels with `pending: true` have no block wired up yet — they show
  NO SIGNAL when tuned. As you send real YouTube IDs, swap them in and
  remove the pending flag.

  `tile` controls each channel's vending-grid look: two gradient colors,
  a text color, and optionally `logo` (an <img> data-URI or file path)

*/

/* ---------- scheduler ----------
   projectSchedule() is the one place that walks a channel's block list
   against wall-clock time. scheduledBlockFor() is kept as a thin wrapper
   so tuneTo()/the vending-hover-thumbnail code don't need to change; the
   channel guide uses the extra `next`/`nextStartsInSeconds` fields to
   show what's coming up, which only exists once a channel has more than
   one block. */
function projectSchedule(channel){
  if (channel.live) return { block: channel.blocks[0], offset: 0, next: null, nextStartsInSeconds: null };
  const total = channel.blocks.reduce((s,b)=>s+b.duration,0);
  let pos = Math.floor(Date.now()/1000) % total;
  for (let i=0; i<channel.blocks.length; i++){
    const b = channel.blocks[i];
    if (pos < b.duration){
      const next = channel.blocks.length > 1 ? channel.blocks[(i+1) % channel.blocks.length] : null;
      return { block: b, offset: pos, next, nextStartsInSeconds: b.duration - pos };
    }
    pos -= b.duration;
  }
  return { block: channel.blocks[0], offset: 0, next: null, nextStartsInSeconds: null };
}
function scheduledBlockFor(channel){
  const { block, offset } = projectSchedule(channel);
  return { block, offset };
}

// builds a YouTube embed URL with the chrome hidden as far as the
// iframe API allows (YouTube's own logo watermark can't be removed —
// their branding policy dropped that around 2023). `live` skips
// start/loop since the real broadcast has no fixed offset; VOD blocks
// get `start=<offset>` plus loop=1&playlist=<id> so the embed keeps
// itself looping without our code having to intervene.
function buildEmbedUrl(youtubeId, { live = false, start = 0 } = {}){
  const params = new URLSearchParams({
    autoplay: 1, mute: 1, playsinline: 1, rel: 0,
    controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1
  });
  if (!live){
    params.set('start', Math.floor(start));
    params.set('loop', 1);
    params.set('playlist', youtubeId); // required for loop=1 to work on a single video
  }
  // the iframe JS API needs a real http(s) origin — from file:// it makes
  // YouTube throw Error 153, so only attach it when the page is served
  if (location.protocol === 'http:' || location.protocol === 'https:'){
    params.set('enablejsapi', '1');
    params.set('origin', location.origin);
  }
  return `https://www.youtube.com/embed/${youtubeId}?${params.toString()}`;
}

function tuneTo(index, {silent=false} = {}){
  currentIndex = (index + CHANNELS.length) % CHANNELS.length;
  const channel = CHANNELS[currentIndex];
  const num3 = String(channel.number).padStart(3,'0');

  // keep the URL deep-linkable (#ch=52) without adding history entries
  // or triggering a hashchange/scroll — replaceState does neither
  history.replaceState(null, '', `#ch=${channel.number}`);

  // stop whatever was playing before switching
  player.style.display = 'none';
  player.src = '';
  localPlayer.style.display = 'none';
  localPlayer.pause();
  pendingLoopAudio.pause();

  if (channel.pending){
    noSignal.textContent = '◈ NO SIGNAL — CHANNEL NOT YET PROGRAMMED ◈';
    noSignal.classList.add('pending');
    noSignal.style.opacity = '1';
    ticker.textContent = `CH ${num3} · ${channel.name} · NOT YET PROGRAMMED`;
    pendingLoopAudio.play().catch(()=>{ /* autoplay blocked until a real gesture happens */ });
  } else if (channel.live){
    noSignal.classList.remove('pending');
    noSignal.style.opacity = '0';
    const { block } = scheduledBlockFor(channel);
    player.style.display = 'block';
    player.src = buildEmbedUrl(block.youtubeId, { live: true });
    ticker.textContent = `NOW PLAYING — CH ${num3} · ${channel.name} · ${block.title}`;
  } else {
    noSignal.classList.remove('pending');
    noSignal.style.opacity = '0';
    const { block, offset } = scheduledBlockFor(channel);
    if (block.youtubeId){
      localPlayer.style.display = 'none';
      player.style.display = 'block';
      player.src = buildEmbedUrl(block.youtubeId, { live: false, start: offset });
    } else {
      player.style.display = 'none';
      localPlayer.style.display = 'block';
      if (localPlayer.dataset.src !== block.file){
        localPlayer.src = block.file;
        localPlayer.dataset.src = block.file;
      }
      localPlayer.currentTime = offset;
      localPlayer.play().catch(()=>{ /* autoplay blocked — any button press counts as a gesture and unblocks it */ });
    }
    ticker.textContent = `NOW PLAYING — CH ${num3} · ${channel.name} · ${block.title}`;
  }

  // carry volume/mute/speed across channel changes — always, not just for
  // programmed channels, since pendingLoopAudio needs the real mute state
  // too (otherwise it'd default to unmuted/full-volume on a pending tune)
  applyAV();

  osdNum.textContent = num3;
  osdName.textContent = channel.osdName || channel.name;

  document.querySelectorAll('.vtile').forEach(t=>{
    t.classList.toggle('active', Number(t.dataset.ch) === channel.number);
  });

  if (!silent){
    staticBurst.classList.remove('on'); void staticBurst.offsetWidth;
    staticBurst.classList.add('on');
    playChannelClick();
    osd.classList.add('show');
    clearTimeout(tuneTo._t);
    tuneTo._t = setTimeout(()=>osd.classList.remove('show'), 2200);
  }
}

function setPower(on){
  poweredOn = on;
  tv.classList.toggle('off', !on);
  if (!on) closeGuide();

  // CRT tube collapse/expand — same remove+reflow+add pattern as degauss,
  // so replaying the animation always restarts cleanly
  pictureWrap.classList.remove('crt-power-on', 'crt-power-off');
  void pictureWrap.offsetWidth;
  pictureWrap.classList.add(on ? 'crt-power-on' : 'crt-power-off');
  playPowerThunk(on);

  if (on){
    tuneTo(currentIndex);
  } else {
    player.src = '';
    localPlayer.pause();
    pendingLoopAudio.pause();
    signalLoopAudio.pause();
    noSignal.classList.remove('pending');
    noSignal.textContent = '◈ NO SIGNAL ◈';
    noSignal.style.opacity = '1';
  }
}

const vol = document.getElementById('vol');

// sends a command to the YouTube embed (live channel) via the iframe API
function ytCommand(func, args=[]){
  if (!player.src || player.style.display === 'none') return;
  try{
    player.contentWindow.postMessage(JSON.stringify({event:'command', func, args}), '*');
  }catch(e){}
}

function applyAudio(){
  const v = Number(vol.value);
  localPlayer.volume = v/100;
  localPlayer.muted = isMuted;
  ytCommand('setVolume', [v]);
  ytCommand(isMuted ? 'mute' : 'unMute');
  pendingLoopAudio.volume = Math.min(1, (v/100) * 0.5);
  pendingLoopAudio.muted = isMuted;
  updateSignalLoop();
  volOut.textContent = isMuted ? 'MUTED' : v;
  muteBtn.textContent = isMuted ? 'MUTED' : 'MUTE';
  muteBtn.classList.toggle('on', isMuted);
  muteBtn.setAttribute('aria-pressed', String(isMuted));
}
vol.addEventListener('input', ()=>{
  if (isMuted && Number(vol.value) > 0) isMuted = false; // grabbing the fader unmutes
  applyAudio();
});
muteBtn.addEventListener('click', ()=>{ isMuted = !isMuted; applyAudio(); });

/* ---------- sound effects: real recordings, cut from TV SOUNDs.wav
   ----------
   One-shots play through Web Audio (AudioBufferSourceNode), decoded
   once and cached — same lazily-created-context approach as before,
   since browsers block audio before a real user gesture and a channel
   click / power press already counts as one. */
let sfxCtx = null;
function sfxContext(){
  if (!sfxCtx) sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (sfxCtx.state === 'suspended') sfxCtx.resume();
  return sfxCtx;
}
function sfxGain(ctx){
  const g = ctx.createGain();
  g.connect(ctx.destination);
  return g;
}
const sfxBufferCache = {};
async function loadSfxBuffer(url){
  if (sfxBufferCache[url]) return sfxBufferCache[url];
  const arr = await fetch(url).then(r=>r.arrayBuffer());
  const buf = await sfxContext().decodeAudioData(arr);
  sfxBufferCache[url] = buf;
  return buf;
}
async function playSfxFile(url, gainValue=0.5){
  if (isMuted) return;
  try{
    const ctx = sfxContext();
    const buffer = await loadSfxBuffer(url);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const g = sfxGain(ctx);
    g.gain.value = gainValue;
    src.connect(g);
    src.start();
  }catch(e){ /* missing/blocked file — fail silently, picture still works */ }
}
function playChannelClick(){ playSfxFile('audio/channel-click.mp3', 0.5); }
function playDegaussBuzz(){ playSfxFile('audio/degauss-buzz.mp3', 0.4); }
function playPowerThunk(on){ playSfxFile(on ? 'audio/power-on.mp3' : 'audio/power-off.mp3', 0.5); }

/* ---------- exact 4:3 screen sizing ----------
   CSS alone can't reliably do this: .screen-col's own width is a
   "shrink-to-fit" value (nothing sets it directly), and .screen wants its
   width to come FROM its height via aspect-ratio — that's a circular
   dependency browsers don't resolve consistently, and in practice it can
   collapse .screen-col down to whatever its narrowest child (the tape
   speed slider) happens to need, producing a tall sliver instead of a 4:3
   screen. Measuring the real, already-fixed-width neighbors (fader panel,
   channel column) and computing the exact pixel box removes the ambiguity
   entirely — the math below is the only source of truth for the screen's
   size, every other panel just stretches to match it via CSS. */
const smallLayoutMQ = window.matchMedia('(max-width:900px), (max-height:660px)');

function sizeScreen(){
  const screenCol = document.getElementById('screenCol');
  const screenEl = document.getElementById('screen');
  const bezel = document.querySelector('.screen-bezel');
  const mainRowEl = document.querySelector('.main-row');
  const faderPanel = document.querySelector('.fader-panel');
  const rightCol = document.querySelector('.right-col');

  if (smallLayoutMQ.matches){
    // small/short viewport — the CSS fallback rules take over instead
    screenCol.style.width = '';
    screenEl.style.width = '';
    screenEl.style.height = '';
    return;
  }

  // clear any previous override before measuring, so a shrinking viewport
  // can't get stuck reading its own leftover inline size
  screenCol.style.width = 'auto';

  const bezelBox = bezel.getBoundingClientRect();
  const bezelCS = getComputedStyle(bezel);
  const padX = parseFloat(bezelCS.paddingLeft) + parseFloat(bezelCS.paddingRight);
  const padY = parseFloat(bezelCS.paddingTop) + parseFloat(bezelCS.paddingBottom);

  const mainRowBox = mainRowEl.getBoundingClientRect();
  const gapPx = parseFloat(getComputedStyle(mainRowEl).columnGap || getComputedStyle(mainRowEl).gap) || 14;

  const availableInnerHeight = bezelBox.height - padY;
  const availableOuterWidthForCol =
    mainRowBox.width - faderPanel.getBoundingClientRect().width - rightCol.getBoundingClientRect().width - gapPx*2;
  const availableInnerWidth = availableOuterWidthForCol - padX;

  // start from height, derive width at exactly 4:3 — then fall back to
  // deriving from width instead if that would overflow sideways
  let innerH = Math.max(0, availableInnerHeight);
  let innerW = innerH * (4/3);
  if (innerW > availableInnerWidth){
    innerW = Math.max(0, availableInnerWidth);
    innerH = innerW * (3/4);
  }

  screenEl.style.width = innerW + 'px';
  screenEl.style.height = innerH + 'px';
  screenCol.style.width = (innerW + padX) + 'px';
}

window.addEventListener('resize', sizeScreen);
smallLayoutMQ.addEventListener('change', sizeScreen);
sizeScreen();

/* ---------- channel guide ---------- */
const channelGuide = document.getElementById('channelGuide');
const guideList = document.getElementById('guideList');
let guideOpen = false;

function buildGuide(){
  guideList.innerHTML = '';
  CHANNELS.forEach((c, i)=>{
    const row = document.createElement('button');
    row.className = 'guide-row';
    row.disabled = !!c.pending;

    const num = document.createElement('span');
    num.className = 'guide-num';
    num.textContent = String(c.number).padStart(3,'0');

    const info = document.createElement('span');
    info.className = 'guide-info';
    const name = `<span class="guide-name">${c.name}</span>`;

    if (c.pending){
      info.innerHTML = `${name}<span class="guide-now">NOT YET PROGRAMMED</span>`;
    } else if (c.live){
      info.innerHTML = `${name}<span class="guide-now">● LIVE NOW — ${c.blocks[0].title}</span>`;
    } else {
      const { block, next, nextStartsInSeconds } = projectSchedule(c);
      let html = `${name}<span class="guide-now">NOW: ${block.title}</span>`;
      if (next){
        const startsAt = new Date(Date.now() + nextStartsInSeconds*1000);
        const t = startsAt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        html += `<span class="guide-next">NEXT: ${next.title} · ${t}</span>`;
      }
      info.innerHTML = html;
    }

    row.appendChild(num);
    row.appendChild(info);
    if (!c.pending) row.addEventListener('click', ()=>{ tuneTo(i); closeGuide(); });
    guideList.appendChild(row);
  });
}
function openGuide(){
  if (!poweredOn || guideOpen) return;
  buildGuide();
  channelGuide.classList.add('show');
  guideOpen = true;
}
function closeGuide(){
  channelGuide.classList.remove('show');
  guideOpen = false;
}
function toggleGuide(){ guideOpen ? closeGuide() : openGuide(); }

document.getElementById('guideBtn').onclick = toggleGuide;
document.getElementById('guideClose').onclick = closeGuide;

/* ---------- keyboard shortcuts (remote-control feel) ---------- */
window.addEventListener('keydown', (e)=>{
  // let a focused dial handle its own arrow keys instead of hijacking them
  if (e.target instanceof HTMLInputElement) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape' && guideOpen){ closeGuide(); return; }
  switch (e.key){
    case 'ArrowUp':
      if (poweredOn) tuneTo(currentIndex+1);
      break;
    case 'ArrowDown':
      if (poweredOn) tuneTo(currentIndex-1);
      break;
    case 'm': case 'M':
      muteBtn.click();
      break;
    case 'g': case 'G':
      toggleGuide();
      break;
    case ' ': case 'p': case 'P':
      e.preventDefault(); // stop space from also activating a focused button
      setPower(!poweredOn);
      break;
  }
});

/* ---------- deep link: a URL like #ch=52 tunes straight there on load ---------- */
function channelIndexFromHash(){
  const m = location.hash.match(/ch=(\d+)/);
  if (!m) return -1;
  return CHANNELS.findIndex(c => c.number === Number(m[1]));
}
const initialIndex = channelIndexFromHash();
tuneTo(initialIndex >= 0 ? initialIndex : 0, {silent:true});
</script>
