<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Spectrum TV</title>
  <!-- Spectrum TV moved into the Film Lab app (open to everyone, no
       sign-in needed to watch). This page only forwards old links,
       keeping a ?ch= channel number. -->
  <meta http-equiv="refresh" content="0; url=/filmlab/spectrum-tv">
  <script>
    var ch = new URLSearchParams(location.search).get("ch");
    location.replace("/filmlab/spectrum-tv" + (ch && /^\d+$/.test(ch) ? "?ch=" + ch : ""));
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fdd55d; font-family: system-ui, sans-serif; }
    a { color: inherit; }
  </style>
</head>
<body>
  <p>Spectrum TV has moved. <a href="/filmlab/spectrum-tv">Tune in here</a>.</p>
</body>
</html>
