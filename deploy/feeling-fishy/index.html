#createOverlay .card .option-btn:focus-visible .inlay,
#createChooseOverlay .card .option-btn:hover .inlay,
#createChooseOverlay .card .option-btn:focus-visible .inlay,
#downloadOverlay .card .option-btn:hover .inlay,
#downloadOverlay .card .option-btn:focus-visible .inlay {
  background: rgb(var(--logo-glow));
}
#createOverlay .card .option-btn:hover,
#createOverlay .card .option-btn:focus-visible,
#createChooseOverlay .card .option-btn:hover,
#createChooseOverlay .card .option-btn:focus-visible,
#downloadOverlay .card .option-btn:hover,
#downloadOverlay .card .option-btn:focus-visible {
  box-shadow:
    inset 2px 2px 0 rgba(255,255,255,0.12),
    inset -2px -2px 0 rgba(0,0,0,0.6),
    0 5px 0 rgba(0,0,0,0.4),
    0 0 18px rgba(var(--logo-glow), 0.45);
}
/* The clear plastic cover's sheen */
.card .option-btn::after {
  content: "";
  position: absolute;
  inset: 8px;
  border-radius: 4px;
  background: linear-gradient(160deg,
    rgba(255,255,255,0.35), rgba(255,255,255,0.05) 40%,
    rgba(255,255,255,0) 60%);
  pointer-events: none;
}
.card .option-btn:hover { transform: translateY(-2px); }
/* The press: button sinks, bezel bevel inverts, glow tightens */
.card .option-btn:active {
  transform: translateY(3px);
  box-shadow:
    inset 2px 2px 0 rgba(0,0,0,0.5),
    inset -2px -2px 0 rgba(255,255,255,0.08),
    0 1px 0 rgba(0,0,0,0.4),
    0 0 8px rgba(var(--logo-glow), 0.2);
}
.card button { font-family: var(--title-font); font-size: 1rem; }
/* The create menu's own heading is redundant with the "Create your
   fish" button that opens it, so it's hidden here the same way
   .draw-card's heading already is on mobile -- stays in the DOM (so
   focusOverlayHeading() still has something to focus, and screen
   readers still get a name for the dialog), just not shown. */
#createOverlay .card > h2 {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* Collapsed by default so it costs nothing on mobile, and doesn't
   just become a paragraph everyone scrolls past on desktop either —
   tap to reveal instead. */
.info-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 2px 0 0;
  padding: 7px 16px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.32);
  background: rgba(255,255,255,0.08);
  color: var(--text);
  font-family: 'Sixtyfour', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 400;
  cursor: pointer;
  transition: background 0.15s ease;
}
.info-toggle:hover, .info-toggle:focus-visible { background: rgba(255,255,255,0.2); }
.download-note {
  font-size: 0.85rem;
  line-height: 1.5;
  opacity: 0.85;
  margin: 4px 0 20px;
}

/* The gap above the option row (from the info panel) and the gap
   below it (to Close/Back) were two different values -- 20px above,
   10px below -- purely because one came from .option-row's own
   margin and the other from nothing. Matching it here rather than
   touching .option-row itself, since that class is shared with
   layouts (like the mobile carousel) that already tune it on their
   own terms. */
#createClose, #createChooseBack, #downloadBack { margin-top: 20px; }

/* "Submit your fish" card — wider, to give the monday.com form
   room to breathe. The iframe scales with the card instead of
   staying a fixed 650×500, so it still fits on a phone screen. */
.card.submit-card { max-width: 700px; }
/* The monday.com form already shows its own title inside the iframe
   (can't be turned off on their end), so ours was pure duplication —
   removed the same way #createOverlay's heading is: stays in the DOM
   since aria-labelledby="submitTitle" on the dialog still needs it to
   name the dialog for screen readers, just not shown, freeing up the
   vertical space for the form itself. */
.card.submit-card h2 {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
/* Same reasoning, one step further: no text at all on this screen
   now, just the form and the Back button. Unlike the heading above,
   this note isn't wired to anything screen readers need, so it's
   simply hidden rather than kept in the DOM for accessibility. */
.card.submit-card #submitNote { display: none; }

/* "Almost done!" card — the draw tool's own name/email submit form.
   Reuses .search-input's pill style for the two fields and .card
   button's pill style for its buttons; only the label and status
   line need their own rules. Left-aligned unlike the card's default
   centered text -- a form reads better that way. */
#directSubmitForm { text-align: left; }
.direct-submit-label {
  display: block;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  opacity: 0.6;
  margin: 16px 0 4px;
}
#directSubmitForm button { margin-top: 20px; }
.direct-submit-status {
  min-height: 1.3em;
  font-size: 0.85rem;
  margin: 10px 0 0;
}
.direct-submit-status.error { color: #ffb4b4; }
#directSubmitSuccess p { margin-bottom: 20px; }

/* "Draw it yourself" card — the draw tool needs real workspace, not
   just a couple of buttons, so this one is sized close to the full
   viewport instead of the ~560-700px the other cards use. */
.card.draw-card {
  /* Capped instead of a flat 96vw — the tool's own content maxes out
     around 1290px (Template + canvas/panel + Layers, at their own
     natural widths), so at wide monitor widths a flat 96vw left a lot
     of empty card visible around it. Still shrinks with 96vw below
     that cap, same as before, on narrower desktop windows. */
  max-width: min(96vw, 1360px); width: min(96vw, 1360px); max-height: 92vh;
  padding: 14px;
  overflow-y: auto; /* safety net if content ever runs slightly tall */
}
/* The tool renders its own styled title ("Draw your fish" in the
   same neon Sixtyfour treatment as the rest of the site) inside the
   mounted component itself, so this h2 would be a plain-text
   duplicate sitting above it. Kept in the DOM (not display:none) so
   aria-labelledby on the dialog still names it for screen readers —
   just not shown twice on screen. */
.card.draw-card h2 {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
#drawToolMount { display: flex; justify-content: center; }
#drawBack { margin-top: 8px; }
@media (max-width: 1050px) {
  .card.draw-card { overflow-y: auto; }
}
/* Desktop gets its own Back button inside the tool itself (bottom of
   the Template column, mirroring Submit at the bottom of Layers) —
   see create-your-fish-draw.css — so this external one would be a
   duplicate there. Mobile keeps this one; the internal one is a
   desktop-only addition to that stylesheet. */
@media (min-width: 1051px) {
  #drawBack { display: none; }
}

/* "How does it work?" walkthrough — sized close to the full viewport
   like .draw-card, since a 4:5 illustration needs real room. Height
   comes from the image's own aspect-ratio, capped by max-height so a
   short viewport shrinks it instead of overflowing the card. */
.card.walkthrough-card {
  max-width: 96vw; width: min(480px, 92vw); max-height: 92vh;
  padding: 20px 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.walkthrough {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}
.walkthrough .card-nav { background: rgba(255,255,255,0.12); color: var(--text); }
.walkthrough .card-nav:hover { background: rgba(255,255,255,0.24); }
.walkthrough-scene {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
/* A real paper card instead of the striped "placeholder" look --
   the diagonal stripes were built to read as "under construction,"
   which stopped fitting the moment real linework had something to
   sit on. Warm off-white base + a fractal-noise SVG filter for grain
   (generated in-CSS, no image asset needed) reads as an intentional
   sketchbook page, and doubles as a real frame for the
   still-unfilled template-walkthrough scenes instead of just empty
   space. The blue line art was already chosen for the dark-background
   version and turned out to read like blue ink/pencil on paper here
   too, so it didn't need recoloring for this swap.

   Real photographed paper texture (images/paper-texture.webp),
   swapped in for an earlier SVG fractal-noise version -- the real
   photo reads more natural. Downsized from the original 3888x2592/
   1MB source to a 900x900/35KB square, since the box only ever
   displays it at ~400x500 CSS px. */
.walkthrough-image {
  position: relative;
  width: 100%;
  max-width: 400px;
  aspect-ratio: 4 / 5;
  max-height: 60vh;
  border-radius: 16px;
  background-color: #f3ecda;
  background-image: url("images/paper-texture.webp");
  background-size: cover;
  background-position: center;
  box-shadow: inset 0 0 40px rgba(120, 95, 55, 0.18), 0 6px 16px rgba(0,0,0,0.3);
  border: 1px solid rgba(120, 95, 55, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.walkthrough-placeholder-label {
  font-family: var(--title-font);
  font-weight: 700;
  font-size: 1rem;
  text-align: center;
  padding: 0 20px;
  color: #5a4a30;
  opacity: 0.8;
}
/* Real art, once dropped in at images/walkthrough/, covers the
   placeholder entirely — its onload/onerror (see initWalkthrough() in
   the JS) keeps it display:none until a file actually exists at that
   path, so the "illustration coming soon" label doesn't show through
   underneath once one does. */
.walkthrough-image img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.walkthrough-caption {
  margin-top: 14px;
  font-size: 1.05rem;
  line-height: 1.5;
  text-align: center;
  max-width: 44ch;
}
/* Both walkthroughs' dots reuse .option-dots' markup shape, but that
   class's actual dot styling only exists inside the mobile carousel's
   media query — a walkthrough needs it at every screen size, so it's
   redefined here rather than widening that mobile-scoped rule and
   risking touching the carousel it was built for. */
#walkthroughDots, #templateWalkthroughDots {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 16px 0 4px;
}
#walkthroughDots button, #templateWalkthroughDots button {
  width: 10px; height: 10px; padding: 0; border: none; border-radius: 50%;
  cursor: pointer;
  background: rgba(255,255,255,0.35);
}
#walkthroughDots button.active, #templateWalkthroughDots button.active {
  background: rgb(var(--logo-glow));
  box-shadow: 0 0 8px rgba(var(--logo-glow), 0.8);
}
#howItWorksBack, #templateHowItWorksBack { margin-top: 12px; }

.iframe-wrap {
  width: 100%;
  max-width: 650px;
  aspect-ratio: 650 / 500;
  margin: 0 auto 18px;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 5px 5px 40px rgba(0,0,0,0.35);
  background: #fff; /* shows while the form loads */
}
.iframe-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

/* "About this project" card — left-aligned, readable paragraphs
   and a plain numbered list instead of the centered layout used
   for the fish/create cards. */
.card.info-card { max-width: 560px; text-align: left; }
.info-card h2 { text-align: center; }
.info-card h3 {
  font-family: var(--title-font);
  font-size: 1.05rem;
  margin: 4px 0 10px;
}
.info-card p { opacity: 0.9; line-height: 1.6; margin-bottom: 18px; }
.info-card ol {
  margin: 0 0 22px;
  padding-left: 1.3em;
  line-height: 1.6;
  opacity: 0.9;
}
.info-card li { margin-bottom: 8px; }
.info-card button { display: block; margin: 0 auto; }

/* "Find a fish" search card — a themed combobox: text input plus a
   scrollable grid of matches (thumbnail + name), styled like the rest
   of the tank's glass-and-bezel look. Left-aligned unlike the centered
   cards above, since a grid of tiles reads better that way. Wider than
   the default card (was 420px, sized for a plain text list) so the
   thumbnail grid gets a real multi-column layout instead of one
   cramped column. An empty query lists every fish deduped by creator
   (see renderSearchResults()), so this doubles as a visual gallery of
   everyone in the tank, not just a search result list. */
.card.search-card { max-width: 640px; }
.search-input {
  width: 100%;
  font: inherit;
  font-size: 1rem;
  padding: 11px 16px;
  margin-top: 4px;
  border-radius: 999px;
  border: 2px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.1);
  color: var(--text);
}
.search-input::placeholder { color: rgba(244,251,253,0.55); }
.search-input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.random-fish-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin: 10px 0 0;
  padding: 6px 16px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.1);
  color: var(--text);
  font: inherit; font-size: 0.85rem;
  cursor: pointer;
}
.random-fish-btn:hover, .random-fish-btn:focus-visible { background: rgba(255,255,255,0.2); }
.search-status { font-size: 0.85rem; opacity: 0.8; margin: 10px 0 0; min-height: 1.2em; text-align: left; }
.search-results {
  list-style: none;
  margin: 8px 0 18px;
  padding: 10px;
  max-height: min(420px, 55vh);
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  gap: 8px;
  text-align: left;
  border-radius: 12px;
}
.search-results:not(:empty) { border: 1px solid rgba(255,255,255,0.15); }
.search-result {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 6px;
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
}
.search-result img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
}
.search-result-name {
  font-size: 0.72rem;
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.search-result.active, .search-result:hover { background: rgba(255,255,255,0.18); }

/* Sound toggle — part of the top-controls row */
.sound-btn {
  order: 3;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  font-size: 1.15rem;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(4,26,44,0.35);
}

/* Logo — bottom right, with a neon-sign glow.
   Three stacked shadows: a tight bright core, a soft halo, and a
   wide faint spill — the classic neon look. Color comes from the
   --logo-glow token at the top of the styles. */
.logo {
  position: fixed;
  bottom: 18px;
  right: 22px;
  width: clamp(110px, 16vw, 190px);
  aspect-ratio: 790 / 600; /* the logo art's own ratio — lets JS read its
    real rendered height immediately, without waiting on image load */
  z-index: 600;
  filter:
    drop-shadow(0 0 3px  rgba(var(--logo-glow), 0.9))
    drop-shadow(0 0 10px rgba(var(--logo-glow), 0.55))
    drop-shadow(0 0 26px rgba(var(--logo-glow), 0.3));
}
.logo-link { cursor: pointer; }
.logo-link:focus-visible .logo { outline: 3px solid var(--cg-white, #fff); outline-offset: 4px; }

/* Language toggle — part of the top-controls row (rightmost) */
.lang-btn {
  order: 4;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  font-weight: 700;
  font-size: 0.9rem;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(4,26,44,0.35);
}

/* Night mode toggle — part of the top-controls row (after language) */
.night-btn {
  order: 5;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  font-size: 1.15rem;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(4,26,44,0.35);
}

/* Info button — part of the top-controls row (leftmost of the four) */
.info-btn {
  order: 1;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-weight: 800;
  font-size: 1.15rem;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(4,26,44,0.35);
}

/* Fullscreen toggle — part of the top-controls row (after info).
   Desktop only: see the mobile media query further down, which hides
   this entirely rather than folding it into the hamburger menu --
   the tank already fills a phone screen edge to edge, and the
   Fullscreen API isn't reliably available on mobile browsers anyway. */
.fullscreen-btn {
  order: 2;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  font-size: 1.15rem;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(4,26,44,0.35);
}

/* Search button — part of the top-controls row, leftmost of all five.
   A keyboard/screen-reader path to any fish that doesn't depend on
   hovering or clicking a moving target in the tank. */
.search-btn {
  order: 0;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  font-size: 1.05rem;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(4,26,44,0.35);
}

/* Keyboard-focus rings — visible outline for every interactive
   control so tabbing through the page is never a guessing game. */
.info-btn:focus-visible,
.search-btn:focus-visible,
.fullscreen-btn:focus-visible,
.menu-toggle-btn:focus-visible,
.sound-btn:focus-visible,
.lang-btn:focus-visible,
.night-btn:focus-visible,
.create-btn:focus-visible,
.card-nav:focus-visible,
.card button:focus-visible,
.option-btn:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

/* DETAIL CARD */
.card-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,25,43,0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 900;
}
.card-overlay.open { display: flex; }
/* The fish detail card can now open while the search overlay stays
   open behind it (see selectSearchResult()/randomFishBtn's own
   comments) — both share the base z-index above, so without this the
   later-in-DOM #searchOverlay would paint over the card instead of
   the other way around. Bumped just enough to win that specific
   stacking, not so far it'd fight the toast/tour z-indexes elsewhere
   on the page (those stay well above 900 too). */
#cardOverlay.open { z-index: 910; }
.card {
  /* Translucent black card — the tank glows through it.
     The backdrop blur keeps text readable over the busy video;
     remove the backdrop-filter lines if you want pure 25% black. */
  background: rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 24px;
  padding: 34px 38px;
  max-width: 560px;
  width: calc(100% - 40px);
  max-height: calc(100% - 60px);
  overflow-y: auto;          /* long bios scroll inside the card */
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}
/* Fixed-size box, not sized to whatever fish happens to be showing —
   otherwise paging through one creator's fish (different images,
   different aspect ratios) resized the card on every click and the
   Back/paging buttons jumped around beneath it. Square, and sized to
   the tallest fish in the tank relative to its own width (roughly
   1:1 — see the fish image dimension check) — every other fish is
   wider-than-tall and just letterboxes a bit inside the same box. */
#cardArt {
  width: 100%;
  max-width: 430px;
  aspect-ratio: 1 / 1;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#cardArt img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 8px 18px rgba(4,26,44,0.25));
}

/* Paging row for browsing one creator's other fish — flanks the
   Back button rather than sitting over the artwork, so it never
   covers the picture. Arrows hidden by default; shown in JS only
   when the current fish's creator has more than one fish in the
   tank, in which case Back stays centered between them. */
.card-footer-nav { display: flex; align-items: center; justify-content: center; gap: 14px; }
.card-nav {
  display: none;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border: none;
  border-radius: 50%;
  font-family: var(--title-font);
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
}
/* JS toggles visibility to "inline-flex" (matching align/justify
   above) — the base rule stays display:none so most cards, whose
   creator has only one fish, show no arrows at all. */
.card-nav.shown { display: inline-flex; }
.card-nav:hover { transform: scale(1.08); }
/* Every overlay's heading gets tabindex="-1" + .focus() when its
   dialog opens (see focusOverlayHeading()) purely to move screen-
   reader focus — it's deliberately excluded from the tab order, so a
   sighted user never actually tabs to it. Browsers can't always tell
   that apart from a "real" keyboard focus, so on a fresh page load
   (no prior mouse click yet for their :focus-visible heuristic to go
   on) they draw the default outline anyway; one click anywhere else
   and the heuristic switches, so it never comes back until reload.
   Always invisible on plain small headings, suddenly obvious on
   #cardName's large glowing text. No outline needed here either way
   — nothing sighted users tab to. */
.card h2 { font-family: var(--title-font); font-size: 1.7rem; margin-bottom: 4px; outline: none; }
.card p  { opacity: 0.75; margin-bottom: 18px; }
/* The fish detail card's headline used to be fish.name (always blank
   — no fish in this tank has one) with the creator credited below in
   a small, dim line, so the credit read as an afterthought under a
   lot of buttons. The creator's name IS the content here, so it gets
   the headline treatment instead, with a small label above it. */
.card-eyebrow {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  opacity: 0.6;
  margin-bottom: 2px;
}
#cardName {
  font-size: 4.2rem;
  font-weight: 800;
  line-height: 1;    /* at this size, normal line-height's leading
                         above the glyphs read as extra gap under the
                         eyebrow label, on top of its own margin */
  color: rgb(var(--logo-glow));
  text-shadow:
    0 0 4px  rgba(var(--logo-glow), 0.9),
    0 0 14px rgba(var(--logo-glow), 0.55),
    0 0 34px rgba(var(--logo-glow), 0.3);
  margin-bottom: 18px;
}
/* The creator's optional bio / artist statement */
.card .bio {
  font-size: 0.98rem;
  line-height: 1.55;
  opacity: 0.85;
  margin: -6px 0 20px;
}
.card button {
  font: inherit;
  font-weight: 700;
  color: white;
  background: var(--card-text);
  border: none;
  border-radius: 999px;
  padding: 10px 28px;
  cursor: pointer;
}

/* All buttons match the SPA logo: same neon yellow, same glow.
   The color comes from --logo-glow, so changing that one token
   re-themes the logo AND every button together. */
.create-btn, .sound-btn, .lang-btn, .night-btn, .info-btn, .search-btn, .fullscreen-btn, .menu-toggle-btn, .school-arrow, .card-nav, .card button {
  background: rgb(var(--logo-glow));
  color: #123a52;
  box-shadow:
    0 0 4px  rgba(var(--logo-glow), 0.9),
    0 0 14px rgba(var(--logo-glow), 0.55),
    0 0 32px rgba(var(--logo-glow), 0.28);
}

/* When the fish detail card opens, its art pops in and the text
   fades up beneath it (.reveal, toggled in openCard()). This
   replaces the old "flying fish clone" — a copy of the clicked fish
   that tracked its on-screen position across several
   requestAnimationFrame steps and animated left/top/width/height to
   the card. It looked nice but could break: opening a second fish
   before the first's flight finished left the first one permanently
   hidden in the tank (its "currently flying, don't show it" flag got
   overwritten). Pure CSS has no position to track and nothing that
   can get stuck. */
.card.reveal #cardArt {
  animation: pop-in 0.4s cubic-bezier(0.22, 1.4, 0.36, 1) both;
}
@keyframes pop-in {
  from { opacity: 0; transform: scale(0.75); }
  to   { opacity: 1; transform: scale(1); }
}
.card.reveal h2, .card.reveal p, .card.reveal button {
  animation: fade-up 0.45s ease 0.32s both;
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* CALM MODE — after a few seconds without input, everything that
   isn't water or fish fades away and drifts slightly off toward
   its own edge of the screen. Two transition speeds: the fade-OUT
   is slow and gentle (the .calm rules), while the fade back IN is
   quick (the base rules), so the interface returns the instant
   the visitor moves. */
header, .logo, .create-btn, .sound-btn, .lang-btn, .night-btn, .info-btn, .search-btn, .fullscreen-btn, .menu-toggle-btn {
  transition: opacity 0.25s ease, translate 0.25s ease, transform 0.2s ease;
}
body.calm header      { opacity: 0; translate: 0 -16px; pointer-events: none; }
body.calm .logo       { opacity: 0; translate: 0  16px; }
body.calm .create-btn { opacity: 0; translate: 0  16px; pointer-events: none; }
body.calm .sound-btn,
body.calm .lang-btn,
body.calm .night-btn,
body.calm .info-btn,
body.calm .search-btn,
body.calm .fullscreen-btn,
body.calm .menu-toggle-btn { opacity: 0; translate: 0 -16px; pointer-events: none; }
body.calm header, body.calm .logo, body.calm .create-btn,
body.calm .sound-btn, body.calm .lang-btn, body.calm .night-btn, body.calm .info-btn, body.calm .search-btn, body.calm .fullscreen-btn, body.calm .menu-toggle-btn {
  transition: opacity 1.6s ease, translate 1.6s ease;
}

/* School arrows — swim to the previous / next school of fish */
.school-arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 600;
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  font-family: var(--title-font);
  font-size: 1.3rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.25s ease, translate 0.25s ease, transform 0.2s ease;
}
.school-arrow.prev { left: 18px; }
.school-arrow.next { right: 18px; }
.school-arrow:hover { transform: translateY(-50%) scale(1.1); }

/* One dot per school, bottom center — the lit dot is the current one */
.school-dots {
  position: fixed;
  bottom: 26px;
  left: 50%;
  translate: -50% 0;
  display: flex;
  gap: 10px;
  z-index: 600;
  transition: opacity 0.25s ease, translate 0.25s ease;
}
.school-dots button {
  width: 12px;
  height: 12px;
  padding: 0;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  background: rgba(255,255,255,0.45);
}
.school-dots button.active {
  background: rgb(var(--logo-glow));
  box-shadow: 0 0 8px rgba(var(--logo-glow), 0.8);
}

/* Calm mode: arrows slide toward their edges, dots sink */
body.calm .school-arrow.prev { opacity: 0; translate: -16px 0; pointer-events: none; }
body.calm .school-arrow.next { opacity: 0; translate: 16px 0; pointer-events: none; }
body.calm .school-dots { opacity: 0; translate: -50% 16px; pointer-events: none; }
body.calm .school-arrow, body.calm .school-dots {
  transition: opacity 1.6s ease, translate 1.6s ease;
}

/* Plain stand-in shown until your real image loads */
.placeholder {
  background: rgba(255,255,255,0.25);
  border: 2px dashed rgba(255,255,255,0.6);
  border-radius: 12px;
  aspect-ratio: 3 / 2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  text-align: center;
  padding: 6px;
}

/* "Tap to dive in" splash — sizing/typography here; actual
   show/hide and its background image are set from JS (see the
   mobile-video setup), since only JS knows which poster SETTINGS
   picked and whether there's even a video to gate in the first
   place. Layout/positioning live in the mobile media query below,
   since this only ever appears there. */
.mobile-splash {
  display: none;
  border: none;
  margin: 0;
  padding: 24px;
  font: inherit;
  color: var(--text);
  text-align: center;
  cursor: pointer;
}
.mobile-splash-title {
  display: block;
  font-family: 'Sixtyfour', 'Courier New', monospace;
  font-size: clamp(1.5rem, 7vw, 2.2rem);
  text-transform: uppercase;
  letter-spacing: 1px;
  color: rgb(var(--title-glow));
  text-shadow:
    0 0 4px  rgba(var(--title-glow), 0.9),
    0 0 14px rgba(var(--title-glow), 0.55),
    0 0 34px rgba(var(--title-glow), 0.3);
  margin-bottom: 18px;
}
.mobile-splash-prompt {
  display: block;
  font-family: var(--title-font);
  font-weight: 700;
  font-size: 1.05rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgb(var(--logo-glow));
  text-shadow: 0 0 4px rgba(var(--logo-glow), 0.9), 0 0 14px rgba(var(--logo-glow), 0.55);
  animation: splashPulse 1.6s ease-in-out infinite;
}
@keyframes splashPulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.5; }
}
.mobile-splash:focus-visible { outline: 3px solid #fff; outline-offset: -6px; }

/* "Please rotate" overlay — on a phone turned sideways, the tank's
   portrait-cropped background video and everything else tuned for a
   tall narrow viewport gets visibly stretched/mismatched. Rather
   than reworking every mobile-only piece to also handle a wide-short
   viewport, this fully covers the tank so that never gets seen at
   all. It's pure CSS (no JS timing to race), so it's applied by the
   browser as part of layout itself — in sync with the rotation, not
   a frame behind it.

   Originally matched on max-height alone, on the assumption that a
   landscape tablet always has plenty of height to spare — that broke
   on some drawing tablets (Wacom and similar), which report a short
   landscape viewport too and got told to rotate away from landscape,
   exactly the orientation you actually want for drawing. Added
   max-width so both dimensions have to be small — a real phone is
   narrow AND short in landscape; a tablet is short but still wide —
   so only genuine phones trigger this now. */
.rotate-overlay { display: none; }
@media (orientation: landscape) and (max-height: 640px) and (max-width: 900px) {
  .rotate-overlay {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    position: fixed;
    inset: 0;
    z-index: 3000;
    background: var(--water-bottom);
    text-align: center;
    padding: 24px;
  }
  .rotate-overlay-icon {
    font-size: 2.6rem;
    animation: rotateHint 1.8s ease-in-out infinite;
  }
  .rotate-overlay-text {
    font-family: var(--title-font);
    font-weight: 700;
    font-size: 1.05rem;
    max-width: 280px;
    color: var(--text);
  }
}
@keyframes rotateHint {
  0%, 100% { transform: rotate(0deg); }
  50%      { transform: rotate(-90deg); }
}

/* ---------- MOBILE ----------
   Everything above is position:fixed with desktop offsets, which
   doesn't reflow the way normal content does — at phone widths the
   top-controls row and the header title occupy nearly the same
   space and sit on top of each other. Below this width: drop the
   top-controls row below the header instead of beside it. */
@media (max-width: 640px) {
  /* Kept to one line regardless of how long a creator's name is —
     JS measures and shrinks the font-size to fit (see openCard()),
     since a fixed font-size can't guarantee that for arbitrary
     names. nowrap here is what makes an over-wide name overflow
     instead of wrapping, which is what JS then measures against. */
  #cardName { white-space: nowrap; }

  header { padding: 18px 20px; }
  /* Fully covered by the Info modal already — pure duplication that
     costs header height on a screen where vertical space is scarce. */
  header p { display: none; }
  /* "Feeling" / "Fishy" stacked on their own lines instead of side
     by side — stays inline as one line on desktop (see the base
     .title-line rule, there isn't one, so it's just normal text). */
  header h1 .title-line { display: block; }
  /* A couple points bigger than the desktop-tuned clamp() was
     landing on at this width. */
  header h1 { font-size: 1.4rem; }

  /* The school-switching arrows sit at the vertical center of the
     viewport by default, which on a phone lands right in the middle
     of the fish. Move them down to just above the bottom row
     (Create your Fish / the logo) instead. */
  .school-arrow { top: auto; bottom: 88px; transform: none; }
  /* The desktop :hover effect re-adds translateY(-50%), which the
     button no longer needs now that it's positioned via `bottom`
     instead of vertical centering — without this override, tapping
     it (touchscreens apply :hover on tap, with no mouse-leave to
     clear it afterward) made it visibly jump and stay jumped until
     tapping elsewhere. Replaced with a small press animation on
     :active instead, which suits a tap much better than a hover
     effect does anyway. */
  .school-arrow:hover { transform: none; }
  .school-arrow:active { transform: scale(0.88); }

  /* Same row as the arrows instead of hugging the very bottom, where
     it sat too close to Create your Fish. */
  .school-dots { bottom: 106px; }

  .mobile-splash.show {
    display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    position: fixed; inset: 0; z-index: 1500;
    background-size: cover; background-position: center;
    transition: opacity 0.4s ease;
  }
  .mobile-splash.dismissing { opacity: 0; pointer-events: none; }

  /* Four permanently-visible buttons (search/info/sound/lang)
     ate too much of the tank view on a phone. Collapse them behind
     one menu-toggle button; JS adds/removes .menu-open on click, tap
     elsewhere, or Escape. The toggle itself always stays visible —
     everything else in this row only shows up once opened. */
  .top-controls {
    top: 20px; right: 14px; gap: 10px;
    flex-direction: column; align-items: flex-end;
  }
  .menu-toggle-btn {
    display: flex; align-items: center; justify-content: center;
    order: -1;
    width: 44px; height: 44px;
    border: none; border-radius: 50%;
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
  }
  .top-controls > *:not(.menu-toggle-btn) { display: none; }
  .top-controls.menu-open > *:not(.menu-toggle-btn) { display: flex; }
  /* Desktop-only feature (see .fullscreen-btn's own comment) -- kept
     out of the hamburger menu entirely rather than just collapsed
     into it, so this !important wins even once menu-open reveals
     everything else above. */
  .fullscreen-btn { display: none !important; }
  /* Open, this was a single column tall enough to reach down into
     the school-arrow buttons (which sit at the vertical center of
     the screen) on shorter phones. Wrapping it into two columns
     instead roughly halves how far down it extends. */
  .top-controls.menu-open {
    flex-direction: row; flex-wrap: wrap;
    width: 98px; /* two 44px buttons + one 10px gap between them */
    justify-content: flex-end;
  }

  /* Guards against the create-btn/logo colliding on the narrowest
     phones still in use (~320-360px) — the logo's 110px floor and
     create-btn's full-text width leave very little room between
     them at that size otherwise. */
  .create-btn { padding: 10px 16px; font-size: 0.9rem; }
  .logo { width: clamp(80px, 16vw, 190px); }

  /* "Create your fish" and "choose a template" pop-ups: on a phone,
     buildOptionCarousel() (see the JS) shows one option at a time
     with prev/next arrows instead of stacking all three, so there's
     room to scale the visible button up much bigger. The heading is
     dropped visually too — with a single big self-explanatory button
     on screen it was just repeating "create your fish"/"choose your
     template" a phone has no spare room for — but stays in the DOM
     (same technique already used for .draw-card h2) so
     aria-labelledby still names the dialog for screen readers. */
  /* Locked to the same size across all three screens (measured from
     the tallest, createOverlay/downloadOverlay -- createChooseOverlay
     has no info-toggle button, so its own content is naturally
     shorter) rather than each auto-sizing to its own content, which
     made the box visibly resize/jump when moving between them.
     min-height, not height -- guarantees the floor without risking
     clipping if a translation ever runs longer. Centered instead of
     top-aligned so the shorter screen's content sits in the middle
     of the extra room instead of leaving a visible gap at the bottom. */
  #createOverlay .card, #createChooseOverlay .card, #downloadOverlay .card {
    padding: 22px 18px;
    min-height: 386px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    /* flex containers default align-items to stretch, which was
       quietly forcing every direct child -- the info-toggle pill,
       Close/Back -- to fill the full card width edge to edge instead
       of sizing to its own content. center keeps them their natural
       compact size. */
    align-items: center;
  }
  #createChooseOverlay .card > h2, #downloadOverlay .card > h2 {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  /* The toggle and the carousel below it had no real gap between
     them -- the toggle's own margin is just enough to clear the card
     edge above it, and the carousel only carries a BOTTOM margin, so
     there was nothing separating the two. Matches the ~26px gap
     already used between the dots and the Close/Back button below. */
  .info-toggle { margin-bottom: 26px; }
  .option-carousel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0 0 22px;
  }
  .option-carousel .option-row { margin: 0; }
  /* The carousel wrapper and dots already carry their own bottom
     margins (see .option-carousel and .option-dots below) -- the
     desktop-only 20px added to Close/Back above would just stack an
     extra, uncounted-for gap on top of that tightly-tuned mobile
     spacing. */
  #createClose, #createChooseBack, #downloadBack { margin-top: 0; }
  .option-carousel .option-btn {
    /* flex:0 0 auto overrides the base flex:1 (flex-basis:0%), which
       would otherwise stretch the lone visible button to fill the
       row instead of staying its own square size. */
    flex: 0 0 auto;
    width: 172px;
    min-width: 0;
    max-width: none;
    aspect-ratio: 1 / 1;
  }
  .option-carousel .option-btn.carousel-hidden { display: none; }
  /* nowrap so an over-long label (a font-fallback on some devices --
     e.g. Baloo 2 failing to load and landing on the much wider Comic
     Sans MS -- can push a two-word label like "DESIGN A FISH" past
     one line) overflows measurably instead of silently wrapping,
     which is what the shrink-to-fit JS in buildOptionCarousel()
     measures against (same technique already used for #cardName). */
  .option-carousel .inlay-text { white-space: nowrap; }

  /* One dot per option, echoing the school-dots pattern elsewhere on
     the page — the lit dot is the one currently shown. */
  .option-dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 0 0 26px;
  }
  .option-dots button {
    width: 10px; height: 10px; padding: 0; border: none; border-radius: 50%;
    cursor: pointer;
    background: rgba(255,255,255,0.35);
  }
  .option-dots button.active {
    background: rgb(var(--logo-glow));
    box-shadow: 0 0 8px rgba(var(--logo-glow), 0.8);
  }
}

@media (prefers-reduced-motion: reduce) {
  .decoration.sways, .fish:hover .wiggle,
  .bubble, .ray,
  .mobile-splash-prompt,
  .rotate-overlay-icon,
  .card.reveal #cardArt,
  .card.reveal h2, .card.reveal p, .card.reveal button { animation: none; }
  .bubble { display: none; }
  .thought { transition: opacity 0.2s ease; transform: none; }
  .fish:hover .thought { transition-delay: 3s; }
}
</style>
</head>
<body>

<div id="tank"></div>

<!-- Mobile-only "tap to dive in" splash: see the comment above the
     background-video setup further down for why this exists.
     Dismissing it is what starts the video, so by the time the tank
     is revealed playback has already begun, instead of the video
     suddenly starting later on some unrelated first tap. Hidden
     entirely above 640px width — see the CSS. -->
<button type="button" id="mobileSplash" class="mobile-splash">
  <span class="mobile-splash-title">Feeling Fishy</span>
  <span class="mobile-splash-prompt" id="splashPrompt"></span>
</button>

<!-- Pure-CSS "please rotate" cover for phones turned sideways — see
     the .rotate-overlay CSS for why this exists and isn't JS-driven. -->
<div class="rotate-overlay" role="alert">
  <span class="rotate-overlay-icon" aria-hidden="true">📱</span>
  <span class="rotate-overlay-text" id="rotateOverlayText"></span>
</div>

<header>
  <h1><span class="title-line">Feeling</span> <span class="title-line">Fishy</span></h1>
  <p id="tagline">Drag to spin the tank. Hover a fish to meet its creator.</p>
</header>

<!-- Info / Sound / Language buttons all live here so they lay out
     automatically as a row — no manual pixel math needed. Visual
     order is controlled by the `order` CSS property on each button,
     not by the order they're added in JS. -->
<div class="top-controls" id="topControls"></div>

<div class="card-overlay" id="cardOverlay" role="dialog" aria-modal="true" aria-labelledby="cardName">
  <div class="card">
    <div id="cardArt"></div>
    <p class="card-eyebrow" id="cardEyebrow"></p>
    <h2 id="cardName"></h2>
    <p class="bio" id="cardBio"></p>
    <!-- The prev/next arrows are shown only when this fish's creator
         has more than one fish in the tank — paging straight through
         all of theirs without going back to search each time. Placed
         beside Back rather than over the artwork so they never cover
         the picture. -->
    <div class="card-footer-nav">
      <button class="card-nav prev" id="cardPrev" type="button"><span aria-hidden="true">‹</span></button>
      <button id="cardBack" onclick="closeCard()">Back to the tank</button>
      <button class="card-nav next" id="cardNext" type="button"><span aria-hidden="true">›</span></button>
    </div>
  </div>
</div>

<!-- The "Create your fish" pop-up: two top-level intents -- make one
     (draw here or download a template), or submit a finished one
     through the monday.com form. -->
<div class="card-overlay" id="createOverlay">
  <div class="card">
    <h2 id="createTitle"></h2>
    <button class="info-toggle" id="createInfoToggle" type="button" aria-expanded="false" aria-controls="howItWorksOverlay">
      <span id="createInfoToggleLabel"></span>
    </button>
    <div class="option-row">
      <a class="option-btn" id="optCreate" role="button" tabindex="0"><span class="inlay" id="optCreateLabel"><span class="inlay-text"></span></span></a>
      <a class="option-btn" id="optSubmit" role="button" tabindex="0"><span class="inlay" id="optSubmitLabel"><span class="inlay-text"></span></span></a>
    </div>
    <button id="createClose" onclick="closeCreate()">Close</button>
  </div>
</div>

<!-- "Create a fish" sub-menu: the two ways to actually make the
     artwork -- draw it here, or download a template to work on
     elsewhere. Splitting this out from the top-level menu means a
     brand-new visitor sees two choices (create vs. submit) instead
     of three, with the format question only appearing once they've
     already decided they want to create. -->
<div class="card-overlay" id="createChooseOverlay">
  <div class="card">
    <h2 id="createChooseTitle"></h2>
    <div class="option-row">
      <a class="option-btn" id="optDraw" role="button" tabindex="0"><span class="inlay" id="optDrawLabel"><span class="inlay-text"></span></span></a>
      <a class="option-btn" id="optDownload" role="button" tabindex="0"><span class="inlay" id="optDownloadLabel"><span class="inlay-text"></span></span></a>
    </div>
    <button id="createChooseBack">Back</button>
  </div>
</div>

<!-- "How does it work?" walkthrough: a 4-scene illustrated carousel
     (Make / Send / Review / Swim), one template-fish character
     throughout. Illustrations are dropped in as real files --
     images/walkthrough/{1-make,2-send,3-review,4-swim}.webp -- each
     <img> below fails silently (onerror hides it) until then, so the
     CSS placeholder underneath shows in the meantime. Sized close to
     the full viewport (see .walkthrough-card) rather than the
     ~560-650px the other menu cards use, since a 4:5 illustration
     needs real room to not feel cramped. -->
<div class="card-overlay" id="howItWorksOverlay" role="dialog" aria-modal="true" aria-labelledby="howItWorksTitle">
  <div class="card walkthrough-card">
    <h2 id="howItWorksTitle"></h2>
    <div class="walkthrough">
      <button class="card-nav prev shown" id="walkthroughPrev" type="button" aria-label=""><span aria-hidden="true">‹</span></button>
      <div class="walkthrough-scene">
        <div class="walkthrough-image">
          <span class="walkthrough-placeholder-label" id="walkthroughPlaceholderLabel"></span>
          <img id="walkthroughImg" alt="">
        </div>
        <p class="walkthrough-caption" id="walkthroughCaption"></p>
      </div>
      <button class="card-nav next shown" id="walkthroughNext" type="button" aria-label=""><span aria-hidden="true">›</span></button>
    </div>
    <div class="option-dots" id="walkthroughDots"></div>
    <button id="howItWorksBack">Back</button>
  </div>
</div>

<!-- Second level of the create menu: choose a template format -->
<div class="card-overlay" id="downloadOverlay">
  <div class="card">
    <h2 id="downloadTitle"></h2>
    <button class="info-toggle" id="downloadInfoToggle" type="button" aria-expanded="false" aria-controls="templateHowItWorksOverlay">
      <span id="downloadInfoToggleLabel"></span>
    </button>
    <div class="option-row">
      <a class="option-btn" id="dlPng"><span class="inlay" id="dlPngLabel"><span class="inlay-text"></span></span></a>
      <a class="option-btn" id="dlPsd" target="_blank" rel="noopener"><span class="inlay" id="dlPsdLabel"><span class="inlay-text"></span></span></a>
      <a class="option-btn" id="dlKrita" target="_blank" rel="noopener"><span class="inlay" id="dlKritaLabel"><span class="inlay-text"></span></span></a>
    </div>
    <button id="downloadBack">Back</button>
  </div>
</div>

<!-- Template-specific "How does it work?" walkthrough -- covers the
     one thing the top-level walkthrough doesn't: what to actually do
     with a template once it's filled in (paper vs. digital), plus
     the file-size note. Same carousel mechanics as howItWorksOverlay,
     wired up via the shared initWalkthrough() helper rather than a
     second copy of the same code. -->

<script>
/* ==============================================================
   THE AQUARIUM ENGINE — runs everything using your data above.
   ============================================================== */
const tank = document.getElementById("tank");
if (SETTINGS.background) tank.style.backgroundImage = `url(${SETTINGS.background})`;

// On mobile the title stacks into "Feeling" / "Fishy" on two lines
// (see the CSS). The segmented font is close to monospace, so the
// shorter word renders visibly narrower than the one above it —
// stretch it horizontally to match, so both lines form one even
// block instead of a ragged right edge. Measures the actual glyph
// width via canvas rather than getBoundingClientRect(), since these
// spans are display:block (so they can stack), which makes their
// rect report the full parent width instead of the text's own —
// canvas measurement isn't affected by that box-model quirk at all.
if (window.innerWidth < 640) {
  const titleLines = [...document.querySelectorAll("header h1 .title-line")];
  if (titleLines.length === 2) {
    const measureCanvas = document.createElement("canvas").getContext("2d");
    function textWidth(el) {
      const cs = getComputedStyle(el);
      measureCanvas.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const base = measureCanvas.measureText(el.textContent).width;
      const letterSpacing = parseFloat(cs.letterSpacing) || 0; // measureText ignores letter-spacing
      return base + letterSpacing * Math.max(0, el.textContent.length - 1);
    }
    const [first, second] = titleLines;
    const firstWidth = textWidth(first);
    const secondWidth = textWidth(second);
    if (firstWidth > 0 && secondWidth > 0 && firstWidth !== secondWidth) {
      const narrower = firstWidth < secondWidth ? first : second;
      const ratio = Math.max(firstWidth, secondWidth) / Math.min(firstWidth, secondWidth);
      narrower.style.transformOrigin = "left";
      narrower.style.transform = `scaleX(${ratio})`;
    }
  }
}

// Looping video backdrop (e.g. rendered from your Unreal scene).
// muted + playsinline are required for browsers to autoplay it — and
// on iOS Safari specifically, setting the .muted/.playsInline JS
// properties alone isn't reliable for a <video> created dynamically
// like this; it wants the actual HTML attributes present too, plus
// an explicit .play() call rather than relying on the autoplay
// attribute by itself. Without this it silently just sits on the
// poster frame forever instead of looking broken.
// Shared with the mobile "tap to dive in" splash further down, so it
// can trigger the exact same play() attempt from its own dismiss tap.
let bgVideo = null;
let tryPlayBgVideo = () => {};

if (SETTINGS.backgroundVideo) {
  // Same 640px line every other mobile adjustment on this page uses.
  // Checked once at load — background video isn't worth hot-swapping
  // mid-session over a resize/rotation.
  const isMobileViewport = window.innerWidth < 640;
  const videoSrc = (isMobileViewport && SETTINGS.backgroundVideoMobile)
    ? SETTINGS.backgroundVideoMobile : SETTINGS.backgroundVideo;
  const posterSrc = (isMobileViewport && SETTINGS.backgroundVideoPosterMobile)
    ? SETTINGS.backgroundVideoPosterMobile : SETTINGS.backgroundVideoPoster;

  const vid = document.createElement("video");
  bgVideo = vid;
  vid.muted = true;
  vid.defaultMuted = true;
  vid.setAttribute("muted", "");
  vid.setAttribute("playsinline", "");
  vid.setAttribute("webkit-playsinline", "");
  vid.playsInline = true;
  vid.autoplay = true;
  vid.loop = true;
  if (posterSrc) vid.poster = posterSrc;
  vid.src = videoSrc;
  vid.setAttribute("style",
    "position:absolute; inset:0; width:100%; height:100%; " +
    "object-fit:cover; z-index:0; pointer-events:none;");
  tank.prepend(vid);
  const tryPlay = () => vid.play().catch(() => {});
  tryPlayBgVideo = tryPlay;
  tryPlay();
  // iOS sometimes ignores the first attempt if it happens before the
  // element is fully attached/laid out — retry once metadata is in.
  vid.addEventListener("loadedmetadata", tryPlay, { once: true });
  // Belt-and-suspenders for iOS: things like Low Power Mode can block
  // even a muted+playsinline autoplay, showing iOS's own "tap to
  // play" icon — which the visitor can't actually tap, since the
  // video is pointer-events:none so it doesn't steal taps meant for
  // dragging the tank. A genuine user gesture reliably overrides
  // that block, so retry on every tap anywhere until it actually
  // starts, then stop listening.
  window.addEventListener("pointerdown", tryPlay);
  vid.addEventListener("playing", () => {
    window.removeEventListener("pointerdown", tryPlay);
  }, { once: true });

  // Optional dark veil over the video so the fish stand out
  if (SETTINGS.videoDimmer > 0) {
    const veil = document.createElement("div");
    veil.setAttribute("style",
      "position:absolute; inset:0; background:black; z-index:1; " +
      "pointer-events:none; opacity:" + SETTINGS.videoDimmer + ";");
    tank.appendChild(veil);
  }

  /* --- "Tap to dive in" splash (mobile only) -----------------------
     iOS can silently block muted+playsinline autoplay — Low Power
     Mode is the common cause — and without this, the video would
     only start later on whatever random first tap happened to land
     (the retry logic above), which felt like a jarring glitch
     mid-interaction. This turns that same required tap into a
     deliberate "enter the tank" moment instead: dismissing it is
     what starts the video, so playback has already begun by the
     time the tank is revealed. Every mobile visitor sees this, not
     just ones actually affected by an autoplay block — there's no
     way to detect Low Power Mode from JS to skip it selectively. */
  if (isMobileViewport) {
    const splash = document.getElementById("mobileSplash");
    if (posterSrc) {
      splash.style.backgroundImage =
        `linear-gradient(rgba(5,25,43,.6), rgba(5,25,43,.6)), url(${posterSrc})`;
    }
    splash.classList.add("show");
    splash.focus();

    function dismissSplash() {
      tryPlayBgVideo();
      splash.classList.add("dismissing");
      splash.addEventListener("transitionend", () => splash.remove(), { once: true });
      setTimeout(() => splash.remove(), 500); // safety net if transitionend never fires
    }
    splash.addEventListener("click", dismissSplash);
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.body.contains(splash)) dismissSplash();
    });
  }
}

// Helper: re-map a number from one range to another.
function mapRange(value, inMin, inMax, outMin, outMax) {
  return outMin + (value - inMin) / (inMax - inMin) * (outMax - outMin);
}

// Plain placeholder for images that haven't been added yet
function placeholderFor(path) {
  const ph = document.createElement("div");
  ph.className = "placeholder";
  ph.textContent = path;
  return ph;
}

/* --- Water effects: bubbles, rays, ripple ----------------------
   The ripple works with an SVG "displacement map": an invisible
   layer of animated noise pushes every pixel of the tank around
   slightly, like light bending through moving water. ----------- */
const stillMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

if (WATER.bubbles > 0) {
  for (let i = 0; i < WATER.bubbles; i++) {
    const b = document.createElement("div");
    b.className = "bubble";
    const size = 5 + Math.random() * 16;              // 5–21 px wide
    b.style.width = b.style.height = size + "px";
    b.style.left = Math.random() * 100 + "%";
    b.style.setProperty("--sway", (4 + Math.random() * 14) + "px");
    b.style.animationDuration = (7 + Math.random() * 9) + "s";
    b.style.animationDelay = (Math.random() * -16) + "s"; // already mid-rise
    // Some bubbles drift behind the fish, some in front — adds depth
    b.style.zIndex = Math.random() < 0.6 ? 5 : 320;
    tank.appendChild(b);
  }
}

if (WATER.rays) {
  [{ left: "12%", delay: "0s" }, { left: "38%", delay: "2s" },
   { left: "67%", delay: "4s" }].forEach((r) => {
    const ray = document.createElement("div");
    ray.className = "ray";
    ray.style.left = r.left;
    ray.style.animationDelay = r.delay;
    tank.appendChild(ray);
  });
}

if (WATER.ripple && !stillMotion) {
  const svg = document.createElement("div");
  svg.innerHTML = `
    <svg width="0" height="0" style="position:absolute">
      <filter id="ripple" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.016"
                      numOctaves="1" seed="3" result="noise">
          <animate attributeName="baseFrequency" dur="16s"
                   values="0.008 0.016; 0.011 0.021; 0.008 0.016"
                   repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise"
                           scale="${WATER.rippleStrength}"/>
      </filter>
    </svg>`;
  document.body.appendChild(svg);
  // The distortion pushes pixels past the screen edge, so the tank
  // is stretched slightly beyond the viewport to hide the seams.
  tank.style.inset = "-16px";
  tank.style.filter = "url(#ripple)";
}

/* --- The chime engine (Web Audio) -------------------------------
   Every fish plays the SAME xylophone sample, but pitched to its
   own step of a major pentatonic scale — a scale where every note
   is consonant with every other. Hover several fish quickly and
   the overlapping notes stack into chords instead of clashing.

   The reverb is a convolver fed a generated "impulse response"
   (2.8 seconds of decaying noise = a big virtual room), and the
   reverb path runs through a lowpass filter first, which darkens
   the echoes — big, but deep underwater. ------------------------ */

// Two octaves of major pentatonic (in semitones above the sample)
const CHIME_SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];

let audioCtx = null, chimeBuffer = null, chimeLoading = false;
let chimeDry = null, chimeWetIn = null;

function initChimeEngine() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Dry path: the note, straight to the speakers
  chimeDry = audioCtx.createGain();
  chimeDry.gain.value = 0.7;
  chimeDry.connect(audioCtx.destination);

  // Wet path: lowpass (darkens it) -> reverb -> speakers
  const lowpass = audioCtx.createBiquadFilter();
  lowpass.type = "lowpass";
  lowpass.frequency.value = 1600;   // lower = murkier water

  const reverb = audioCtx.createConvolver();
  const rate = audioCtx.sampleRate;
  const seconds = 2.8;              // reverb tail length
  const impulse = audioCtx.createBuffer(2, rate * seconds, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = impulse.getChannelData(ch);
    for (let i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
    }
  }
  reverb.buffer = impulse;

  const wet = audioCtx.createGain();
  wet.gain.value = 0.55;            // how much reverb in the mix

  lowpass.connect(reverb);
  reverb.connect(wet);
  wet.connect(audioCtx.destination);
  chimeWetIn = lowpass;
}

async function loadChime(src) {
  if (chimeBuffer || chimeLoading) return;
  chimeLoading = true;
  try {
    const res = await fetch(src);
    chimeBuffer = await audioCtx.decodeAudioData(await res.arrayBuffer());
  } catch (e) {
    // no-op -- chimeLoading resets in finally either way
  } finally {
    chimeLoading = false;
  }
}

function playChime(src, semitones) {
  if (!soundOn) return;
  initChimeEngine();
  if (audioCtx.state === "suspended") audioCtx.resume();
  if (!chimeBuffer) {
    // First hover: decode the sample, then ring the note
    loadChime(src).then(() => {
      if (chimeBuffer && soundOn) playChime(src, semitones);
    });
    return;
  }
  const note = audioCtx.createBufferSource();
  note.buffer = chimeBuffer;
  // Each semitone up multiplies the speed by 2^(1/12)
  note.playbackRate.value = Math.pow(2, semitones / 12);
  const g = audioCtx.createGain();
  g.gain.value = 0.25;
  note.connect(g);
  g.connect(chimeDry);     // direct sound
  g.connect(chimeWetIn);   // and into the underwater reverb
  note.start();
}

/* --- Build the fish ------------------------------------------- */
const swimmers = FISH.map((fish, i) => {
  const el = document.createElement("div");
  el.className = "fish";

  const img = document.createElement("img");
  // src is set lazily by loadSchool() below, not here — with FISH
  // lists that grow into the hundreds, fetching every image on every
  // visit regardless of which school is even active gets expensive
  // fast. Only the starting school and its two neighbors load up
  // front; the rest load as the visitor actually browses toward them.
  // Placeholder — corrected to the localized, name-aware version by
  // applyLanguage()'s loop below, which runs once right after this.
  img.alt = fish.creator;
  img.onerror = () => img.replaceWith(placeholderFor(fish.image));

  const wiggle = document.createElement("div");
  wiggle.className = "wiggle";
  wiggle.appendChild(img);

  // The flip wrapper mirrors only the artwork when the fish swims
  // the other way — the name tag and thought bubble stay readable
  const flip = document.createElement("div");
  flip.appendChild(wiggle);

  const tag = document.createElement("span");
  tag.className = "name-tag";
  tag.textContent = "by " + fish.creator;

  el.append(flip, tag);

  // Each fish gets one of three hover personalities at random
  el.classList.add("anim" + Math.floor(Math.random() * 3));

  // Thought bubble with the creator's bio, if they shared one
  if (fish.bio) {
    const thought = document.createElement("div");
    thought.className = "thought";
    thought.textContent = fish.bio;
    el.appendChild(thought);
  }

  el.addEventListener("click", () => { if (!wasDragged) openCard(i); });

  // Per-fish chime: same sample, but pitched to this fish's own
  // step of the pentatonic scale (see the chime engine above), so
  // sweeping across the school plays a melody, and overlaps chord.
  if (fish.sound) {
    const semitones = CHIME_SCALE[i % CHIME_SCALE.length];
    el.addEventListener("pointerenter", () => playChime(fish.sound, semitones));
  }

  // Hovered fish come forward: the orbit loop enlarges them and
  // lifts them above their neighbours (see the animate function)
  const state = {
    el,
    imgEl: img,
    flipEl: flip,
    hovered: false,
    flipped: false,
    size: fish.size || 120,
    // Spread around the carousel WITHIN this fish's school
    angle: ((i % SCHOOL_SIZE) /
      Math.min(SCHOOL_SIZE, FISH.length - Math.floor(i / SCHOOL_SIZE) * SCHOOL_SIZE))
      * Math.PI * 2,
    active: true,
    // Each fish orbits at a slightly different distance (85%–115%
    // of the base radius) so a big school doesn't look like a ring
    radiusJitter: 0.85 + Math.random() * 0.3,
    height: fish.height ?? mapRange(i % 3, 0, 2, 25, 60),
    bobOffset: Math.random() * Math.PI * 2,
  };
  el.addEventListener("pointerenter", () => { state.hovered = true; });
  el.addEventListener("pointerleave", () => { state.hovered = false; });

  tank.appendChild(el);
  return state;
});

/* --- Build the decorations ------------------------------------ */
DECORATIONS.forEach((deco) => {
  const el = document.createElement("div");
  el.className = "decoration" + (deco.sway ? " sways" : "");
  el.style.left = deco.x + "%";
  el.style.height = deco.height + "px";
  el.style.animationDelay = (Math.random() * -4) + "s";

  const img = document.createElement("img");
  img.src = deco.image;
  img.alt = "";
  img.onerror = () => {
    const ph = placeholderFor(deco.image);
    ph.style.height = "100%";
    img.replaceWith(ph);
  };
  el.appendChild(img);
  tank.appendChild(el);
});

/* --- Schools ------------------------------------------------------
   The FISH list is split into schools of SCHOOL_SIZE. Only one
   school swims at a time; the arrows (or dots) change schools with
   a swim-through: the current school darts off in the direction of
   travel, and the next glides in from the other side. ------------- */
const schoolCount = Math.ceil(FISH.length / SCHOOL_SIZE);
let schoolIndex = 0;
let schoolOffset = 0;     // px added to every fish's x during transit
let schoolAnim = null;    // { phase: "out"|"in", dir, next, start }
let schoolDots = null;

// Fetches one school's fish images (a no-op for any fish already
// loaded — setting the same .src twice doesn't re-fetch it). Doesn't
// touch visibility; setSchoolVisibility() handles that separately.
function loadSchool(idx) {
  if (idx < 0 || idx >= schoolCount) return;
  const start = idx * SCHOOL_SIZE;
  const end = Math.min(start + SCHOOL_SIZE, FISH.length);
  for (let i = start; i < end; i++) {
    const img = swimmers[i].imgEl;
    if (!img.src) img.src = FISH[i].image;
  }
}

// Keeps the active school AND both of its neighbors loaded, so
// whichever way someone pages next, those images are already sitting
// in the browser cache by the time the switch animation needs them —
// the fetch happens quietly during the few seconds someone spends
// looking at the current school, not at the moment they click.
function warmAdjacentSchools(idx) {
  loadSchool(idx);
  loadSchool((idx - 1 + schoolCount) % schoolCount);
  loadSchool((idx + 1) % schoolCount);
}

function setSchoolVisibility() {
  swimmers.forEach((f, i) => {
    f.active = Math.floor(i / SCHOOL_SIZE) === schoolIndex;
    f.el.style.display = f.active ? "" : "none";
  });
}

function updateDots() {
  if (!schoolDots) return;
  [...schoolDots.children].forEach((dot, i) =>
    dot.classList.toggle("active", i === schoolIndex));
}

// dir is only for the swim-through animation (which side the current
// school exits/enters from) — next is the actual destination, so this
// jumps straight there in one animation regardless of how far away it
// is, rather than stepping through every school in between.
function goToSchool(next, dir) {
  if (schoolAnim || schoolCount < 2 || next === schoolIndex) return;
  if (stillMotion) {              // reduced motion: instant swap
    schoolIndex = next;
    setSchoolVisibility();
    updateDots();
    warmAdjacentSchools(schoolIndex);
    return;
  }
  schoolAnim = { phase: "out", dir, next, start: performance.now() };
  // A little chime marks the change: a fifth up going forward,
  // back to the root coming back
  const withSound = FISH.find((f) => f.sound);
  if (withSound) playChime(withSound.sound, dir > 0 ? 7 : 0);
}
function changeSchool(dir) {
  goToSchool((schoolIndex + dir + schoolCount) % schoolCount, dir);
}

if (schoolCount > 1) {
  const prev = document.createElement("button");
  prev.className = "school-arrow prev";
  prev.textContent = "❮";
  prev.addEventListener("click", () => changeSchool(-1));
  const nextBtn = document.createElement("button");
  nextBtn.className = "school-arrow next";
  nextBtn.textContent = "❯";
  nextBtn.addEventListener("click", () => changeSchool(1));
  document.body.append(prev, nextBtn);

  schoolDots = document.createElement("div");
  schoolDots.className = "school-dots";
  for (let s = 0; s < schoolCount; s++) {
    const dot = document.createElement("button");
    dot.addEventListener("click", () => {
      // Whichever way around the circular list is fewer schools —
      // purely which side the swim-through animation exits/enters
      // from, since goToSchool jumps straight to s either way.
      const forward = (s - schoolIndex + schoolCount) % schoolCount;
      const backward = (schoolIndex - s + schoolCount) % schoolCount;
      goToSchool(s, forward <= backward ? 1 : -1);
    });
    schoolDots.appendChild(dot);
  }
  document.body.appendChild(schoolDots);
  updateDots();
}
setSchoolVisibility();
warmAdjacentSchools(schoolIndex);

/* --- Sound: ambience + fish SFX, one master switch --------------
   Browsers block sound until the visitor interacts with the page,
   so the tank starts silent and the first click/drag (or the
   speaker button) turns everything on. The same button mutes both
   the music bed and the per-fish hover sounds. ------------------ */
let audio = null;
let soundOn = false;   // master switch — fish SFX check this too
const hasAnySfx = FISH.some((fish) => fish.sound);

if (SETTINGS.music || hasAnySfx) {
  const soundBtn = document.createElement("button");
  soundBtn.className = "sound-btn";
  soundBtn.textContent = "🔇";
  soundBtn.title = "Turn sound on";
  soundBtn.setAttribute("aria-label", "Toggle sound");
  document.getElementById("topControls").appendChild(soundBtn);

  // The music track (audio) is only created here, the first time sound
  // is actually turned on — same lazy pattern as the pluck/drag SFX
  // below. Creating it eagerly at load, like this used to, made the
  // browser start fetching the whole file (1.5MB+) on every visit
  // whether or not anyone ever turns sound on at all.
  function setSound(on) {
    soundOn = on;
    if (SETTINGS.music) {
      if (on) {
        if (!audio) {
          audio = new Audio(SETTINGS.music);
          audio.loop = true;
          audio.volume = 0.5;
        }
        audio.play().catch(() => {});
      } else if (audio) {
        audio.pause();
      }
    }
    soundBtn.textContent = on ? "🔊" : "🔇";
    soundBtn.title = on ? "Turn sound off" : "Turn sound on";
  }

  soundBtn.addEventListener("click", (e) => {
    e.stopPropagation();              // don't start a tank-drag
    setSound(!soundOn);
  });

  // Sound stays off until the visitor explicitly hits the speaker
  // button — it should never turn itself on. But browsers only allow
  // starting an AudioContext / decoding audio after a genuine user
  // gesture, so this quietly warms up the chime engine on the first
  // tap anywhere (inaudible — just downloading/decoding a buffer) so
  // that whenever sound IS turned on, the first hover rings instantly
  // instead of lagging while the sample loads.
  window.addEventListener("pointerdown", function firstTap() {
    if (hasAnySfx) {
      initChimeEngine();
      const firstWithSound = FISH.find((f) => f.sound);
      if (firstWithSound) loadChime(firstWithSound.sound);
    }
    window.removeEventListener("pointerdown", firstTap);
  });
}

/* --- Walkthrough mechanics --------------------------------------
   Shared by both the top-level "How does it work?" and the
   template-picker's own version — same carousel behavior, different
   element-id prefix and scene data. Real illustrations drop in later
   as images/walkthrough/<file> — until those files exist, each
   <img>'s onerror hides it and shows the placeholder label (a scene
   number, "illustration coming soon") instead of a broken-image icon;
   onload does the reverse the moment a real file is found. Swapping
   in real art later is just adding files at those paths, no
   code changes needed. */
function initWalkthrough(idPrefix, scenes) {
  let index = 0;
  let loadToken = 0; // guards against a stale preload landing after a newer one
  const img = document.getElementById(idPrefix + "Img");
  const caption = document.getElementById(idPrefix + "Caption");
  const placeholderLabel = document.getElementById(idPrefix + "PlaceholderLabel");
  const dots = document.getElementById(idPrefix + "Dots");
  scenes.forEach((_, i) => {
    const dot = document.createElement("button");
    dot.type = "button";
    dot.addEventListener("click", () => show(i));
    dots.appendChild(dot);
  });
  function show(i) {
    index = (i + scenes.length) % scenes.length;
    const scene = scenes[index];
    const src = "images/walkthrough/" + scene.file;
    const token = ++loadToken;
    // Preloaded off-screen first, so the visible <img> only ever gets
    // a src that's already fully loaded -- setting it directly and
    // reacting afterward left a real, visible flash of the
    // placeholder label between switching scenes and the image
    // actually appearing, even once it was browser-cached.
    const preload = new Image();
    preload.onload = () => {
      if (token !== loadToken) return; // a newer show() already ran
      img.src = src;
      img.style.display = "block";
      placeholderLabel.style.display = "none";
    };
    preload.onerror = () => {
      if (token !== loadToken) return;
      img.style.display = "none";
      placeholderLabel.style.display = "";
    };
    preload.src = src;
    caption.textContent = TEXT[lang][scene.captionKey];
    placeholderLabel.textContent = TEXT[lang].walkthroughPlaceholder
      .replace("{n}", index + 1).replace("{total}", scenes.length);
    [...dots.children].forEach((d, j) => d.classList.toggle("active", j === index));
  }
  document.getElementById(idPrefix + "Prev").addEventListener("click", () => show(index - 1));
  document.getElementById(idPrefix + "Next").addEventListener("click", () => show(index + 1));
  return { reset: () => show(0), rerender: () => show(index) };
}

// On mobile, an option-row's buttons page one at a time

// wherever no carousel was built (desktop, or a menu with only one
// option), since showCarouselOption is only ever set by that code.
function resetOptionCarousel(overlay) {

  });

  // "Download the fish template" opens the format submenu
  if (SETTINGS.templateUrl || SETTINGS.templatePsd || SETTINGS.templateKrita) {
    optDownload.addEventListener("click", () => {

      resetOptionCarousel(downloadOverlay);
      downloadOverlay.classList.add("open");

  } else optDownload.style.display = "none";

  // "Draw it yourself" — lazy-loads the draw tool's stylesheet, its
  // script, and (via that script, only once the template picker
  // actually renders) its template images. Nothing here is fetched
  // until this option is clicked for the first time.
  const optDraw = document.getElementById("optDraw");
  const drawOverlay = document.getElementById("drawOverlay");
  const drawToolMount = document.getElementById("drawToolMount");
  let drawToolLoading = null; // the in-flight load promise, so a
                               // second click while loading doesn't
                               // fetch the CSS/JS twice
  function loadDrawTool() {
    if (window.FishDrawTool) return Promise.resolve();
    if (drawToolLoading) return drawToolLoading;
    drawToolLoading = new Promise((resolve, reject) => {
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "create-your-fish-draw.css?v=23";
      document.head.appendChild(css);

      const script = document.createElement("script");
      script.src = "create-your-fish-draw.js?v=17";
      script.onload = resolve;
      script.onerror = reject;
      document.body.appendChild(script);
    });
    // If this load fails, forget about it instead of caching a dead
    // rejected promise -- otherwise every future click on "Draw it
    // yourself" for the rest of the session would hit the guard above
    // and return that same already-rejected promise, so a single
    // network blip would silently disable the draw tool until a full
    // page reload. This .catch() only resets the module-level
    // variable as a side effect -- it doesn't swallow the rejection,
    // which still propagates to whoever called loadDrawTool().
    drawToolLoading.catch(() => { drawToolLoading = null; });
    return drawToolLoading;
  }
  optDraw.addEventListener("click", () => {
    createChooseOverlay.classList.remove("open");
    drawOverlay.classList.add("open");
    focusOverlayHeading(drawOverlay);
    // Third argument: what the draw tool's own "Submit My Fish"

    // endpoint isn't configured, falls back to the old flow: download

    // Fourth argument: what the tool's own internal Back button
    // (desktop only — see create-your-fish-draw.css) calls; the
    // external #drawBack button below still handles this on mobile.
    loadDrawTool()
      .then(() => window.FishDrawTool.mount(
        drawToolMount,

  });

  // These three are <a> tags with no href (they navigate within the
  // page via JS, not to a real URL), so role="button" alone doesn't

  // Enter/Space need to be wired to trigger the same click handler.
  [optCreate, optDownload, optDraw, optSubmit].forEach((btn) => {

  const submitOverlay = document.getElementById("submitOverlay");

  let submitFrameLoaded = false; // iframe.src reads back as a real URL even
                                  // when src="", so a plain boolean flag is
                                  // used here instead of checking .src itself
  // Shared by the "Submit your fish" button and the draw tool's own

  function openSubmitScreen(fromOverlay) {

    // Only point the iframe at the real form the first time it's
    // opened — no network request to monday.com until someone
    // actually asks to submit a fish.

  if (SETTINGS.submitEmbedUrl) {

  } else optSubmit.style.display = "none";

    resetOptionCarousel(createOverlay);
    createOverlay.classList.add("open");
    focusOverlayHeading(createOverlay);

    submitOverlay.classList.remove("open");

  // Back returns to the create/download sub-menu, not the top level;
  // backdrop click closes fully. Shared by the external #drawBack
  // button (mobile) and the draw tool's own internal Back button
  // (desktop, passed in as mount()'s 4th argument) — same action
  // either way, just triggered from a different place.
  function goBackFromDraw() {
    drawOverlay.classList.remove("open");
    resetOptionCarousel(createChooseOverlay);
    createChooseOverlay.classList.add("open");
    focusOverlayHeading(createChooseOverlay);
  }
  document.getElementById("drawBack").addEventListener("click", goBackFromDraw);
  drawOverlay.addEventListener("click", (e) => {
    if (e.target !== drawOverlay) return;
    drawOverlay.classList.remove("open");
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  });

  // "Almost done!" — the draw tool's own submit flow: post the
  // drawing straight to SETTINGS.directSubmitEndpoint instead of
  // opening the monday.com iframe. See that setting's own comment.
  const directSubmitOverlay = document.getElementById("directSubmitOverlay");
  const directSubmitFormWrap = document.getElementById("directSubmitFormWrap");
  const directSubmitForm = document.getElementById("directSubmitForm");
  const directSubmitStatus = document.getElementById("directSubmitStatus");
  const directSubmitSend = document.getElementById("directSubmitSend");
  const directSubmitSuccess = document.getElementById("directSubmitSuccess");
  let pendingFishBlob = null; // set right before this overlay opens, cleared once submitted

  function openDirectSubmit(blob) {
    pendingFishBlob = blob;
    directSubmitForm.reset();
    directSubmitStatus.textContent = "";
    directSubmitStatus.classList.remove("error");
    directSubmitSend.disabled = false;
    directSubmitFormWrap.hidden = false;
    directSubmitSuccess.hidden = true;
    drawOverlay.classList.remove("open");
    directSubmitOverlay.classList.add("open");
    focusOverlayHeading(directSubmitOverlay);
  }

  directSubmitForm.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!pendingFishBlob) return;

    const email = document.getElementById("directSubmitEmail").value.trim();
    const postalCode = document.getElementById("directSubmitPostal").value.trim();
    directSubmitSend.disabled = true;
    directSubmitStatus.classList.remove("error");
    directSubmitStatus.textContent = TEXT[lang].directSubmitSending;

    const body = new FormData();
    body.append("creator", name);
    body.append("email", email);
    body.append("postalCode", postalCode);
    body.append("file", pendingFishBlob, "my-fish.png");

    fetch(SETTINGS.directSubmitEndpoint, { method: "POST", body })

        if (!resp.ok) throw new Error("submit failed: " + resp.status);

        directSubmitFormWrap.hidden = true;
        directSubmitSuccess.hidden = false;
        const successHeading = document.getElementById("directSubmitSuccessText");

      .catch(() => {

  // Back returns to the canvas (in case they want to keep editing)
