  background: rgba(5,25,43,0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 900;
}
.card-overlay.open { display: flex; }
.card {
  /* Translucent black card — the tank glows through it.
     The backdrop blur keeps text readable over the busy video;
     remove the backdrop-filter lines if you want pure 25% black. */
  background: rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 24px;
  padding: 34px 38px;
  max-width: 560px;
  width: calc(100% - 40px);
  max-height: calc(100% - 60px);
  overflow-y: auto;          /* long bios scroll inside the card */
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}
.card img {
  width: 100%;
  max-width: 430px;
  margin-bottom: 16px;
  filter: drop-shadow(0 8px 18px rgba(4,26,44,0.25));
}

/* Paging row for browsing one creator's other fish — flanks the
   Back button rather than sitting over the artwork, so it never
   covers the picture. Arrows hidden by default; shown in JS only
   when the current fish's creator has more than one fish in the
   tank, in which case Back stays centered between them. */
.card-footer-nav { display: flex; align-items: center; justify-content: center; gap: 14px; }
.card-nav {
  display: none;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border: none;
  border-radius: 50%;
  font-family: var(--title-font);
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
}
/* JS toggles visibility to "inline-flex" (matching align/justify
   above) — the base rule stays display:none so most cards, whose
   creator has only one fish, show no arrows at all. */
.card-nav.shown { display: inline-flex; }
.card-nav:hover { transform: scale(1.08); }
.card h2 { font-family: var(--title-font); font-size: 1.7rem; margin-bottom: 4px; }
.card p  { opacity: 0.75; margin-bottom: 18px; }
/* The creator's optional bio / artist statement */
.card .bio {
  font-size: 0.98rem;
  line-height: 1.55;
  opacity: 0.85;
  margin: -6px 0 20px;
}
.card button {
  font: inherit;
  font-weight: 700;
  color: white;
  background: var(--card-text);
  border: none;
  border-radius: 999px;
  padding: 10px 28px;
  cursor: pointer;
}

/* All buttons match the SPA logo: same neon yellow, same glow.
   The color comes from --logo-glow, so changing that one token
   re-themes the logo AND every button together. */
.create-btn, .donate-btn, .sound-btn, .lang-btn, .info-btn, .search-btn, .menu-toggle-btn, .school-arrow, .card-nav, .card button {
  background: rgb(var(--logo-glow));
  color: #123a52;
  box-shadow:
    0 0 4px  rgba(var(--logo-glow), 0.9),
    0 0 14px rgba(var(--logo-glow), 0.55),
    0 0 32px rgba(var(--logo-glow), 0.28);
}

/* The "flight": when a fish is clicked, a copy of it swims out of
   the school toward the viewer — wiggling excitedly — and grows
   until it lands in place on the pop-up card. */
.flight {
  position: fixed;
  z-index: 950;                  /* above the overlay while flying */
  pointer-events: none;
  transition: left  0.55s cubic-bezier(0.3, 0.7, 0.2, 1),
              top   0.55s cubic-bezier(0.3, 0.7, 0.2, 1),
              width 0.55s cubic-bezier(0.3, 0.7, 0.2, 1),
              height 0.55s cubic-bezier(0.3, 0.7, 0.2, 1);
}
.flight-wiggle {
  width: 100%;
  height: 100%;
  /* the excited wiggle — faster than the hover swim */
  animation: excited 0.28s ease-in-out infinite alternate;
}
.flight img { width: 100%; height: 100%; object-fit: contain; }
@keyframes excited {
  from { transform: rotate(-6deg); }
  to   { transform: rotate(6deg); }
}

/* While the fish arrives, the card's text fades up underneath it */
.card.reveal h2, .card.reveal p, .card.reveal button {
  animation: fade-up 0.45s ease 0.32s both;
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* CALM MODE — after a few seconds without input, everything that
   isn't water or fish fades away and drifts slightly off toward
   its own edge of the screen. Two transition speeds: the fade-OUT
   is slow and gentle (the .calm rules), while the fade back IN is
   quick (the base rules), so the interface returns the instant
   the visitor moves. */
header, .logo, .create-btn, .donate-btn, .sound-btn, .lang-btn, .info-btn, .search-btn, .menu-toggle-btn {
  transition: opacity 0.25s ease, translate 0.25s ease, transform 0.2s ease;
}
body.calm header      { opacity: 0; translate: 0 -16px; pointer-events: none; }
body.calm .logo       { opacity: 0; translate: 0  16px; }
body.calm .create-btn { opacity: 0; translate: 0  16px; pointer-events: none; }
body.calm .donate-btn,
body.calm .sound-btn,
body.calm .lang-btn,
body.calm .info-btn,
body.calm .search-btn,
body.calm .menu-toggle-btn { opacity: 0; translate: 0 -16px; pointer-events: none; }
body.calm header, body.calm .logo, body.calm .create-btn,
body.calm .donate-btn, body.calm .sound-btn, body.calm .lang-btn, body.calm .info-btn, body.calm .search-btn, body.calm .menu-toggle-btn {
  transition: opacity 1.6s ease, translate 1.6s ease;
}

/* School arrows — swim to the previous / next school of fish */
.school-arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 600;
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  font-family: var(--title-font);
  font-size: 1.3rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.25s ease, translate 0.25s ease, transform 0.2s ease;
}
.school-arrow.prev { left: 18px; }
.school-arrow.next { right: 18px; }
.school-arrow:hover { transform: translateY(-50%) scale(1.1); }

/* One dot per school, bottom center — the lit dot is the current one */
.school-dots {
  position: fixed;
  bottom: 26px;
  left: 50%;
  translate: -50% 0;
  display: flex;
  gap: 10px;
  z-index: 600;
  transition: opacity 0.25s ease, translate 0.25s ease;
}
.school-dots button {
  width: 12px;
  height: 12px;
  padding: 0;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  background: rgba(255,255,255,0.45);
}
.school-dots button.active {
  background: rgb(var(--logo-glow));
  box-shadow: 0 0 8px rgba(var(--logo-glow), 0.8);
}

/* Calm mode: arrows slide toward their edges, dots sink */
body.calm .school-arrow.prev { opacity: 0; translate: -16px 0; pointer-events: none; }
body.calm .school-arrow.next { opacity: 0; translate: 16px 0; pointer-events: none; }
body.calm .school-dots { opacity: 0; translate: -50% 16px; pointer-events: none; }
body.calm .school-arrow, body.calm .school-dots {
  transition: opacity 1.6s ease, translate 1.6s ease;
}

/* Plain stand-in shown until your real image loads */
.placeholder {
  background: rgba(255,255,255,0.25);
  border: 2px dashed rgba(255,255,255,0.6);
  border-radius: 12px;
  aspect-ratio: 3 / 2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  text-align: center;
  padding: 6px;
}

/* ---------- MOBILE ----------
   Everything above is position:fixed with desktop offsets, which
   doesn't reflow the way normal content does — at phone widths the
   top-controls row (search/info/Feed the Fish/sound/lang) and the
   header title occupy nearly the same space and sit on top of each
   other. "Feed the Fish" is the worst offender: it's the only
   variable-width text pill in that row (its neighbors are all fixed
   44px circles), and in French ("Nourrir les poissons") it's long
   enough to wrap onto two lines, making the overlap worse. Below
   this width: drop the top-controls row below the header instead of
   beside it, and collapse "Feed the Fish" to match its icon-only
   neighbors so the row stays compact regardless of language. */
@media (max-width: 640px) {
  header { padding: 18px 20px; }
  /* Fully covered by the Info modal already — pure duplication that
     costs header height on a screen where vertical space is scarce. */
  header p { display: none; }

  /* Five permanently-visible buttons (search/info/feed/sound/lang)
     ate too much of the tank view on a phone. Collapse them behind
     one menu-toggle button; JS adds/removes .menu-open on click, tap
     elsewhere, or Escape. The toggle itself always stays visible —
     everything else in this row only shows up once opened. */
  .top-controls {
    top: 20px; right: 14px; gap: 10px;
    flex-direction: column; align-items: flex-end;
  }
  .menu-toggle-btn {
    display: flex; align-items: center; justify-content: center;
    order: -1;
    width: 44px; height: 44px;
    border: none; border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
  }
  .top-controls > *:not(.menu-toggle-btn) { display: none; }
  .top-controls.menu-open > *:not(.menu-toggle-btn) { display: flex; }

  /* Text stays in the DOM (so its accessible name/translations are
     untouched) but is visually replaced by an icon — font-size:0
     hides it from view without removing it from the accessibility
     tree, unlike display:none or visibility:hidden. */
  .donate-btn {
    order: 2;
    width: 44px; height: 44px;
    padding: 0;
    align-items: center; justify-content: center;
    font-size: 0;
  }
  .donate-btn::before {
    content: "🐟";
    font-size: 1.15rem;
  }

  /* Guards against the create-btn/logo colliding on the narrowest
     phones still in use (~320-360px) — the logo's 110px floor and
     create-btn's full-text width leave very little room between
     them at that size otherwise. */
  .create-btn { padding: 10px 16px; font-size: 0.9rem; }
  .logo { width: clamp(80px, 16vw, 190px); }
}

@media (prefers-reduced-motion: reduce) {
  .decoration.sways, .fish:hover .wiggle,
  .bubble, .ray,
  .flight-wiggle,
  body.feeding .fish .wiggle,
  .card.reveal h2, .card.reveal p, .card.reveal button { animation: none; }
  .bubble, .pellet { display: none; }
  .flight { transition: none; }
  .thought { transition: opacity 0.2s ease; transform: none; }
  .fish:hover .thought { transition-delay: 3s; }
}
</style>
</head>
<body>

<div id="tank"></div>

<header>
  <h1>Feeling Fishy</h1>
  <p id="tagline">Drag to spin the tank. Hover a fish to meet its creator.</p>
</header>

<!-- Info / Feed / Sound / Language buttons all live here so they lay
     out automatically as a row — no manual pixel math needed even
     though "Feed the Fish" changes width between languages. Visual
     order is controlled by the `order` CSS property on each button,
     not by the order they're added in JS. -->
<div class="top-controls" id="topControls"></div>

<div class="card-overlay" id="cardOverlay" role="dialog" aria-modal="true" aria-labelledby="cardName">
  <div class="card">
    <div id="cardArt"></div>
    <h2 id="cardName"></h2>
    <p id="cardCreator"></p>
    <p class="bio" id="cardBio"></p>
    <!-- The prev/next arrows are shown only when this fish's creator
         has more than one fish in the tank — paging straight through
         all of theirs without going back to search each time. Placed
         beside Back rather than over the artwork so they never cover
         the picture. -->
    <div class="card-footer-nav">
      <button class="card-nav prev" id="cardPrev" type="button"><span aria-hidden="true">‹</span></button>
      <button id="cardBack" onclick="closeCard()">Back to the tank</button>
      <button class="card-nav next" id="cardNext" type="button"><span aria-hidden="true">›</span></button>
    </div>
  </div>
</div>

<!-- The "Create your fish" pop-up: download the template, draw it
     right on the page, or submit a finished fish through the
     monday.com form -->
<div class="card-overlay" id="createOverlay">
  <div class="card">
    <h2 id="createTitle"></h2>
    <div class="option-row">
      <a class="option-btn" id="optDownload" role="button" tabindex="0"><span class="inlay" id="optDownloadLabel"></span></a>
      <a class="option-btn" id="optDraw" role="button" tabindex="0"><span class="inlay" id="optDrawLabel"></span></a>
      <a class="option-btn" id="optSubmit" role="button" tabindex="0"><span class="inlay" id="optSubmitLabel"></span></a>
    </div>
    <button id="createClose" onclick="closeCreate()">Close</button>
  </div>
</div>

<!-- Second level of the create menu: choose a template format -->
<div class="card-overlay" id="downloadOverlay">
  <div class="card">
    <h2 id="downloadTitle"></h2>
    <div class="option-row">
      <a class="option-btn" id="dlPng"><span class="inlay" id="dlPngLabel"></span></a>
      <a class="option-btn" id="dlPsd" target="_blank" rel="noopener"><span class="inlay" id="dlPsdLabel"></span></a>
      <a class="option-btn" id="dlKrita" target="_blank" rel="noopener"><span class="inlay" id="dlKritaLabel"></span></a>
    </div>
    <p class="download-note" id="downloadNote"></p>
    <button id="downloadBack">Back</button>
  </div>
</div>

<!-- "Draw it yourself" pop-up: the draw-in-browser tool mounts into
     #drawToolMount the first time this opens. Its CSS/JS/template
     images aren't requested until that happens (see the lazy-load
     wiring below), so nobody pays for this feature who never opens
     it. Sized wider than the other cards since it needs real
     workspace, not just a couple of buttons and a paragraph. -->
<div class="card-overlay" id="drawOverlay" role="dialog" aria-modal="true" aria-labelledby="drawTitle">
  <div class="card draw-card">
    <h2 id="drawTitle"></h2>
    <div id="drawToolMount"></div>
    <button id="drawBack">Back</button>
  </div>
</div>

<!-- "Submit your fish" pop-up: the monday.com form loads inline in
     an iframe here instead of leaving the site. The iframe's src is
     only set the first time this opens, so the form isn't fetched
     until someone actually asks for it. -->
<div class="card-overlay" id="submitOverlay" role="dialog" aria-modal="true" aria-labelledby="submitTitle">
  <div class="card submit-card">
    <h2 id="submitTitle"></h2>
    <div class="iframe-wrap">
      <iframe id="submitFrame"></iframe>
    </div>
    <button id="submitBack">Back</button>
  </div>
</div>

<!-- "About this project" info pop-up: a short project blurb plus a
     plain-language walkthrough of what everything on the page does. -->
<div class="card-overlay" id="infoOverlay" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
  <div class="card info-card">
    <h2 id="infoTitle"></h2>
    <p id="infoIntro"></p>
    <h3 id="howToTitle"></h3>
    <ol id="howToList"></ol>
    <button id="infoClose"></button>
  </div>
</div>

<!-- "Find a fish" search pop-up: a keyboard- and screen-reader-
     accessible way to jump straight to any fish's card by typing a
     creator's name, instead of hovering or clicking a moving target
     in the orbiting tank. Built as a combobox + listbox (see the
     ARIA roles below) so arrow keys and Enter work, and an empty
     query lists every fish — so this also works as a plain
     browsable list of everyone in the tank. -->
<div class="card-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
  <div class="card search-card">
    <h2 id="searchTitle"></h2>
    <input type="text" id="searchInput" class="search-input"
           role="combobox" aria-haspopup="listbox" aria-expanded="false"
           aria-autocomplete="list" aria-controls="searchResults"
           aria-labelledby="searchTitle" autocomplete="off">
    <p id="searchStatus" class="search-status" aria-live="polite"></p>
    <ul id="searchResults" class="search-results" role="listbox"></ul>
    <button id="searchClose"></button>
  </div>
</div>

<script>
/* ==============================================================
   THE AQUARIUM ENGINE — runs everything using your data above.
   ============================================================== */
const tank = document.getElementById("tank");
if (SETTINGS.background) tank.style.backgroundImage = `url(${SETTINGS.background})`;

// Looping video backdrop (e.g. rendered from your Unreal scene).
// muted + playsinline are required for browsers to autoplay it — and
// on iOS Safari specifically, setting the .muted/.playsInline JS
// properties alone isn't reliable for a <video> created dynamically
// like this; it wants the actual HTML attributes present too, plus
// an explicit .play() call rather than relying on the autoplay
// attribute by itself. Without this it silently just sits on the
// poster frame forever instead of looking broken.
if (SETTINGS.backgroundVideo) {
  const vid = document.createElement("video");
  vid.muted = true;
  vid.defaultMuted = true;
  vid.setAttribute("muted", "");
  vid.setAttribute("playsinline", "");
  vid.setAttribute("webkit-playsinline", "");
  vid.playsInline = true;
  vid.autoplay = true;
  vid.loop = true;
  if (SETTINGS.backgroundVideoPoster) vid.poster = SETTINGS.backgroundVideoPoster;
  vid.src = SETTINGS.backgroundVideo;
  vid.setAttribute("style",
    "position:absolute; inset:0; width:100%; height:100%; " +
    "object-fit:cover; z-index:0; pointer-events:none;");
  tank.prepend(vid);
  const tryPlay = () => vid.play().catch(() => {});
  tryPlay();
  // iOS sometimes ignores the first attempt if it happens before the
  // element is fully attached/laid out — retry once metadata is in.
  vid.addEventListener("loadedmetadata", tryPlay, { once: true });
  // Belt-and-suspenders for iOS: things like Low Power Mode can block
  // even a muted+playsinline autoplay, showing iOS's own "tap to
  // play" icon — which the visitor can't actually tap, since the
  // video is pointer-events:none so it doesn't steal taps meant for
  // dragging the tank. A genuine user gesture reliably overrides
  // that block, so retry on every tap anywhere until it actually
  // starts, then stop listening.
  window.addEventListener("pointerdown", tryPlay);
  vid.addEventListener("playing", () => {
    window.removeEventListener("pointerdown", tryPlay);
  }, { once: true });

  // Optional dark veil over the video so the fish stand out
  if (SETTINGS.videoDimmer > 0) {
    const veil = document.createElement("div");
    veil.setAttribute("style",
      "position:absolute; inset:0; background:black; z-index:1; " +
      "pointer-events:none; opacity:" + SETTINGS.videoDimmer + ";");
    tank.appendChild(veil);
  }
}

// Helper: re-map a number from one range to another.
function mapRange(value, inMin, inMax, outMin, outMax) {
  return outMin + (value - inMin) / (inMax - inMin) * (outMax - outMin);
}

// Plain placeholder for images that haven't been added yet
function placeholderFor(path) {
  const ph = document.createElement("div");
  ph.className = "placeholder";
  ph.textContent = path;
  return ph;
}

/* --- Water effects: bubbles, rays, ripple ----------------------
   The ripple works with an SVG "displacement map": an invisible
   layer of animated noise pushes every pixel of the tank around
   slightly, like light bending through moving water. ----------- */
const stillMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

if (WATER.bubbles > 0) {
  for (let i = 0; i < WATER.bubbles; i++) {
    const b = document.createElement("div");
    b.className = "bubble";
    const size = 5 + Math.random() * 16;              // 5–21 px wide
    b.style.width = b.style.height = size + "px";
    b.style.left = Math.random() * 100 + "%";
    b.style.setProperty("--sway", (4 + Math.random() * 14) + "px");
    b.style.animationDuration = (7 + Math.random() * 9) + "s";
    b.style.animationDelay = (Math.random() * -16) + "s"; // already mid-rise
    // Some bubbles drift behind the fish, some in front — adds depth
    b.style.zIndex = Math.random() < 0.6 ? 5 : 320;
    tank.appendChild(b);
  }
}

if (WATER.rays) {
  [{ left: "12%", delay: "0s" }, { left: "38%", delay: "2s" },
   { left: "67%", delay: "4s" }].forEach((r) => {
    const ray = document.createElement("div");
    ray.className = "ray";
    ray.style.left = r.left;
    ray.style.animationDelay = r.delay;
    tank.appendChild(ray);
  });
}

if (WATER.ripple && !stillMotion) {
  const svg = document.createElement("div");
  svg.innerHTML = `
    <svg width="0" height="0" style="position:absolute">
      <filter id="ripple" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.016"
                      numOctaves="1" seed="3" result="noise">
          <animate attributeName="baseFrequency" dur="16s"
                   values="0.008 0.016; 0.011 0.021; 0.008 0.016"
                   repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise"
                           scale="${WATER.rippleStrength}"/>
      </filter>
    </svg>`;
  document.body.appendChild(svg);
  // The distortion pushes pixels past the screen edge, so the tank
  // is stretched slightly beyond the viewport to hide the seams.
  tank.style.inset = "-16px";
  tank.style.filter = "url(#ripple)";
}

/* --- The chime engine (Web Audio) -------------------------------
   Every fish plays the SAME xylophone sample, but pitched to its
   own step of a major pentatonic scale — a scale where every note
   is consonant with every other. Hover several fish quickly and
   the overlapping notes stack into chords instead of clashing.

   The reverb is a convolver fed a generated "impulse response"
   (2.8 seconds of decaying noise = a big virtual room), and the
   reverb path runs through a lowpass filter first, which darkens
   the echoes — big, but deep underwater. ------------------------ */

// Two octaves of major pentatonic (in semitones above the sample)
const CHIME_SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];

let audioCtx = null, chimeBuffer = null, chimeLoading = false;
let chimeDry = null, chimeWetIn = null;

function initChimeEngine() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Dry path: the note, straight to the speakers
  chimeDry = audioCtx.createGain();
  chimeDry.gain.value = 0.7;
  chimeDry.connect(audioCtx.destination);

  // Wet path: lowpass (darkens it) -> reverb -> speakers
  const lowpass = audioCtx.createBiquadFilter();
  lowpass.type = "lowpass";
  lowpass.frequency.value = 1600;   // lower = murkier water

  const reverb = audioCtx.createConvolver();
  const rate = audioCtx.sampleRate;
  const seconds = 2.8;              // reverb tail length
  const impulse = audioCtx.createBuffer(2, rate * seconds, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = impulse.getChannelData(ch);
    for (let i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
    }
  }
  reverb.buffer = impulse;

  const wet = audioCtx.createGain();
  wet.gain.value = 0.55;            // how much reverb in the mix

  lowpass.connect(reverb);
  reverb.connect(wet);
  wet.connect(audioCtx.destination);
  chimeWetIn = lowpass;
}

async function loadChime(src) {
  if (chimeBuffer || chimeLoading) return;
  chimeLoading = true;
  try {
    const res = await fetch(src);
    chimeBuffer = await audioCtx.decodeAudioData(await res.arrayBuffer());
  } catch (e) { chimeLoading = false; }
}

function playChime(src, semitones) {
  if (!soundOn) return;
  initChimeEngine();
  if (audioCtx.state === "suspended") audioCtx.resume();
  if (!chimeBuffer) {
    // First hover: decode the sample, then ring the note
    loadChime(src).then(() => {
      if (chimeBuffer && soundOn) playChime(src, semitones);
    });
    return;
  }
  const note = audioCtx.createBufferSource();
  note.buffer = chimeBuffer;
  // Each semitone up multiplies the speed by 2^(1/12)
  note.playbackRate.value = Math.pow(2, semitones / 12);
  const g = audioCtx.createGain();
  g.gain.value = 0.25;
  note.connect(g);
  g.connect(chimeDry);     // direct sound
  g.connect(chimeWetIn);   // and into the underwater reverb
  note.start();
}

/* --- Build the fish ------------------------------------------- */
const swimmers = FISH.map((fish, i) => {
  const el = document.createElement("div");
  el.className = "fish";

  const img = document.createElement("img");
  img.src = fish.image;
  // Placeholder — corrected to the localized, name-aware version by
  // applyLanguage()'s loop below, which runs once right after this.
  img.alt = fish.creator;
  img.onerror = () => img.replaceWith(placeholderFor(fish.image));

  const wiggle = document.createElement("div");
  wiggle.className = "wiggle";
  wiggle.appendChild(img);

  // The flip wrapper mirrors only the artwork when the fish swims
  // the other way — the name tag and thought bubble stay readable
  const flip = document.createElement("div");
  flip.appendChild(wiggle);

  const tag = document.createElement("span");
  tag.className = "name-tag";
  tag.textContent = "by " + fish.creator;

  el.append(flip, tag);

  // Each fish gets one of three hover personalities at random
  el.classList.add("anim" + Math.floor(Math.random() * 3));

  // Thought bubble with the creator's bio, if they shared one
  if (fish.bio) {
    const thought = document.createElement("div");
    thought.className = "thought";
    thought.textContent = fish.bio;
    el.appendChild(thought);
  }

  el.addEventListener("click", () => { if (!wasDragged) openCard(i); });

  // Per-fish chime: same sample, but pitched to this fish's own
  // step of the pentatonic scale (see the chime engine above), so
  // sweeping across the school plays a melody, and overlaps chord.
  if (fish.sound) {
    const semitones = CHIME_SCALE[i % CHIME_SCALE.length];
    el.addEventListener("pointerenter", () => playChime(fish.sound, semitones));
  }

  // Hovered fish come forward: the orbit loop enlarges them and
  // lifts them above their neighbours (see the animate function)
  const state = {
    el,
    flipEl: flip,
    hovered: false,
    flipped: false,
    size: fish.size || 120,
    // Spread around the carousel WITHIN this fish's school
    angle: ((i % SCHOOL_SIZE) /
      Math.min(SCHOOL_SIZE, FISH.length - Math.floor(i / SCHOOL_SIZE) * SCHOOL_SIZE))
      * Math.PI * 2,
    active: true,
    // Each fish orbits at a slightly different distance (85%–115%
    // of the base radius) so a big school doesn't look like a ring
    radiusJitter: 0.85 + Math.random() * 0.3,
    height: fish.height ?? mapRange(i % 3, 0, 2, 25, 60),
    bobOffset: Math.random() * Math.PI * 2,
  };
  el.addEventListener("pointerenter", () => { state.hovered = true; });
  el.addEventListener("pointerleave", () => { state.hovered = false; });

  tank.appendChild(el);
  return state;
});

/* --- Schools ------------------------------------------------------
   The FISH list is split into schools of SCHOOL_SIZE. Only one
   school swims at a time; the arrows (or dots) change schools with
   a swim-through: the current school darts off in the direction of
   travel, and the next glides in from the other side. ------------- */
const schoolCount = Math.ceil(FISH.length / SCHOOL_SIZE);
let schoolIndex = 0;
let schoolOffset = 0;     // px added to every fish's x during transit
let schoolAnim = null;    // { phase: "out"|"in", dir, next, start }
let schoolDots = null;

function setSchoolVisibility() {
  swimmers.forEach((f, i) => {
    f.active = Math.floor(i / SCHOOL_SIZE) === schoolIndex;
    f.el.style.display = f.active ? "" : "none";
  });
}

function updateDots() {
  if (!schoolDots) return;
  [...schoolDots.children].forEach((dot, i) =>
    dot.classList.toggle("active", i === schoolIndex));
}

function changeSchool(dir) {
  if (schoolAnim || schoolCount < 2) return;
  const next = (schoolIndex + dir + schoolCount) % schoolCount;
  if (stillMotion) {              // reduced motion: instant swap
    schoolIndex = next;
    setSchoolVisibility();
    updateDots();
    return;
  }
  schoolAnim = { phase: "out", dir, next, start: performance.now() };
  // A little chime marks the change: a fifth up going forward,
  // back to the root coming back
  const withSound = FISH.find((f) => f.sound);
  if (withSound) playChime(withSound.sound, dir > 0 ? 7 : 0);
}

if (schoolCount > 1) {
  const prev = document.createElement("button");
  prev.className = "school-arrow prev";
  prev.textContent = "❮";
  prev.addEventListener("click", () => changeSchool(-1));
  const nextBtn = document.createElement("button");
  nextBtn.className = "school-arrow next";
  nextBtn.textContent = "❯";
  nextBtn.addEventListener("click", () => changeSchool(1));
  document.body.append(prev, nextBtn);

  schoolDots = document.createElement("div");
  schoolDots.className = "school-dots";
  for (let s = 0; s < schoolCount; s++) {
    const dot = document.createElement("button");
    dot.addEventListener("click", () => {
      if (s !== schoolIndex) changeSchool(s > schoolIndex ? 1 : -1);
    });
    schoolDots.appendChild(dot);
  }
  document.body.appendChild(schoolDots);
  updateDots();
}
setSchoolVisibility();

   so the tank starts silent and the first click/drag (or the
   speaker button) turns everything on. The same button mutes both
   the music bed and the per-fish hover sounds. ------------------ */
let audio = null;

  window.addEventListener("pointerdown", function firstTap() {

   A short project blurb plus a plain-language walkthrough of what

infoBtn.textContent = "i";

const infoOverlay = document.getElementById("infoOverlay");
let lastFocused = null; // remembers what to return focus to on close

// Moves focus into a dialog for keyboard/screen-reader users. Split
// out from openOverlay() so multi-step flows (Create → Download →
// back to Create, etc.) can move focus at every step without
// disturbing lastFocused, which should only change at the true
// entry/exit points of the whole flow.
function focusOverlayHeading(overlay) {
  const heading = overlay.querySelector("h2");
  if (heading) { heading.setAttribute("tabindex", "-1"); heading.focus(); }
}
function openOverlay(overlay, trigger) {
  lastFocused = trigger || document.activeElement;
  overlay.classList.add("open");
  focusOverlayHeading(overlay);
}
function closeOverlay(overlay) {
  overlay.classList.remove("open");
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}

// Every element a dialog's Tab trap can land on: standard focusable
// tags, plus <iframe> for the monday.com submission form, minus
// anything hidden (offsetParent is null for display:none — covers
// the format buttons and creator-paging arrows that only sometimes
// show) or explicitly taken out of the tab order (tabindex="-1", the
// convention used for each dialog's own heading).
function getFocusableIn(container) {
  const selector = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), iframe, [tabindex]:not([tabindex="-1"])';
  return [...container.querySelectorAll(selector)].filter((el) => el.offsetParent !== null);
}

// Keeps Tab/Shift+Tab cycling within whichever dialog is currently
// open, instead of escaping into the tank/header/buttons behind it.
window.addEventListener("keydown", (e) => {
  if (e.key !== "Tab") return;
  const openOverlayEl = document.querySelector(".card-overlay.open");
  if (!openOverlayEl) return;
  const focusables = getFocusableIn(openOverlayEl);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
});

// Safety net for the common trap's blind spot: the submission form
// is a third-party (monday.com) iframe, so the parent page can't see
// Tab presses made once focus is inside it — tabbing backward out of
// it would otherwise land wherever the browser's native tab order
// puts it, which could be the tank behind the dialog. Whenever focus
// lands outside the open dialog for any reason, pull it back in.
document.addEventListener("focusin", (e) => {
  const openOverlayEl = document.querySelector(".card-overlay.open");
  if (!openOverlayEl || openOverlayEl.contains(e.target)) return;
  const focusables = getFocusableIn(openOverlayEl);
  if (focusables.length) focusables[0].focus();
});

infoBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  openOverlay(infoOverlay, infoBtn);
});
document.getElementById("infoClose").addEventListener("click", () => closeOverlay(infoOverlay));
infoOverlay.addEventListener("click", (e) => { if (e.target === infoOverlay) closeOverlay(infoOverlay); });

/* --- "Find a fish" search ----------------------------------------
   A keyboard- and screen-reader-accessible way to reach any fish's
   card directly, instead of hovering or clicking a moving target in
   the orbiting tank — which pointer-only interaction can't reach at
   all. Built as a combobox + listbox (WAI-ARIA pattern): arrow keys
   move through matches, Enter opens the highlighted one, and an
   empty query lists every fish — so this doubles as a plain
   browsable list of everyone in the tank, not just a name lookup. */
const searchBtn = document.createElement("button");
searchBtn.className = "search-btn";
searchBtn.textContent = "🔍";
document.getElementById("topControls").appendChild(searchBtn);

const searchOverlay = document.getElementById("searchOverlay");
const searchInput = document.getElementById("searchInput");
const searchResultsEl = document.getElementById("searchResults");
const searchStatusEl = document.getElementById("searchStatus");
let searchMatches = [];   // FISH indexes currently listed, in display order
let searchActive = -1;    // index into searchMatches; -1 = none highlighted

// Accent-insensitive, so typing "elie" still finds "Élie"
function normalizeForSearch(str) {
  return (str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function renderSearchResults(query) {
  const q = normalizeForSearch(query.trim());
  searchMatches = FISH.map((_, i) => i)
    .filter((i) => !q ||
      normalizeForSearch(FISH[i].creator).includes(q) ||
      normalizeForSearch(FISH[i].name).includes(q))
    .sort((a, b) => FISH[a].creator.localeCompare(FISH[b].creator));

  searchActive = -1;
  searchInput.removeAttribute("aria-activedescendant");
  searchResultsEl.innerHTML = "";
  searchMatches.forEach((fishIndex, row) => {
    const f = FISH[fishIndex];
    const li = document.createElement("li");
    li.id = "searchOption-" + row;
    li.className = "search-result";
    li.setAttribute("role", "option");
    li.textContent = f.name ? `${f.name} — ${TEXT[lang].by} ${f.creator}` : f.creator;
    li.addEventListener("click", () => selectSearchResult(row));
    // Mouse hover and keyboard arrows share the same "active" state
    li.addEventListener("pointerenter", () => setSearchActive(row));
    searchResultsEl.appendChild(li);
  });

  const t = TEXT[lang];
  if (!q) searchStatusEl.textContent = t.searchBrowseAll;
  else searchStatusEl.textContent = searchMatches.length ? t.searchCount : t.searchNone;

  searchInput.setAttribute("aria-expanded", searchMatches.length ? "true" : "false");
}

function setSearchActive(row) {
  searchActive = row;
  [...searchResultsEl.children].forEach((li, i) => li.classList.toggle("active", i === row));
  if (row >= 0) {
    searchInput.setAttribute("aria-activedescendant", "searchOption-" + row);
    searchResultsEl.children[row].scrollIntoView({ block: "nearest" });
  } else {
    searchInput.removeAttribute("aria-activedescendant");
  }
}

function selectSearchResult(row) {
  const fishIndex = searchMatches[row];
  if (fishIndex === undefined) return;
  searchOverlay.classList.remove("open");
  locateFish(fishIndex, searchBtn);
}

// Jumps to a fish's card even when it's in a school that isn't
// currently on screen — switches schools first. No animated
// swim-through for this jump; the card covers the tank a moment
// later anyway, so the cut isn't visible the way it would be for
// the prev/next arrows.
function locateFish(index, trigger) {
  const targetSchool = Math.floor(index / SCHOOL_SIZE);
  const needsSchoolSwitch = targetSchool !== schoolIndex;
  if (needsSchoolSwitch) {
    schoolIndex = targetSchool;
    setSchoolVisibility();
    updateDots();
  }
  openCard(index, trigger, { skipFlight: needsSchoolSwitch });
}

searchBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  // Focus goes straight into the input (not the heading, unlike
  // openOverlay's default) so someone can start typing right away.
  lastFocused = searchBtn;
  searchOverlay.classList.add("open");
  searchInput.value = "";
  renderSearchResults("");
  searchInput.focus();
});
document.getElementById("searchClose").addEventListener("click", () => closeOverlay(searchOverlay));
searchOverlay.addEventListener("click", (e) => { if (e.target === searchOverlay) closeOverlay(searchOverlay); });

searchInput.addEventListener("input", () => renderSearchResults(searchInput.value));
searchInput.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") {
    if (!searchMatches.length) return;
    e.preventDefault();
    setSearchActive(Math.min(searchActive + 1, searchMatches.length - 1));
  } else if (e.key === "ArrowUp") {
    if (!searchMatches.length) return;
    e.preventDefault();
    setSearchActive(Math.max(searchActive - 1, 0));
  } else if (e.key === "Enter") {
    if (!searchMatches.length) return;
    e.preventDefault();
    selectSearchResult(searchActive >= 0 ? searchActive : 0);
  }
  // Escape is left to the page-wide handler below, same as every
  // other pop-up.
});

// Escape closes whichever pop-up is currently open, from anywhere.
// The fish detail card needs its own cleanup (restoring the fish's
// spot in the tank, removing the flight clone) so it can't just
// reuse closeOverlay like the others.
window.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const open = document.querySelector(".card-overlay.open");
  if (!open) return;
  if (open.id === "cardOverlay") closeCard();
  else closeOverlay(open);
});

/* --- Language system --------------------------------------------
   All wording lives in the TEXT table at the top of the file.
   applyLanguage() rewrites every phrase on screen at once. ------- */
let lang = SETTINGS.language || "en";
const langBtn = document.createElement("button");
langBtn.className = "lang-btn";
document.getElementById("topControls").appendChild(langBtn);

function applyLanguage() {
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  document.getElementById("tagline").textContent = t.tagline;
  document.getElementById("cardBack").textContent = t.back;
  document.getElementById("createTitle").textContent = t.createTitle;
  document.getElementById("optDownloadLabel").textContent = t.download;
  document.getElementById("optDrawLabel").textContent = t.draw;
  document.getElementById("optSubmitLabel").textContent = t.submit;
  document.getElementById("downloadTitle").textContent = t.downloadTitle;
  document.getElementById("dlPngLabel").textContent = t.asIs;
  document.getElementById("dlPsdLabel").textContent = t.psd;
  document.getElementById("dlKritaLabel").textContent = t.krita;
  document.getElementById("downloadNote").textContent = t.downloadNote;
  document.getElementById("downloadBack").textContent = t.goBack;
  document.getElementById("createClose").textContent = t.close;
  document.getElementById("drawTitle").textContent = t.drawTitle;
  document.getElementById("drawBack").textContent = t.goBack;
  document.getElementById("submitTitle").textContent = t.submitTitle;
  document.getElementById("submitFrame").title = t.submitFrameTitle;
  document.getElementById("submitBack").textContent = t.goBack;
  // The draw tool loads its own strings lazily, only once someone has
  // actually opened it — nothing to update if it isn't loaded yet.
  if (window.FishDrawTool) window.FishDrawTool.setLanguage(lang);
  if (createBtn) createBtn.textContent = t.create;
  if (donateBtn) donateBtn.textContent = t.donate;
  // Info button + "About this project" pop-up
  infoBtn.title = t.info;
  infoBtn.setAttribute("aria-label", t.info);
  document.getElementById("infoTitle").textContent = t.infoTitle;
  document.getElementById("infoIntro").textContent = t.infoIntro;
  document.getElementById("howToTitle").textContent = t.howToTitle;
  document.getElementById("infoClose").textContent = t.close;
  const howToList = document.getElementById("howToList");
  howToList.innerHTML = "";
  t.howTo.forEach((step) => {
    const li = document.createElement("li");
    li.textContent = step;
    howToList.appendChild(li);
  });
  document.querySelectorAll(".school-arrow.prev").forEach((b) => {
    b.title = t.prevSchool; b.setAttribute("aria-label", t.prevSchool);
  });
  document.querySelectorAll(".school-arrow.next").forEach((b) => {
    b.title = t.nextSchool; b.setAttribute("aria-label", t.nextSchool);
  });
  // Update every fish's name tag ("by" / "par") and image alt text
  document.querySelectorAll(".fish .name-tag").forEach((tag, i) => {
    tag.textContent = t.by + " " + FISH[i].creator;
  });
  document.querySelectorAll(".fish img").forEach((img, i) => {
    const f = FISH[i];
    img.alt = f.name ? `${f.name} ${t.by} ${f.creator}` : `${t.fishAlt} ${t.by} ${f.creator}`;
  });
  // Mobile menu toggle
  menuToggleBtn.title = t.menuLabel;
  menuToggleBtn.setAttribute("aria-label", t.menuLabel);

  // "Find a fish" search
  searchBtn.title = t.searchTitle;
  searchBtn.setAttribute("aria-label", t.searchTitle);
  document.getElementById("searchTitle").textContent = t.searchTitle;
  searchInput.placeholder = t.searchPlaceholder;
  document.getElementById("searchClose").textContent = t.close;
  searchResultsEl.setAttribute("aria-label", t.searchResultsLabel);
  // Re-render so match text, "by"/"par", and the status count switch
  // language immediately even while the search pop-up is open
  renderSearchResults(searchInput.value);
  // Creator-fish paging arrows on the detail card
  document.getElementById("cardPrev").title = t.prevCreatorFish;
  document.getElementById("cardPrev").setAttribute("aria-label", t.prevCreatorFish);
  document.getElementById("cardNext").title = t.nextCreatorFish;
  document.getElementById("cardNext").setAttribute("aria-label", t.nextCreatorFish);
  // The button shows the language you'd switch TO
  langBtn.textContent = lang === "en" ? "FR" : "EN";
}

langBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  lang = lang === "en" ? "fr" : "en";
  applyLanguage();
});
applyLanguage();

/* --- Drag to rotate -------------------------------------------- */
let rotation = 0;
let dragVelocity = 0;
let isDragging = false;
let wasDragged = false;
let lastPointerX = 0;

/* Drag sound: the water "grabs" while you hold, and lets go when
   you do. preservesPitch is turned off so changing playbackRate
   bends the pitch — dragging fast scrubs the sound higher, like a
   record scratch, but underwater. Quick fades avoid pops. */
let dragAudio = null;
let dragFade = null;

function startDragSound() {
  if (!SETTINGS.dragSound || !soundOn) return;
  if (!dragAudio) {
    dragAudio = new Audio(SETTINGS.dragSound);
    dragAudio.loop = true;
    dragAudio.preservesPitch = false;
    dragAudio.webkitPreservesPitch = false;
  }
  clearInterval(dragFade);
  dragAudio.volume = 0;
  dragAudio.playbackRate = 1;
  dragAudio.currentTime = 0;
  dragAudio.play().catch(() => {});
  dragFade = setInterval(() => {          // fade in (~100ms)
    dragAudio.volume = Math.min(0.25, dragAudio.volume + 0.05);
    if (dragAudio.volume >= 0.25) clearInterval(dragFade);
  }, 20);
}

function stopDragSound() {
  if (!dragAudio) return;
  clearInterval(dragFade);
  dragFade = setInterval(() => {          // fade out (~150ms)
    dragAudio.volume = Math.max(0, dragAudio.volume - 0.04);
    if (dragAudio.volume <= 0) { dragAudio.pause(); clearInterval(dragFade); }
  }, 20);
}

window.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".create-btn, .donate-btn, .sound-btn, .lang-btn, .info-btn, .search-btn, .menu-toggle-btn, .school-arrow, .school-dots, .card")) return;
  isDragging = true;
  wasDragged = false;
  lastPointerX = e.clientX;
  document.body.classList.add("dragging");
  startDragSound();
});
window.addEventListener("pointermove", (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastPointerX;
  lastPointerX = e.clientX;
  if (Math.abs(dx) > 2) wasDragged = true;
  rotation += dx * 0.004;
  dragVelocity = dx * 0.004;

  // The scratch: drag speed bends the sound's pitch (0.8x–1.6x).
  // Delete these three lines for a steady, un-bent drag sound.
  if (dragAudio && !dragAudio.paused) {
    dragAudio.playbackRate = 0.8 + Math.min(Math.abs(dx) / 12, 1) * 0.8;
  }
});
window.addEventListener("pointerup", () => {
  if (isDragging) stopDragSound();
  isDragging = false;
  document.body.classList.remove("dragging");
});

/* --- Calm mode ---------------------------------------------------
   After 3 seconds without any input, the interface fades away and
   the visitor is left with just the fish and the water. The first
   twitch of the mouse (or any key/touch) brings everything back.
   The UI never hides mid-drag or while a pop-up is open. --------- */
let calmTimer = null;

function scheduleCalm() {
  clearTimeout(calmTimer);
  calmTimer = setTimeout(() => {
    if (isDragging || document.querySelector(".card-overlay.open")) {
      scheduleCalm();          // busy — check again in a few seconds
      return;
    }
    document.body.classList.add("calm");
  }, 3000);
}

function wakeUI() {
  document.body.classList.remove("calm");
  scheduleCalm();
}

["pointermove", "pointerdown", "keydown", "wheel", "touchstart"]
  .forEach((ev) => window.addEventListener(ev, wakeUI, { passive: true }));
scheduleCalm();

/* --- The orbit engine: runs ~60 frames per second --------------
   Each fish sits at an angle on an invisible carousel:
     x = cos(angle) → left/right position
     z = sin(angle) → depth: -1 back … +1 front
   Depth drives scale, opacity, blur, and stacking order — that's
   what creates the 3D feeling on a flat screen. ----------------- */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastTime = performance.now();

function animate(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  // Feeding time? The carousel whips into a feeding frenzy: the
  // spin eases up to 20x speed and back down when the food is gone
  const feeding = now < feedUntil;
  if (feeding !== feedingState) {
    feedingState = feeding;
    document.body.classList.toggle("feeding", feeding);
  }
  feedLift += ((feeding ? 45 : 0) - feedLift) * Math.min(1, dt * 2.5);
  feedSpin += ((feeding ? 20 : 1) - feedSpin) * Math.min(1, dt * 2);

  // School transition: ease the leaving school off one side, then
  // ease the arriving school in from the other (500ms each phase)
  if (schoolAnim) {
    const p = Math.min(1, (now - schoolAnim.start) / 500);
    if (schoolAnim.phase === "out") {
      schoolOffset = -schoolAnim.dir * window.innerWidth * 1.2 * (p * p);
      if (p >= 1) {
        schoolIndex = schoolAnim.next;
        setSchoolVisibility();
        updateDots();
        schoolAnim.phase = "in";
        schoolAnim.start = now;
      }
    } else {
      const q = 1 - Math.pow(1 - p, 3);   // decelerate into place
      schoolOffset = schoolAnim.dir * window.innerWidth * 1.2 * (1 - q);
      if (p >= 1) { schoolAnim = null; schoolOffset = 0; }
    }
  }

  if (!isDragging && !reduceMotion) {
    rotation += ORBIT.speed * dt * feedSpin;
  }
  if (!isDragging) {
    rotation += dragVelocity;
    dragVelocity *= 0.95;   // drag momentum fades out
  }

  const cx = window.innerWidth / 2;
  const orbitRadius = window.innerWidth * ORBIT.radiusX;

  // Fish sizes in the FISH array are tuned for a desktop-width tank.
  // The orbit radius above already shrinks proportionally on narrow
  // screens (it's a fraction of innerWidth), but fish themselves were
  // still a fixed pixel width regardless of viewport — on a phone
  // that meant a ~150px fish taking up a third of the screen, and a
  // packed-looking school as a result. Scaling it down here (read
  // fresh every frame, so rotating the phone adjusts it immediately)
  // keeps the fish proportioned to the orbit the same way at every
  // screen size. 900px is roughly where the tank stops feeling
  // crowded at full size; below that, fish shrink down to a 55% floor
  // so they don't get too small to read the artwork on tiny phones.
  const fishSizeScale = Math.max(0.55, Math.min(1, window.innerWidth / 900));

  for (const fish of swimmers) {
    if (!fish.active) continue;   // fish in other schools sit this out

    const a = fish.angle + rotation;
    const x = Math.cos(a);
    const z = Math.sin(a);

    const scale   = mapRange(z, -1, 1, ORBIT.farScale, ORBIT.nearScale);
    const opacity = mapRange(z, -1, 1, ORBIT.farOpacity, 1);
    const blur    = mapRange(z, -1, 1, ORBIT.farBlur, 0);
    const bob = reduceMotion ? 0
      : Math.sin(now / 1000 + fish.bobOffset)
        * ORBIT.bobAmount * (feeding ? 2 : 1);

    // Motion blur: a fish's sideways speed on the carousel is
    // highest at the sides (|z| near 1) and zero at front/back
    // dead-center. Blur scales with spin speed × that velocity.
    const motionBlur = reduceMotion ? 0
      : (feedSpin - 1) * Math.abs(z) * 0.45;

    const screenX = cx + x * orbitRadius * fish.radiusJitter + schoolOffset;
    const screenY = window.innerHeight * (fish.height / 100) + bob - feedLift;

    // Fish face where they're going; art is drawn facing left, so
    // the flip wrapper mirrors it on the back half of the carousel
    // (only the artwork — tags and thought bubbles stay readable).
    const facing = z < 0 ? -1 : 1;
    if ((facing < 0) !== fish.flipped) {
      fish.flipped = facing < 0;
      fish.flipEl.style.transform = `scaleX(${facing})`;
      fish.el.classList.toggle("flipped", fish.flipped);
    }

    const renderedSize = fish.size * fishSizeScale;
    fish.el.style.width = renderedSize + "px";
    fish.el.style.transform =
      `translate(${screenX - renderedSize / 2}px, ${screenY}px) scale(${scale})`;
    fish.el.style.opacity = fish.hovered ? 1 : opacity;
    // Hovered fish un-blur so the name tag and bubble stay crisp
    const totalBlur = (fish.hovered ? 0 : blur) + motionBlur;
    fish.el.style.filter =
      totalBlur > 0.15 ? `blur(${totalBlur}px)` : "none";
    fish.el.style.zIndex = fish.hovered
      ? 500
      : Math.round(mapRange(z, -1, 1, 10, 300));
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* --- Detail card + the flight transition ------------------------
   Clicking a fish doesn't just open the card — the fish visibly
   leaves the school and swims up to it:
   1. Measure where the fish is on screen right now
   2. Open the card with its image slot invisible, measure where
      the image WILL be
   3. Hide the real fish, place a flying copy at position 1, and
      let CSS transition it to position 2 (wiggling all the way)
   4. When it lands: show the card image, remove the flying copy
   The card's text fades up underneath meanwhile (.reveal class). */
const overlay = document.getElementById("cardOverlay");
const cardEl = overlay.querySelector(".card");
let openFishIndex = null;    // which fish the flight animation hid, if any
let currentCardIndex = null; // whichever fish the card is showing right now

// Every fish index sharing this creator, in FISH order — used for the
// paging arrows so someone can browse straight through one creator's
// fish without returning to search each time.
function creatorFishIndexes(creator) {
  return FISH.map((_, i) => i).filter((i) => FISH[i].creator === creator);
}

const cardPrevBtn = document.getElementById("cardPrev");
const cardNextBtn = document.getElementById("cardNext");

function stepCreatorFish(dir) {
  if (currentCardIndex === null) return;
  const siblings = creatorFishIndexes(FISH[currentCardIndex].creator);
  const pos = siblings.indexOf(currentCardIndex);
  if (pos === -1 || siblings.length < 2) return;
  const nextIndex = siblings[(pos + dir + siblings.length) % siblings.length];
  // Same trigger as before (don't overwrite where focus should return
  // to on close), no flight animation, and keep focus on this arrow
  // so repeated clicks/Enter presses page straight through.
  openCard(nextIndex, lastFocused, { skipFlight: true, keepFocus: true });
}
cardPrevBtn.addEventListener("click", (e) => { e.stopPropagation(); stepCreatorFish(-1); });
cardNextBtn.addEventListener("click", (e) => { e.stopPropagation(); stepCreatorFish(1); });

// trigger: the element focus should return to when the card closes
// (defaults to whatever was focused, same convention as openOverlay).
// opts.skipFlight: skip the fish-flies-to-the-card animation — used
// by locateFish() when it had to switch schools first, and by the
// paging arrows, since in both cases the fish's old on-screen
// position isn't meaningful.
// opts.keepFocus: don't move focus to the heading — used by the
// paging arrows so focus stays put and repeated presses keep working.
function openCard(index, trigger, opts = {}) {
  const fish = FISH[index];
  lastFocused = trigger || document.activeElement;
  currentCardIndex = index;

  // Fill in the card's content
  const cardArt = document.getElementById("cardArt");
  cardArt.innerHTML = "";
  const cardImg = document.createElement("img");
  cardImg.src = fish.image;
  cardImg.alt = fish.name || (TEXT[lang].fishAlt + " " + TEXT[lang].by + " " + fish.creator);
  cardImg.onerror = () => { cardImg.style.display = "none"; };
  cardArt.appendChild(cardImg);
  document.getElementById("cardName").textContent = fish.name;
  document.getElementById("cardCreator").textContent =
    TEXT[lang].designedBy + " " + fish.creator;
  const bioEl = document.getElementById("cardBio");
  bioEl.textContent = fish.bio || "";
  bioEl.style.display = fish.bio ? "block" : "none";

  // Paging arrows only show up when this creator has more than one
  // fish in the tank — most creators have exactly one, so most cards
  // show no arrows at all.
  const hasSiblings = creatorFishIndexes(fish.creator).length > 1;
  cardPrevBtn.classList.toggle("shown", hasSiblings);
  cardNextBtn.classList.toggle("shown", hasSiblings);

  // Moves focus into the dialog for keyboard/screen-reader users —
  // needed no matter which branch below runs, unless this is an
  // in-place page to a sibling fish (opts.keepFocus).
  function focusCard() {
    if (opts.keepFocus) return;
    const heading = document.getElementById("cardName");
    heading.setAttribute("tabindex", "-1");
    heading.focus();
  }

  // Reduced motion, a missing image, or a fish located from a school
  // that wasn't on screen: open the card plainly, no flight animation
  if (stillMotion || opts.skipFlight || !fish.image) {
    overlay.classList.add("open");
    focusCard();
    return;
  }

  // 1. Where is the fish right now?
  const sourceEl = swimmers[index].el;
  const start = sourceEl.getBoundingClientRect();

  // 2. Open the card, but keep its image invisible for now
  cardImg.style.opacity = "0";
  cardEl.classList.add("reveal");
  overlay.classList.add("open");
  focusCard();

  requestAnimationFrame(() => {
    const target = cardImg.getBoundingClientRect();

    // 3. The flying copy, starting exactly where the fish was
    const clone = document.createElement("div");
    clone.className = "flight";
    clone.style.left = start.left + "px";
    clone.style.top = start.top + "px";
    clone.style.width = start.width + "px";
    clone.style.height = start.height + "px";
    clone.innerHTML =
      `<div class="flight-wiggle"><img src="${fish.image}" alt=""></div>`;
    document.body.appendChild(clone);

    sourceEl.style.visibility = "hidden";   // its spot in the school empties
    openFishIndex = index;

    // Next frame, give it its destination — CSS animates the trip
    requestAnimationFrame(() => {
      clone.style.left = target.left + "px";
      clone.style.top = target.top + "px";
      clone.style.width = target.width + "px";
      clone.style.height = target.height + "px";
    });

    // 4. Touchdown: swap the flying copy for the card's own image
    const land = () => {
      cardImg.style.opacity = "";
      clone.remove();
    };
    clone.addEventListener("transitionend", land, { once: true });
    setTimeout(land, 700);   // safety net if transitionend never fires
  });
}

function closeCard() {
  overlay.classList.remove("open");
  cardEl.classList.remove("reveal");
  // The fish rejoins the school
  if (openFishIndex !== null) {
    swimmers[openFishIndex].el.style.visibility = "";
    openFishIndex = null;
  }
  currentCardIndex = null;
  document.querySelectorAll(".flight").forEach((f) => f.remove());
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeCard(); });
</script>
