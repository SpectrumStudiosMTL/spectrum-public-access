  else dlPsd.style.display = "none";
  if (SETTINGS.templateKrita) dlKrita.href = SETTINGS.templateKrita;
  else dlKrita.style.display = "none";

  // Back returns to the create/download sub-menu, not the top level
  document.getElementById("downloadBack").addEventListener("click", () => {
    downloadOverlay.classList.remove("open");
    resetOptionCarousel(createChooseOverlay);
    createChooseOverlay.classList.add("open");
    focusOverlayHeading(createChooseOverlay);
  });
  // Clicking the dark backdrop closes the submenu
  downloadOverlay.addEventListener("click", (e) => {
    if (e.target !== downloadOverlay) return;
    downloadOverlay.classList.remove("open");
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  });

  // "Create a fish" sub-menu's own Back returns to the top level
  document.getElementById("createChooseBack").addEventListener("click", () => {
    createChooseOverlay.classList.remove("open");
    resetOptionCarousel(createOverlay);
    createOverlay.classList.add("open");
    focusOverlayHeading(createOverlay);
  });
  createChooseOverlay.addEventListener("click", (e) => {
    if (e.target !== createChooseOverlay) return;
    createChooseOverlay.classList.remove("open");
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  });

  // Walkthrough's own Back returns to the top level
  document.getElementById("howItWorksBack").addEventListener("click", () => {
    howItWorksOverlay.classList.remove("open");
    createOverlay.classList.add("open");
    focusOverlayHeading(createOverlay);
  });
  howItWorksOverlay.addEventListener("click", (e) => {
    if (e.target !== howItWorksOverlay) return;
    howItWorksOverlay.classList.remove("open");
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  });

  // Your inlay artwork: an <img> placed above the text label
  // inside each button's window (real alt text, not a CSS
  // background — keeps this accessible to screen readers).
  const inlayTargets = {
    create: "optCreate", draw: "optDraw", download: "optDownload", submit: "optSubmit",
    png: "dlPng", psd: "dlPsd", krita: "dlKrita",
  };
  for (const [key, id] of Object.entries(inlayTargets)) {
    const src = (SETTINGS.buttonInlays || {})[key];
    if (!src) continue;
    const inlay = document.querySelector("#" + id + " .inlay");
    const img = document.createElement("img");
    img.src = src;
    img.alt = "";                 // decorative; the text label beside it already says it
    inlay.prepend(img);
  }

  // Every button in the menus plays the same click sound
  [optCreate, optDownload, optDraw, optSubmit, dlPng, dlPsd, dlKrita,
   document.getElementById("createClose"),
   document.getElementById("createChooseBack"),
   document.getElementById("howItWorksBack"),
   document.getElementById("walkthroughPrev"),
   document.getElementById("walkthroughNext"),
   document.getElementById("templateHowItWorksBack"),
   document.getElementById("templateWalkthroughPrev"),
   document.getElementById("templateWalkthroughNext"),
   document.getElementById("downloadBack"),
   document.getElementById("drawBack"),
   document.getElementById("submitBack"),
   document.getElementById("directSubmitSend"),
   document.getElementById("directSubmitBack"),
   document.getElementById("directSubmitDone")]
    .forEach((btn) => btn.addEventListener("click", playPluck));

  // Mobile only: page through an option-row one button at a time
  // with prev/next arrows and dots, instead of stacking all three —
  // frees up the room to scale the visible button up much bigger
  // (see the CSS). Desktop keeps the plain row untouched.
  if (window.innerWidth < 640) {
    function buildOptionCarousel(overlay) {
      const row = overlay.querySelector(".option-row");
      // Buttons for a URL SETTINGS never configured were already set
      // to display:none above — those aren't real pages to swipe to.
      const items = [...row.children].filter((el) => el.style.display !== "none");
      if (items.length <= 1) return; // nothing to page through

      const wrap = document.createElement("div");
      wrap.className = "option-carousel";
      row.parentNode.insertBefore(wrap, row);

      const prevBtn = document.createElement("button");
      prevBtn.type = "button";
      prevBtn.className = "card-nav option-nav-prev shown";
      prevBtn.innerHTML = '<span aria-hidden="true">‹</span>';
      const nextBtn = document.createElement("button");
      nextBtn.type = "button";
      nextBtn.className = "card-nav option-nav-next shown";
      nextBtn.innerHTML = '<span aria-hidden="true">›</span>';
      wrap.append(prevBtn, row, nextBtn);

      const dots = document.createElement("div");
      dots.className = "option-dots";
      items.forEach((_, i) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.addEventListener("click", () => show(i));
        dots.appendChild(dot);
      });
      wrap.after(dots);

      let index = 0;
      function show(i) {
        index = (i + items.length) % items.length;
        items.forEach((el, j) => el.classList.toggle("carousel-hidden", j !== index));
        [...dots.children].forEach((d, j) => d.classList.toggle("active", j === index));
        // Shrink an over-long label to fit one line rather than let it
        // wrap — see the .inlay-text nowrap comment in the CSS for why
        // this can happen even for labels that fit fine with the
        // intended font. Re-measured on every show() (not just once)
        // since resetOptionCarousel() can reuse a button whose label
        // text changes with the language toggle.
        const label = items[index].querySelector(".inlay-text");
        if (label) {
          label.style.fontSize = "";
          const available = label.clientWidth;
          const natural = label.scrollWidth;
          if (natural > available && available > 0) {
            const currentPx = parseFloat(getComputedStyle(label).fontSize);
            label.style.fontSize = (currentPx * available / natural) + "px";
          }
        }
      }
      prevBtn.addEventListener("click", () => { playPluck(); show(index - 1); });
      nextBtn.addEventListener("click", () => { playPluck(); show(index + 1); });
      show(0);

      // Exposed on the row itself (rather than a module-level map
      // keyed by overlay) so resetOptionCarousel() can reach it from
      // outside this closure without either carousel needing a name.
      row.showCarouselOption = show;
    }
    buildOptionCarousel(createOverlay);
    buildOptionCarousel(createChooseOverlay);
    buildOptionCarousel(downloadOverlay);
  }
}

/* --- Info button + "About this project" pop-up -----------------
   A short project blurb plus a plain-language walkthrough of what
   every button on the page does. Always shown — this isn't tied to
   any optional URL setting the way Create is. -------------------- */
const infoBtn = document.createElement("button");
infoBtn.className = "info-btn";
infoBtn.textContent = "i";
document.getElementById("topControls").appendChild(infoBtn);

const infoOverlay = document.getElementById("infoOverlay");
let lastFocused = null; // remembers what to return focus to on close

// Moves focus into a dialog for keyboard/screen-reader users. Split
// out from openOverlay() so multi-step flows (Create → Download →
// back to Create, etc.) can move focus at every step without
// disturbing lastFocused, which should only change at the true
// entry/exit points of the whole flow.
function focusOverlayHeading(overlay) {
  const heading = overlay.querySelector("h2");
  if (heading) { heading.setAttribute("tabindex", "-1"); heading.focus(); }
}
function openOverlay(overlay, trigger) {
  lastFocused = trigger || document.activeElement;
  overlay.classList.add("open");
  focusOverlayHeading(overlay);
}
function closeOverlay(overlay) {
  overlay.classList.remove("open");
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}

// Every element a dialog's Tab trap can land on: standard focusable
// tags, plus <iframe> for the monday.com submission form, minus
// anything hidden (offsetParent is null for display:none — covers
// the format buttons and creator-paging arrows that only sometimes
// show) or explicitly taken out of the tab order (tabindex="-1", the
// convention used for each dialog's own heading).
function getFocusableIn(container) {
  const selector = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), iframe, [tabindex]:not([tabindex="-1"])';
  return [...container.querySelectorAll(selector)].filter((el) => el.offsetParent !== null);
}

// Keeps Tab/Shift+Tab cycling within whichever dialog is currently
// open, instead of escaping into the tank/header/buttons behind it.
window.addEventListener("keydown", (e) => {
  if (e.key !== "Tab") return;
  const openOverlayEl = document.querySelector(".card-overlay.open");
  if (!openOverlayEl) return;
  const focusables = getFocusableIn(openOverlayEl);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
});

// Safety net for the common trap's blind spot: the submission form
// is a third-party (monday.com) iframe, so the parent page can't see
// Tab presses made once focus is inside it — tabbing backward out of
// it would otherwise land wherever the browser's native tab order
// puts it, which could be the tank behind the dialog. Whenever focus
// lands outside the open dialog for any reason, pull it back in.
document.addEventListener("focusin", (e) => {
  const openOverlayEl = document.querySelector(".card-overlay.open");
  if (!openOverlayEl || openOverlayEl.contains(e.target)) return;
  const focusables = getFocusableIn(openOverlayEl);
  if (focusables.length) focusables[0].focus();
});

infoBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  openOverlay(infoOverlay, infoBtn);
});
document.getElementById("infoClose").addEventListener("click", () => closeOverlay(infoOverlay));
infoOverlay.addEventListener("click", (e) => { if (e.target === infoOverlay) closeOverlay(infoOverlay); });

   Below ~640px (see the CSS), search/info/feed/sound/lang collapse
   behind this one button instead of staying permanently parked over
   the tank. Only mattered/visible on mobile — CSS keeps it hidden

menuToggleBtn.setAttribute("aria-expanded", "false");
topControls.prepend(menuToggleBtn);

function setMobileMenuOpen(open) {

  menuToggleBtn.setAttribute("aria-expanded", String(open));
}
menuToggleBtn.addEventListener("click", (e) => {
  e.stopPropagation();

});
// Picking any control inside closes the menu back up rather than
// leaving it open over whatever just happened. Capture phase, since
// each of these buttons calls stopPropagation() in its own click
// handler (originally so clicking them doesn't also start a tank
// drag) — that would block a normal bubble-phase listener here, but

/* --- "Find a fish" search ----------------------------------------
   A keyboard- and screen-reader-accessible way to reach any fish's
   card directly, instead of hovering or clicking a moving target in
   the orbiting tank — which pointer-only interaction can't reach at
   all. Built as a combobox + listbox (WAI-ARIA pattern): arrow keys
   move through matches, Enter opens the highlighted one, and an
   empty query lists every fish — so this doubles as a plain
   browsable list of everyone in the tank, not just a name lookup. */
const searchBtn = document.createElement("button");
searchBtn.className = "search-btn";
searchBtn.textContent = "🔍";
document.getElementById("topControls").appendChild(searchBtn);

const searchOverlay = document.getElementById("searchOverlay");
const searchInput = document.getElementById("searchInput");
const searchResultsEl = document.getElementById("searchResults");
const searchStatusEl = document.getElementById("searchStatus");
let searchMatches = [];   // FISH indexes currently listed, in display order
let searchActive = -1;    // index into searchMatches; -1 = none highlighted
// A blank query matches every fish in the tank ("browse everyone" —
// see searchBrowseAll below), so this caps how many of those matches
// actually get listed/rendered. Without it, a tank with hundreds of
// fish would build hundreds of <li> elements (each with its own
// click + hover listener) in one go every time the query changes,
// and nobody wants to scroll through hundreds of names anyway —
// typing narrows it down well before that's needed.
const SEARCH_RESULT_CAP = 50; // keep in sync with the {n} in TEXT.searchTruncated

// Accent-insensitive, so typing "elie" still finds "Élie"
function normalizeForSearch(str) {
  return (str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function renderSearchResults(query) {
  const q = normalizeForSearch(query.trim());
  const matchingIndexes = FISH.map((_, i) => i)
    .filter((i) => !q ||
      normalizeForSearch(FISH[i].creator).includes(q) ||
      normalizeForSearch(FISH[i].name).includes(q));

  // Collapse to one row per creator (see creatorKey) — a prolific
  // creator's fish would otherwise repeat their name over and over.
  // The representative is their first matching fish in FISH order;
  // the card's existing prev/next arrows already let people page
  // through the rest once they open it, so no separate browsing UI
  // is needed here.
  const seenCreators = new Set();
  const allMatches = [];
  matchingIndexes.forEach((i) => {
    const key = creatorKey(FISH[i]);
    if (seenCreators.has(key)) return;
    seenCreators.add(key);
    allMatches.push(i);
  });
  allMatches.sort((a, b) => FISH[a].creator.localeCompare(FISH[b].creator));
  searchMatches = allMatches.slice(0, SEARCH_RESULT_CAP);

  searchActive = -1;
  searchInput.removeAttribute("aria-activedescendant");
  searchResultsEl.innerHTML = "";
  searchMatches.forEach((fishIndex, row) => {
    const f = FISH[fishIndex];
    const hasSiblings = creatorFishIndexes(creatorKey(f)).length > 1;
    const li = document.createElement("li");
    li.id = "searchOption-" + row;
    li.className = "search-result";
    li.setAttribute("role", "option");
    // Once a creator has more than one fish, their own fish.name (if
    // any) belongs to just one of several — showing it here would
    // misrepresent the group, so just the creator name is shown.
    const label = !hasSiblings && f.name ? `${f.name} — ${TEXT[lang].by} ${f.creator}` : f.creator;
    // alt="" -- decorative here, since the visible name span right
    // next to it already gives a screen reader everything it needs;
    // a real alt would just announce the same thing twice.
    const thumb = document.createElement("img");
    thumb.src = f.image;
    thumb.alt = "";
    thumb.loading = "lazy";
    const name = document.createElement("span");
    name.className = "search-result-name";
    name.textContent = label;
    li.title = label;
    li.append(thumb, name);
    li.addEventListener("click", () => selectSearchResult(row));
    // Mouse hover and keyboard arrows share the same "active" state
    li.addEventListener("pointerenter", () => setSearchActive(row));
    searchResultsEl.appendChild(li);
  });

  const t = TEXT[lang];
  if (!allMatches.length) {
    searchStatusEl.textContent = q ? t.searchNone : t.searchBrowseAll;
  } else if (allMatches.length > SEARCH_RESULT_CAP) {
    searchStatusEl.textContent = t.searchTruncated.replace("{n}", SEARCH_RESULT_CAP);
  } else {
    searchStatusEl.textContent = q ? t.searchCount : t.searchBrowseAll;
  }

  searchInput.setAttribute("aria-expanded", searchMatches.length ? "true" : "false");
}

function setSearchActive(row) {
  searchActive = row;
  [...searchResultsEl.children].forEach((li, i) => li.classList.toggle("active", i === row));
  if (row >= 0) {
    searchInput.setAttribute("aria-activedescendant", "searchOption-" + row);
    searchResultsEl.children[row].scrollIntoView({ block: "nearest" });
  } else {
    searchInput.removeAttribute("aria-activedescendant");
  }
}

function selectSearchResult(row) {
  const fishIndex = searchMatches[row];
  if (fishIndex === undefined) return;
  // Search stays open behind the card (see #cardOverlay's z-index)
  // instead of closing here, so closing the card lands you right back
  // in the gallery instead of the bare tank -- picking another fish,
  // or another round of Random, doesn't need reopening search first.
  locateFish(fishIndex, searchInput);
}

// Jumps to a fish's card even when it's in a school that isn't
// currently on screen — switches schools first. No animated
// swim-through for this jump; the card covers the tank a moment
// later anyway, so the cut isn't visible the way it would be for
// the prev/next arrows.
function locateFish(index, trigger) {
  const targetSchool = Math.floor(index / SCHOOL_SIZE);
  const needsSchoolSwitch = targetSchool !== schoolIndex;
  if (needsSchoolSwitch) {
    schoolIndex = targetSchool;
    setSchoolVisibility();
    updateDots();
    warmAdjacentSchools(schoolIndex);
  }
  openCard(index, trigger, { instant: needsSchoolSwitch });
}

searchBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  // Focus goes straight into the input (not the heading, unlike
  // openOverlay's default) so someone can start typing right away.
  lastFocused = searchBtn;
  searchOverlay.classList.add("open");
  searchInput.value = "";
  renderSearchResults("");

});

searchOverlay.addEventListener("click", (e) => { if (e.target === searchOverlay) closeOverlay(searchOverlay); });

// Always picks from the whole tank, not whatever's currently typed in
// the search box -- scoping it to the current (possibly narrow, or
// empty from a typo) search would make it feel broken rather than
// surprising. Rerolls once on a repeat so two clicks in a row don't
// land on the same fish. Search stays open behind the card (see
// selectSearchResult()'s own comment) so closing the card lands you
// right back here, ready to roll again without reopening search.
let lastRandomFishIndex = -1;
document.getElementById("randomFishBtn").addEventListener("click", () => {
  if (!FISH.length) return;
  let index;
  do { index = Math.floor(Math.random() * FISH.length); }
  while (FISH.length > 1 && index === lastRandomFishIndex);
  lastRandomFishIndex = index;
  locateFish(index, searchInput);
});

searchInput.addEventListener("input", () => renderSearchResults(searchInput.value));
searchInput.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") {
    if (!searchMatches.length) return;
    e.preventDefault();
    setSearchActive(Math.min(searchActive + 1, searchMatches.length - 1));
  } else if (e.key === "ArrowUp") {
    if (!searchMatches.length) return;
    e.preventDefault();
    setSearchActive(Math.max(searchActive - 1, 0));
  } else if (e.key === "Enter") {
    if (!searchMatches.length) return;
    e.preventDefault();
    selectSearchResult(searchActive >= 0 ? searchActive : 0);
  }
  // Escape is left to the page-wide handler below, same as every
  // other pop-up.
});

// Escape closes whichever pop-up is currently open, from anywhere.
// The fish detail card tracks its own currentCardIndex/.reveal state
// (closeOverlay doesn't know about either), so it gets its own
// closeCard() instead of reusing closeOverlay like the others.
window.addEventListener("keydown", (e) => {

  const open = document.querySelector(".card-overlay.open");

  if (open.id === "cardOverlay") closeCard();

});

// button (up to 190px vs ~44px), so centering it on the button's
// small vertical center pushes the logo's bottom edge past the
// viewport — it was computing a negative `bottom` and getting
// cropped by the screen. Desktop keeps its plain CSS position.

  function centerLogoOnCreateBtn() {

/* --- Drag to rotate -------------------------------------------- */
let rotation = 0;
let dragVelocity = 0;
let isDragging = false;
let wasDragged = false;
let lastPointerX = 0;

/* Drag sound: the water "grabs" while you hold, and lets go when
   you do. preservesPitch is turned off so changing playbackRate
   bends the pitch — dragging fast scrubs the sound higher, like a
   record scratch, but underwater. Quick fades avoid pops. */
let dragAudio = null;
let dragFade = null;

function startDragSound() {
  if (!SETTINGS.dragSound || !soundOn) return;
  if (!dragAudio) {
    dragAudio = new Audio(SETTINGS.dragSound);
    dragAudio.loop = true;
    dragAudio.preservesPitch = false;
    dragAudio.webkitPreservesPitch = false;
  }
  clearInterval(dragFade);
  dragAudio.volume = 0;
  dragAudio.playbackRate = 1;
  dragAudio.currentTime = 0;
  dragAudio.play().catch(() => {});
  dragFade = setInterval(() => {          // fade in (~100ms)
    dragAudio.volume = Math.min(0.25, dragAudio.volume + 0.05);
    if (dragAudio.volume >= 0.25) clearInterval(dragFade);
  }, 20);
}

function stopDragSound() {
  if (!dragAudio) return;
  clearInterval(dragFade);
  dragFade = setInterval(() => {          // fade out (~150ms)
    dragAudio.volume = Math.max(0, dragAudio.volume - 0.04);
    if (dragAudio.volume <= 0) { dragAudio.pause(); clearInterval(dragFade); }
  }, 20);
}

window.addEventListener("pointerdown", (e) => {
  // .card-overlay is each modal's own full-screen backdrop (the
  // element a backdrop click closes the modal against, e.g.
  // searchOverlay's own click handler below) -- without it here, a
  // backdrop click to close ANY modal also fell through to the tank
  // drag logic underneath it: the cursor became "grabbing", the drag
  // sound played, and any tiny pointer movement between down/up
  // (ordinary hand tremor during a click) rotated the tank behind the
  // modal that was supposedly just closing.
  if (e.target.closest(".create-btn, .sound-btn, .lang-btn, .night-btn, .info-btn, .search-btn, .fullscreen-btn, .menu-toggle-btn, .school-arrow, .school-dots, .card, .card-overlay")) return;
  isDragging = true;
  wasDragged = false;
  lastPointerX = e.clientX;
  document.body.classList.add("dragging");
  startDragSound();
});
window.addEventListener("pointermove", (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastPointerX;
  lastPointerX = e.clientX;
  if (Math.abs(dx) > 2) wasDragged = true;
  rotation += dx * 0.004;
  dragVelocity = dx * 0.004;

  // The scratch: drag speed bends the sound's pitch (0.8x–1.6x).
  // Delete these three lines for a steady, un-bent drag sound.
  if (dragAudio && !dragAudio.paused) {
    dragAudio.playbackRate = 0.8 + Math.min(Math.abs(dx) / 12, 1) * 0.8;
  }
});
function endDrag() {
  if (isDragging) stopDragSound();
  isDragging = false;
  document.body.classList.remove("dragging");
}
window.addEventListener("pointerup", endDrag);
// Fires instead of pointerup when the browser takes the gesture over
// mid-drag (e.g. an edge-swipe or OS gesture on mobile) — without
// this, isDragging never resets and the carousel stays frozen.
window.addEventListener("pointercancel", endDrag);

/* --- Calm mode ---------------------------------------------------
   After 3 seconds without any input, the interface fades away and
   the visitor is left with just the fish and the water. The first
   twitch of the mouse (or any key/touch) brings everything back.
   The UI never hides mid-drag or while a pop-up is open. --------- */
let calmTimer = null;

function scheduleCalm() {
  clearTimeout(calmTimer);
  calmTimer = setTimeout(() => {
    if (isDragging || document.querySelector(".card-overlay.open")) {
      scheduleCalm();          // busy — check again in a few seconds
      return;
    }
    document.body.classList.add("calm");
  }, 3000);
}

function wakeUI() {
  document.body.classList.remove("calm");
  scheduleCalm();
}

["pointermove", "pointerdown", "keydown", "wheel", "touchstart"]
  .forEach((ev) => window.addEventListener(ev, wakeUI, { passive: true }));
scheduleCalm();

/* --- The orbit engine: runs ~60 frames per second --------------
   Each fish sits at an angle on an invisible carousel:
     x = cos(angle) → left/right position
     z = sin(angle) → depth: -1 back … +1 front
   Depth drives scale, opacity, blur, and stacking order — that's
   what creates the 3D feeling on a flat screen. ----------------- */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastTime = performance.now();

function animate(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  // School transition: ease the leaving school off one side, then
  // ease the arriving school in from the other (500ms each phase)
  if (schoolAnim) {
    const p = Math.min(1, (now - schoolAnim.start) / 500);
    if (schoolAnim.phase === "out") {
      schoolOffset = -schoolAnim.dir * window.innerWidth * 1.2 * (p * p);
      if (p >= 1) {
        schoolIndex = schoolAnim.next;
        setSchoolVisibility();
        updateDots();
        warmAdjacentSchools(schoolIndex);
        schoolAnim.phase = "in";
        schoolAnim.start = now;
      }
    } else {
      const q = 1 - Math.pow(1 - p, 3);   // decelerate into place
      schoolOffset = schoolAnim.dir * window.innerWidth * 1.2 * (1 - q);
      if (p >= 1) { schoolAnim = null; schoolOffset = 0; }
    }
  }

  if (!isDragging && !reduceMotion) {
    rotation += ORBIT.speed * dt;
  }
  if (!isDragging) {
    rotation += dragVelocity;
    dragVelocity *= 0.95;   // drag momentum fades out
  }

  const cx = window.innerWidth / 2;
  const orbitRadius = window.innerWidth * ORBIT.radiusX;

  // Fish sizes in the FISH array are tuned for a desktop-width tank.
  // The orbit radius above already shrinks proportionally on narrow
  // screens (it's a fraction of innerWidth), but fish themselves were
  // still a fixed pixel width regardless of viewport — on a phone
  // that meant a ~150px fish taking up a third of the screen, and a
  // packed-looking school as a result. Scaling it down here (read
  // fresh every frame, so rotating the phone adjusts it immediately)
  // keeps the fish proportioned to the orbit the same way at every
  // screen size. 900px is roughly where the tank stops feeling
  // crowded at full size; below that, fish shrink down to a 55% floor
  // so they don't get too small to read the artwork on tiny phones.
  const fishSizeScale = Math.max(0.55, Math.min(1, window.innerWidth / 900));

  for (const fish of swimmers) {
    if (!fish.active) continue;   // fish in other schools sit this out

    const a = fish.angle + rotation;
    const x = Math.cos(a);
    const z = Math.sin(a);

    const scale   = mapRange(z, -1, 1, ORBIT.farScale, ORBIT.nearScale);
    const opacity = mapRange(z, -1, 1, ORBIT.farOpacity, 1);
    const blur    = mapRange(z, -1, 1, ORBIT.farBlur, 0);
    const bob = reduceMotion ? 0
      : Math.sin(now / 1000 + fish.bobOffset) * ORBIT.bobAmount;

    const screenX = cx + x * orbitRadius * fish.radiusJitter + schoolOffset;
    const screenY = window.innerHeight * (fish.height / 100) + bob;

    // Fish face where they're going; art is drawn facing left, so
    // the flip wrapper mirrors it on the back half of the carousel
    // (only the artwork — tags and thought bubbles stay readable).
    const facing = z < 0 ? -1 : 1;
    if ((facing < 0) !== fish.flipped) {
      fish.flipped = facing < 0;
      fish.flipEl.style.transform = `scaleX(${facing})`;
      fish.el.classList.toggle("flipped", fish.flipped);
    }

    const renderedSize = fish.size * fishSizeScale;
    fish.el.style.width = renderedSize + "px";
    fish.el.style.transform =
      `translate(${screenX - renderedSize / 2}px, ${screenY}px) scale(${scale})`;
    fish.el.style.opacity = fish.hovered ? 1 : opacity;
    // Hovered fish un-blur so the name tag and bubble stay crisp
    const totalBlur = fish.hovered ? 0 : blur;
    fish.el.style.filter =
      totalBlur > 0.15 ? `blur(${totalBlur}px)` : "none";
    fish.el.style.zIndex = fish.hovered
      ? 500
      : Math.round(mapRange(z, -1, 1, 10, 300));
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* --- Detail card -------------------------------------------------
   Opening a card fills in its content and pops the art in with a
   CSS animation (.reveal — see the CSS). Used to instead animate a
   cloned copy of the clicked fish flying from its spot in the school
   to the card, tracked across a few requestAnimationFrame steps —
   it looked nice but could break: opening a second fish before the
   first one's flight finished left the first fish permanently
   hidden in the tank, since there was only ever one "currently
   flying" flag to restore on close. Plain CSS has no per-fish
   position to track and nothing that can get left in a bad state. */
const overlay = document.getElementById("cardOverlay");
const cardEl = overlay.querySelector(".card");
let currentCardIndex = null; // whichever fish the card is showing right now

// What actually identifies "the same creator" for grouping purposes.
// Two different people can type the same display name (two "Emily"s),
// so grouping by fish.creator alone would wrongly merge them. Fish
// added through the submission pipeline carry a creatorId derived
// from their (never-published) email instead; older hand-entered
// fish have no creatorId, so those fall back to matching by name.
function creatorKey(fish) {
  return fish.creatorId || fish.creator;
}

// Every fish index sharing this creator, in FISH order — used for the
// paging arrows so someone can browse straight through one creator's
// fish without returning to search each time.
function creatorFishIndexes(key) {
  return FISH.map((_, i) => i).filter((i) => creatorKey(FISH[i]) === key);
}

const cardPrevBtn = document.getElementById("cardPrev");
const cardNextBtn = document.getElementById("cardNext");

function stepCreatorFish(dir) {
  if (currentCardIndex === null) return;
  const siblings = creatorFishIndexes(creatorKey(FISH[currentCardIndex]));
  const pos = siblings.indexOf(currentCardIndex);
  if (pos === -1 || siblings.length < 2) return;
  const nextIndex = siblings[(pos + dir + siblings.length) % siblings.length];
  // Same trigger as before (don't overwrite where focus should return
  // to on close). Instant + keeps focus on this arrow so repeated
  // clicks/Enter presses page straight through without re-animating
  // or losing keyboard focus each time.
  openCard(nextIndex, lastFocused, { instant: true, keepFocus: true });
}
cardPrevBtn.addEventListener("click", (e) => { e.stopPropagation(); stepCreatorFish(-1); });
cardNextBtn.addEventListener("click", (e) => { e.stopPropagation(); stepCreatorFish(1); });

// trigger: the element focus should return to when the card closes
// (defaults to whatever was focused, same convention as openOverlay).
// opts.instant: skip the pop-in animation — used by the paging arrows,
// so browsing several of one creator's fish in a row feels snappy
// instead of re-popping on every click.
// opts.keepFocus: don't move focus to the heading — used by the
// paging arrows so focus stays put and repeated presses keep working.
function openCard(index, trigger, opts = {}) {
  const fish = FISH[index];
  lastFocused = trigger || document.activeElement;
  currentCardIndex = index;

  const cardArt = document.getElementById("cardArt");
  cardArt.innerHTML = "";
  const cardImg = document.createElement("img");
  cardImg.src = fish.image;
  cardImg.alt = fish.name || (TEXT[lang].fishAlt + " " + TEXT[lang].by + " " + fish.creator);
  cardImg.onerror = () => { cardImg.style.display = "none"; };
  cardArt.appendChild(cardImg);
  // No fish in this tank has its own name yet, so the creator's name
  // is the real headline; a fish.name (if one's ever added) takes the
  // spotlight instead, with the credit demoted to the eyebrow label.
  document.getElementById("cardEyebrow").textContent =
    fish.name ? TEXT[lang].artworkBy + " " + fish.creator : TEXT[lang].artworkBy;
  const nameEl = document.getElementById("cardName");
  nameEl.style.fontSize = ""; // reset before measuring — a longer
                               // name replacing a shorter one would
                               // otherwise measure against the PREVIOUS
                               // fish's shrunk size instead of the
                               // full CSS size.
  nameEl.textContent = fish.name || fish.creator;
  const bioEl = document.getElementById("cardBio");
  bioEl.textContent = fish.bio || "";
  bioEl.style.display = fish.bio ? "block" : "none";

  // Paging arrows only show up when this creator has more than one
  // fish in the tank — most creators have exactly one, so most cards
  // show no arrows at all.
  const hasSiblings = creatorFishIndexes(creatorKey(fish)).length > 1;
  cardPrevBtn.classList.toggle("shown", hasSiblings);
  cardNextBtn.classList.toggle("shown", hasSiblings);

  overlay.classList.add("open");
  cardEl.classList.toggle("reveal", !opts.instant && !stillMotion);

  // Mobile only: shrink the name to keep it on one line (nowrap in
  // the CSS makes an over-wide name overflow rather than wrap, which
  // is what scrollWidth measures against here) instead of wrapping
  // to two lines, since names vary too much for a fixed font-size to
  // guarantee that on its own. Must run AFTER the overlay opens —
  // clientWidth/scrollWidth both read 0 while its display is still
  // none, which silently skipped this entirely.
  if (window.innerWidth < 640) {
    const available = nameEl.clientWidth;
    const natural = nameEl.scrollWidth;
    if (natural > available) {
      const currentPx = parseFloat(getComputedStyle(nameEl).fontSize);
      nameEl.style.fontSize = (currentPx * available / natural) + "px";
    }
  }

  if (!opts.keepFocus) {
    const heading = document.getElementById("cardName");
    heading.setAttribute("tabindex", "-1");
    heading.focus();
  }
}

function closeCard() {
  overlay.classList.remove("open");
  cardEl.classList.remove("reveal");
  currentCardIndex = null;
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeCard(); });
</script>
</body>
</html>
