# Save this file as: .github/workflows/add-fish.yml
#
# Fires when the Cloudflare Worker tells GitHub a new PSD/Krita fish
# has been submitted. Downloads the file, extracts the artwork, and
# opens a Pull Request with it for review — nothing goes live until
# a human merges that PR (see add_fish.py).

name: Add submitted fish

on:
  repository_dispatch:
    types: [new-fish]
  # Lets you trigger this manually from the Actions tab with test
  # values, without needing a real monday.com submission —
  # useful for testing before the Worker is wired up.
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct URL to a test .psd file"
        required: true
      creator:
        description: "Creator name"
        required: true
      email:
        description: "Creator email (used to group their fish, never published)"
        required: true

# Serializes runs instead of letting simultaneous submissions race:
# next_fish_number() in fish_pipeline.py picks the next number from
# whatever's on `main` at the start of each run, with no locking of
# its own. Two runs starting close together would each check out the
# same `main`, compute the same number, and each open a PR touching
# the same fishN.webp / array-insertion point -- a conflict at best,
# a silently overwritten submission at worst if one PR gets force-
# merged over the other. cancel-in-progress:false queues runs rather
# than dropping a submission that arrived while another was in flight.
concurrency:
  group: add-fish
  cancel-in-progress: false

jobs:
  add-fish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psd-tools Pillow requests

      - name: Run the extraction + site update
        env:
          FISH_FILE_URL: ${{ github.event.client_payload.file_url || inputs.file_url }}
          FISH_CREATOR: ${{ github.event.client_payload.creator || inputs.creator }}
          FISH_CREATOR_EMAIL: ${{ github.event.client_payload.email || inputs.email }}
          FISH_NAME: ${{ github.event.client_payload.name }}
          FISH_BIO: ${{ github.event.client_payload.bio }}
        run: python deploy/automation/add_fish.py

      # Opens a PR instead of publishing straight to main — the image
      # renders inline in GitHub's diff view, so approving is just a
      # visual check + Merge. Rejecting is Close, no revert needed.
      - name: Open a PR for review instead of publishing directly
        env:
          GH_TOKEN: ${{ github.token }}
          CREATOR: ${{ github.event.client_payload.creator || inputs.creator }}
        run: |
          git config user.name "feeling-fishy-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="fish-submission/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add deploy/feeling-fishy/index.html deploy/feeling-fishy/images/fish/
          git commit -m "Add fish from ${CREATOR}"
          git push origin "$BRANCH"
          gh pr create \
            --title "New fish submission: ${CREATOR}" \
            --body "Automated submission awaiting review — check the extracted artwork looks right before merging. Merging publishes it live; closing rejects it." \
            --base main \
            --head "$BRANCH"
